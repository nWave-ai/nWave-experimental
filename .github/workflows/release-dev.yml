# =============================================================================
# Release Train — Stage 1: Dev Release
# =============================================================================
#
# Creates a dev snapshot from HEAD on master.
# Triggered manually via workflow_dispatch.
#
# Pipeline: CI gate → version calc → build → tag + pre-release → Slack
#
# =============================================================================

name: "Release: Dev (Stage 1)"
run-name: "Dev Release${{ inputs.dry_run == true && ' (dry run)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate everything, create nothing)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHON_DEFAULT: "3.12"

concurrency:
  group: release-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # CI STATUS GATE — fail-fast API check (no re-running tests)
  # ===========================================================================
  ci-gate:
    name: "CI Status Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      status: ${{ steps.gate.outputs.status }}
      commit_sha: ${{ steps.sha.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Get HEAD commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Check CI Pipeline status on HEAD
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          SHORT_SHA="${SHA:0:7}"

          # Query CI Pipeline workflow runs for this specific commit
          RUN_JSON=$(gh run list \
            --workflow ci.yml \
            --commit "$SHA" \
            --limit 1 \
            --json status,conclusion,databaseId \
            -q '.[0]' 2>/dev/null || echo "")

          if [[ -z "$RUN_JSON" || "$RUN_JSON" == "null" ]]; then
            echo "::error::No CI Pipeline run found for $SHORT_SHA. Push to trigger CI first."
            echo "status=none" >> $GITHUB_OUTPUT
            exit 3
          fi

          STATUS=$(echo "$RUN_JSON" | jq -r '.status')
          CONCLUSION=$(echo "$RUN_JSON" | jq -r '.conclusion')
          RUN_ID=$(echo "$RUN_JSON" | jq -r '.databaseId')

          echo "CI Pipeline run $RUN_ID: status=$STATUS, conclusion=$CONCLUSION"

          if [[ "$STATUS" != "completed" ]]; then
            echo "::error::CI still running on $SHORT_SHA (run $RUN_ID), retry later."
            echo "status=pending" >> $GITHUB_OUTPUT
            exit 2
          fi

          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::CI failed on $SHORT_SHA (run $RUN_ID, conclusion: $CONCLUSION)."
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "CI Pipeline passed on $SHORT_SHA (run $RUN_ID)"
          echo "status=green" >> $GITHUB_OUTPUT

  # ===========================================================================
  # VERSION CALCULATION — next dev version from existing tags
  # ===========================================================================
  version-calc:
    name: "Calculate Dev Version"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [ci-gate]
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      base_version: ${{ steps.calc.outputs.base_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install dependencies
        run: pip install packaging commitizen

      - name: Read current version from pyproject.toml
        id: current
        run: |
          VERSION=$(python scripts/release/read_toml_field.py \
            --file pyproject.toml --key project.version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Analyze commits with Commitizen
        id: cz
        run: |
          BASE=$(cz bump --get-next 2>/dev/null) || BASE=""
          echo "base_version=$BASE" >> $GITHUB_OUTPUT

      - name: Read version floor
        id: floor
        run: |
          FLOOR=$(python scripts/release/read_toml_field.py \
            --file pyproject.toml --key tool.nwave.public_version 2>/dev/null) || FLOOR=""
          echo "floor=$FLOOR" >> $GITHUB_OUTPUT

      - name: Gather existing dev tags
        id: tags
        run: |
          TAGS=$(git tag -l "v*.dev*" | tr '\n' ',' | sed 's/,$//')
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Calculate next dev version
        id: calc
        run: |
          OUTPUT=$(python scripts/release/next_version.py \
            --stage dev \
            --current-version "${{ steps.current.outputs.version }}" \
            --existing-tags "${{ steps.tags.outputs.tags }}" \
            --base-version "${{ steps.cz.outputs.base_version }}" \
            --version-floor "${{ steps.floor.outputs.floor }}")

          echo "$OUTPUT"

          VERSION=$(echo "$OUTPUT" | jq -r '.version')
          TAG=$(echo "$OUTPUT" | jq -r '.tag')
          BASE=$(echo "$OUTPUT" | jq -r '.base_version')

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "base_version=$BASE" >> $GITHUB_OUTPUT

  # ===========================================================================
  # BUILD — wheel + sdist + checksums
  # ===========================================================================
  build:
    name: "Build Distribution"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ci-gate, version-calc]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev-dist-packages
          path: dist/*
          retention-days: 30

  # ===========================================================================
  # TAG + GITHUB PRE-RELEASE
  # ===========================================================================
  tag-release:
    name: "Tag & GitHub Pre-Release"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci-gate, version-calc, build]
    if: inputs.dry_run != true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: dev-dist-packages
          path: dist

      - name: Create dev tag
        run: |
          TAG="${{ needs.version-calc.outputs.tag }}"
          git config user.name "nWave Release Train"
          git config user.email "noreply@nwave.ai"
          git tag -a "$TAG" -m "Dev release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag $TAG"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Generate changelog
        run: |
          python scripts/release/generate_changelog.py \
            --stage dev \
            --version "${{ needs.version-calc.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --output dist/RELEASE_NOTES.md

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${{ needs.version-calc.outputs.tag }}"

          gh release create "$TAG" \
            --title "Dev Release $TAG" \
            --notes-file dist/RELEASE_NOTES.md \
            --prerelease \
            dist/*.tar.gz dist/*.whl dist/SHA256SUMS.txt

  # ===========================================================================
  # DRY RUN SUMMARY
  # ===========================================================================
  dry-run-summary:
    name: "Dry Run Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [ci-gate, version-calc, build]
    if: inputs.dry_run == true

    steps:
      - name: Report dry run results
        run: |
          echo "## Dry Run Report: Dev Release (Stage 1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CI status gate | CHECKED | ${{ needs.ci-gate.outputs.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version calculation | COMPUTED | ${{ needs.version-calc.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build dist | BUILT | wheel + sdist |" >> $GITHUB_STEP_SUMMARY
          echo "| Create tag | SKIPPED (dry run) | Would create: ${{ needs.version-calc.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub pre-release | SKIPPED (dry run) | Would create pre-release |" >> $GITHUB_STEP_SUMMARY
          echo "| Slack notification | SKIPPED (dry run) | Would notify |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Summary**: Would have tagged \`${{ needs.version-calc.outputs.tag }}\` on commit \`${{ needs.ci-gate.outputs.commit_sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # SLACK NOTIFICATION
  # ===========================================================================
  notify:
    name: "Slack Notification"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: always() && !cancelled() && inputs.dry_run != true
    needs: [ci-gate, version-calc, build, tag-release]

    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.tag-release.result }}" == "success" ]]; then
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "result=failure" >> $GITHUB_OUTPUT
          fi

      - name: Get timestamp
        id: ts
        run: echo "unix=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Send success notification
        if: steps.status.outputs.result == 'success'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "Dev Release: ${{ needs.version-calc.outputs.tag }}", "emoji": true }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "Dev snapshot created from `${{ needs.ci-gate.outputs.commit_sha }}`\n*Version*: `${{ needs.version-calc.outputs.version }}`" }
                },
                {
                  "type": "actions",
                  "elements": [
                    { "type": "button", "text": { "type": "plain_text", "text": "View Release" }, "url": "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.version-calc.outputs.tag }}", "style": "primary" },
                    { "type": "button", "text": { "type": "plain_text", "text": "View Run" }, "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                  ]
                },
                {
                  "type": "context",
                  "elements": [{ "type": "mrkdwn", "text": "Released at: <!date^${{ steps.ts.outputs.unix }}^{date_short_pretty} at {time}|timestamp>" }]
                }
              ]
            }

      - name: Send failure notification
        if: steps.status.outputs.result == 'failure'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "Dev Release FAILED", "emoji": true }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Version*: `${{ needs.version-calc.outputs.version }}`\n*Commit*: `${{ needs.ci-gate.outputs.commit_sha }}`" }
                },
                {
                  "type": "actions",
                  "elements": [
                    { "type": "button", "text": { "type": "plain_text", "text": "View Run" }, "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "style": "danger" }
                  ]
                }
              ]
            }
