# =============================================================================
# Release Train — Stage 2: RC / Beta Release
# =============================================================================
#
# Promotes a tested dev release to RC status.
# Triggered manually via workflow_dispatch with a source dev tag.
#
# Pipeline: validate source → CI gate → version calc → build + build-plugin
#           → tag + pre-release → PyPI publish (pre-release) → sync beta repo → Slack
#
# =============================================================================

name: "Release: RC (Stage 2)"
run-name: "RC Release from ${{ inputs.source_dev_tag || '(auto-latest)' }}${{ inputs.dry_run == true && ' (dry run)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      source_dev_tag:
        description: "Source dev tag (leave empty for latest, or enter e.g. v1.1.23.dev3)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run (validate everything, create nothing)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  PYTHON_DEFAULT: "3.12"

concurrency:
  group: release-rc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # VALIDATE SOURCE — confirm dev tag exists, checkout that commit
  # ===========================================================================
  validate-source:
    name: "Validate Source Dev Tag"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      commit_sha: ${{ steps.resolve.outputs.sha }}
      resolved_tag: ${{ steps.discover.outputs.resolved_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install dependencies
        run: pip install packaging

      - name: Auto-discover or validate source tag
        id: discover
        run: |
          TAG="${{ inputs.source_dev_tag }}"
          TAG=$(echo "$TAG" | xargs)  # trim whitespace

          if [ -z "$TAG" ]; then
            echo "No tag provided, auto-discovering latest dev tag..."
            OUTPUT=$(python scripts/release/discover_tag.py --pattern dev)
          else
            echo "Validating provided tag: $TAG"
            OUTPUT=$(python scripts/release/discover_tag.py --pattern dev --validate "$TAG")
          fi

          echo "$OUTPUT"
          FOUND=$(echo "$OUTPUT" | jq -r '.found')
          if [ "$FOUND" != "true" ]; then
            ERROR=$(echo "$OUTPUT" | jq -r '.error // "Unknown error"')
            echo "::error::$ERROR"
            exit 1
          fi

          RESOLVED=$(echo "$OUTPUT" | jq -r '.tag')
          COMMITS_BEHIND=$(echo "$OUTPUT" | jq -r '.commits_behind // "null"')
          echo "resolved_tag=$RESOLVED" >> $GITHUB_OUTPUT
          echo "commits_behind=$COMMITS_BEHIND" >> $GITHUB_OUTPUT
          echo "Resolved tag: $RESOLVED (commits behind: $COMMITS_BEHIND)"

      - name: Resolve tag to commit
        id: resolve
        run: |
          TAG="${{ steps.discover.outputs.resolved_tag }}"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG not found in git."
            exit 1
          fi

          SHA=$(git rev-parse "$TAG^{commit}")
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Resolved $TAG -> $SHA"

      - name: Staleness warning
        if: steps.discover.outputs.commits_behind != 'null' && steps.discover.outputs.commits_behind != '0'
        run: |
          echo "::warning::Source tag ${{ steps.discover.outputs.resolved_tag }} is ${{ steps.discover.outputs.commits_behind }} commit(s) behind HEAD. Consider creating a fresh dev release."

  # ===========================================================================
  # CI STATUS GATE
  # ===========================================================================
  ci-gate:
    name: "CI Status Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [validate-source]
    outputs:
      status: ${{ steps.gate.outputs.status }}

    steps:
      - uses: actions/checkout@v4

      - name: Check CI Pipeline status on source commit
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          SHA="${{ needs.validate-source.outputs.commit_sha }}"
          SHORT_SHA="${SHA:0:7}"

          RUN_JSON=$(gh run list \
            --workflow ci.yml \
            --commit "$SHA" \
            --limit 1 \
            --json status,conclusion,databaseId \
            -q '.[0]' 2>/dev/null || echo "")

          if [[ -z "$RUN_JSON" || "$RUN_JSON" == "null" ]]; then
            echo "::error::No CI Pipeline run found for $SHORT_SHA. Push to trigger CI first."
            echo "status=none" >> $GITHUB_OUTPUT
            exit 3
          fi

          STATUS=$(echo "$RUN_JSON" | jq -r '.status')
          CONCLUSION=$(echo "$RUN_JSON" | jq -r '.conclusion')
          RUN_ID=$(echo "$RUN_JSON" | jq -r '.databaseId')

          echo "CI Pipeline run $RUN_ID: status=$STATUS, conclusion=$CONCLUSION"

          if [[ "$STATUS" != "completed" ]]; then
            echo "::error::CI still running on $SHORT_SHA (run $RUN_ID), retry later."
            echo "status=pending" >> $GITHUB_OUTPUT
            exit 2
          fi

          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::CI failed on $SHORT_SHA (run $RUN_ID, conclusion: $CONCLUSION)."
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "CI Pipeline passed on $SHORT_SHA (run $RUN_ID)"
          echo "status=green" >> $GITHUB_OUTPUT

  # ===========================================================================
  # VERSION CALCULATION — next RC version
  # ===========================================================================
  version-calc:
    name: "Calculate RC Version"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [validate-source, ci-gate]
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      base_version: ${{ steps.calc.outputs.base_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install dependencies
        run: pip install packaging

      - name: Gather existing RC tags
        id: tags
        run: |
          TAGS=$(git tag -l "v*rc*" | tr '\n' ',' | sed 's/,$//')
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Calculate next RC version
        id: calc
        run: |
          OUTPUT=$(python scripts/release/next_version.py \
            --stage rc \
            --current-version "${{ needs.validate-source.outputs.resolved_tag }}" \
            --existing-tags "${{ steps.tags.outputs.tags }}")

          echo "$OUTPUT"

          VERSION=$(echo "$OUTPUT" | jq -r '.version')
          TAG=$(echo "$OUTPUT" | jq -r '.tag')
          BASE=$(echo "$OUTPUT" | jq -r '.base_version')

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "base_version=$BASE" >> $GITHUB_OUTPUT

  # ===========================================================================
  # BUILD — from the exact source commit
  # ===========================================================================
  build:
    name: "Build Distribution"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-source, ci-gate, version-calc]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-source.outputs.commit_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rc-dist-packages
          path: dist/*
          retention-days: 30

  # ===========================================================================
  # BUILD PLUGIN — Claude Code plugin directory
  # ===========================================================================
  build-plugin:
    name: "Build Plugin"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-source, version-calc]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-source.outputs.commit_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Validate version format
        run: |
          VERSION="${{ needs.version-calc.outputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi

      - name: Build plugin
        run: python3 scripts/build_plugin.py --output-dir plugin/

      - name: Validate plugin
        run: |
          python3 -c "
          from scripts.build_plugin import validate
          from pathlib import Path
          result = validate(Path('plugin'))
          if not result.success:
              for err in result.errors:
                  print(f'::error::{err}')
              exit(1)
          print('Plugin validation passed')
          for section, ok in result.sections.items():
              print(f'  {section}: {\"OK\" if ok else \"FAIL\"}')
          "

      - name: Package plugin as ZIP
        env:
          VERSION: ${{ needs.version-calc.outputs.version }}
        run: |
          cd plugin
          zip -r ../nwave-plugin-v${VERSION}.zip .
          cd ..
          echo "Created nwave-plugin-v${VERSION}.zip"
          ls -lh nwave-plugin-v${VERSION}.zip

      - name: Validate ZIP integrity
        env:
          VERSION: ${{ needs.version-calc.outputs.version }}
        run: |
          mkdir -p /tmp/plugin-verify
          unzip -q nwave-plugin-v${VERSION}.zip -d /tmp/plugin-verify
          python3 -c "
          from scripts.build_plugin import validate
          from pathlib import Path
          result = validate(Path('/tmp/plugin-verify'))
          if not result.success:
              for err in result.errors:
                  print(f'::error::ZIP verification: {err}')
              exit(1)
          print('ZIP integrity verified')
          "

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: rc-nwave-plugin
          path: nwave-plugin-v${{ needs.version-calc.outputs.version }}.zip
          retention-days: 30

  # ===========================================================================
  # TAG + GITHUB PRE-RELEASE
  # ===========================================================================
  tag-release:
    name: "Tag & GitHub Pre-Release"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate-source, version-calc, build, build-plugin]
    if: inputs.dry_run != true
    outputs:
      changes: ${{ steps.changes.outputs.summary }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: rc-dist-packages
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: rc-nwave-plugin
          path: dist

      - name: Create RC tag on source commit
        run: |
          TAG="${{ needs.version-calc.outputs.tag }}"
          SHA="${{ needs.validate-source.outputs.commit_sha }}"
          git config user.name "nWave Release Train"
          git config user.email "noreply@nwave.ai"
          git tag -a "$TAG" "$SHA" -m "RC release $TAG (promoted from ${{ needs.validate-source.outputs.resolved_tag }})"
          git push origin "$TAG"
          echo "Created and pushed tag $TAG on $SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install changelog dependencies
        run: pip install packaging

      - name: Generate changelog
        run: |
          python scripts/release/generate_changelog.py \
            --stage rc \
            --version "$VERSION" \
            --source-tag "$SOURCE_TAG" \
            --repo "nWave-ai/nwave-beta" \
            --output dist/RELEASE_NOTES.md
        env:
          VERSION: ${{ needs.version-calc.outputs.version }}
          SOURCE_TAG: ${{ needs.validate-source.outputs.resolved_tag }}

      - name: Extract change summary for Slack
        id: changes
        run: |
          SUMMARY=$(python3 << 'PYEOF'
          import re, json
          with open("dist/RELEASE_NOTES.md") as f:
              lines = f.readlines()
          changes = []
          for line in lines:
              line = line.strip()
              if line.startswith("- "):
                  clean = re.sub(r' \(`[a-f0-9]+`\)$', '', line)
                  changes.append(clean[2:])
          summary = "\n".join(changes[:10]) if changes else "Internal improvements"
          encoded = json.dumps(summary, ensure_ascii=False)
          print(encoded[1:-1])
          PYEOF
          )
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${{ needs.version-calc.outputs.tag }}"

          gh release create "$TAG" \
            --title "RC Release $TAG" \
            --notes-file dist/RELEASE_NOTES.md \
            --prerelease \
            dist/*.tar.gz dist/*.whl dist/SHA256SUMS.txt dist/nwave-plugin-v*.zip

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: rc-release-notes
          path: dist/RELEASE_NOTES.md
          retention-days: 5

  # ===========================================================================
  # PYPI PUBLISH (pre-release)
  # ===========================================================================
  pypi-publish:
    name: "Publish to PyPI (RC)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-source, version-calc, build, tag-release]
    if: inputs.dry_run != true
    environment: beta

    steps:
      - name: Checkout nwave-ai/nwave (target for build)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-source.outputs.commit_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install tools
        run: pip install build packaging tomli

      - name: Clean broken symlinks
        run: find . -maxdepth 5 -type l ! -exec test -e {} \; -delete 2>/dev/null || true

      - name: Patch pyproject.toml for nwave-ai
        run: |
          python scripts/release/patch_pyproject.py \
            --input pyproject.toml \
            --output pyproject.toml \
            --target-name nwave-ai \
            --target-version "${{ needs.version-calc.outputs.version }}"

      - name: Stamp nwave_ai version
        run: |
          sed -i 's/__version__ = ".*"/__version__ = "${{ needs.version-calc.outputs.version }}"/' nwave_ai/__init__.py

      - name: Build nwave-ai package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

  # ===========================================================================
  # SYNC TO BETA REPO
  # ===========================================================================
  sync-beta:
    name: "Sync to nWave-beta"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-source, version-calc, build, build-plugin, tag-release]
    if: inputs.dry_run != true

    steps:
      - name: Checkout nwave-dev (source)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-source.outputs.commit_sha }}
          path: source

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install dependencies
        run: pip install packaging tomli

      - name: Checkout nWave-beta (target)
        uses: actions/checkout@v4
        with:
          repository: nwave-ai/nWave-beta
          token: ${{ secrets.RELEASETRAIN }}
          path: beta-target

      - name: Sync files
        run: |
          find source/ -maxdepth 5 -type l ! -exec test -e {} \; -delete 2>/dev/null || true
          rm -rf beta-target/docs/

          set +e
          rsync -avL --delete \
            --exclude '.git' \
            --exclude '.git*' \
            --exclude '.github/' \
            --exclude 'beta-target/' \
            --exclude 'source/' \
            --exclude 'CLAUDE.local.md' \
            --exclude 'SESSION_STATE*' \
            --exclude 'build.log' \
            --exclude 'setup.cfg' \
            --exclude 'Pipfile' \
            --exclude 'Pipfile.lock' \
            --exclude '_tmp/' \
            --exclude 'htmlcov/' \
            --exclude 'reports/' \
            --exclude 'mutants/' \
            --exclude 'nwave.egg-info/' \
            --exclude 'nwave-ai.egg-info/' \
            --exclude '.execute-command-updated' \
            --exclude '.dependency-map.yaml' \
            --include 'docs/' \
            --include 'docs/guides/' \
            --include 'docs/guides/**' \
            --include 'docs/reference/' \
            --include 'docs/reference/**' \
            --exclude 'docs/*' \
            --exclude 'nWave/checklists/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '.mypy_cache/' \
            --exclude '.ruff_cache/' \
            --exclude '.coverage' \
            --exclude '.DS_Store' \
            --exclude '.venv/' \
            --exclude '.des/' \
            --exclude '.nwave/' \
            --exclude '.nwave-audit.log' \
            --exclude '.mutmut-cache' \
            --exclude '*.sqlite' \
            --exclude 'test-des-hooks/' \
            --exclude 'test-des-manual/' \
            --exclude 'CHANGELOG.md' \
            --exclude '.commitlintrc.json' \
            --exclude '.pre-commit-config.yaml' \
            --exclude '.mcp.json' \
            --exclude 'requirements.lock' \
            source/ beta-target/
          RSYNC_EXIT=$?
          set -e
          if [[ $RSYNC_EXIT -ne 0 && $RSYNC_EXIT -ne 24 ]]; then
            exit $RSYNC_EXIT
          fi

      - name: Patch pyproject.toml for beta
        working-directory: source
        run: |
          python scripts/release/patch_pyproject.py \
            --input ../beta-target/pyproject.toml \
            --output ../beta-target/pyproject.toml \
            --target-name nwave-ai \
            --target-version "${{ needs.version-calc.outputs.version }}"

      - name: Rewrite README links
        run: |
          sed -i.bak 's|](docs/|](https://github.com/nwave-ai/nWave-beta/tree/main/docs/|g' beta-target/README.md
          rm -f beta-target/README.md.bak

      - name: Compose traceability commit message
        id: trace
        working-directory: source
        run: |
          MSG=$(python scripts/release/trace_message.py \
            --stage rc \
            --version "${{ needs.version-calc.outputs.version }}" \
            --commit-sha "${{ needs.validate-source.outputs.commit_sha }}" \
            --dev-tag "${{ needs.validate-source.outputs.resolved_tag }}" \
            --pipeline-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit and push to beta repo
        working-directory: beta-target
        run: |
          git config user.name "nWave Release Train"
          git config user.email "noreply@nwave.ai"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "${{ steps.trace.outputs.message }}"
            git push
          fi

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: rc-release-notes
          path: release-notes

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: rc-nwave-plugin
          path: release-assets

      - name: Tag and release on beta repo
        working-directory: beta-target
        env:
          GH_TOKEN: ${{ secrets.RELEASETRAIN }}
        run: |
          TAG="${{ needs.version-calc.outputs.tag }}"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "RC release $TAG"
            git push origin "$TAG"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "nwave-ai $TAG (RC)" \
              --notes-file ../release-notes/RELEASE_NOTES.md \
              --prerelease \
              ../release-assets/nwave-plugin-v*.zip
          fi

  # ===========================================================================
  # DRY RUN SUMMARY
  # ===========================================================================
  dry-run-summary:
    name: "Dry Run Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [validate-source, ci-gate, version-calc, build, build-plugin]
    if: inputs.dry_run == true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-source.outputs.commit_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install dependencies
        run: pip install packaging tomli

      - name: Compose dry-run traceability message
        id: trace
        run: |
          MSG=$(python scripts/release/trace_message.py \
            --stage rc \
            --version "${{ needs.version-calc.outputs.version }}" \
            --commit-sha "${{ needs.validate-source.outputs.commit_sha }}" \
            --dev-tag "${{ needs.validate-source.outputs.resolved_tag }}" \
            --pipeline-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Report dry run results
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'SUMMARY'
          ## Dry Run Report: RC Release (Stage 2)

          | Step | Status | Result |
          |------|--------|--------|
          | Validate source | CHECKED | ${{ needs.validate-source.outputs.resolved_tag }} -> ${{ needs.validate-source.outputs.commit_sha }} |
          | CI status gate | CHECKED | ${{ needs.ci-gate.outputs.status }} |
          | Version calculation | COMPUTED | ${{ needs.version-calc.outputs.version }} |
          | Build dist | BUILT | wheel + sdist |
          | Build plugin | BUILT | nwave-plugin-v${{ needs.version-calc.outputs.version }}.zip |
          | Create RC tag | SKIPPED (dry run) | Would create: ${{ needs.version-calc.outputs.tag }} |
          | PyPI publish | SKIPPED (dry run) | Would publish RC to PyPI |
          | Sync beta repo | SKIPPED (dry run) | Would sync to nWave-beta |
          | Slack notification | SKIPPED (dry run) | Would notify |

          **Traceability message**:
          ```
          ${{ steps.trace.outputs.message }}
          ```

          **Summary**: Would have tagged `${{ needs.version-calc.outputs.tag }}` on commit `${{ needs.validate-source.outputs.commit_sha }}`
          SUMMARY

  # ===========================================================================
  # SLACK NOTIFICATION
  # ===========================================================================
  notify:
    name: "Slack Notification"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: always() && !cancelled() && inputs.dry_run != true
    needs: [validate-source, version-calc, build, build-plugin, tag-release, sync-beta]

    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.tag-release.result }}" == "success" && "${{ needs.sync-beta.result }}" == "success" ]]; then
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "result=failure" >> $GITHUB_OUTPUT
          fi

      - name: Get timestamp
        id: ts
        run: echo "unix=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Send success notification
        if: steps.status.outputs.result == 'success'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "RC Release: ${{ needs.version-calc.outputs.tag }}", "emoji": true }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "Promoted from `${{ needs.validate-source.outputs.resolved_tag }}` (${{ inputs.source_dev_tag != '' && 'manually specified' || 'auto-discovered' }})\n*Install*: `pipx install nwave-ai==${{ needs.version-calc.outputs.version }} --pip-args=\"--pre\"`\nSynced to *nWave-beta* with tag + GitHub pre-release" }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Changes*:\n${{ needs.tag-release.outputs.changes }}" }
                },
                {
                  "type": "actions",
                  "elements": [
                    { "type": "button", "text": { "type": "plain_text", "text": "View Release" }, "url": "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.version-calc.outputs.tag }}", "style": "primary" },
                    { "type": "button", "text": { "type": "plain_text", "text": "View Run" }, "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                  ]
                },
                {
                  "type": "context",
                  "elements": [{ "type": "mrkdwn", "text": "Triggered by *${{ github.actor }}* · Released at: <!date^${{ steps.ts.outputs.unix }}^{date_short_pretty} at {time}|timestamp>" }]
                }
              ]
            }

      - name: Send failure notification
        if: steps.status.outputs.result == 'failure'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
