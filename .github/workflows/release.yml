# =============================================================================
# nWave Framework Release Pipeline
# =============================================================================
#
# Manual release workflow. Triggered by:
#   1. workflow_dispatch (Actions UI) - bumps version, builds, releases, publishes
#   2. Tag push (v*) - builds, releases, publishes (skip version bump)
#
# Jobs:
#   - version-bump: Calculate next semver, update files, create tag, push
#   - build: Extract version, validate, create packages from nWave/ source
#   - github-release: Create GitHub Release with changelog and assets
#   - publish-to-nwave: Sync to nwave-ai/nwave public repo
#   - notify-slack: Release success/failure notification
#
# =============================================================================

name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      force_bump:
        description: 'Force bump level: patch, minor, or major (leave empty for auto-bump)'
        required: false
        type: choice
        options:
          - ''
          - patch
          - minor
          - major
      dry_run:
        description: 'Dry run (no push, no publish)'
        required: false
        type: boolean
        default: false
permissions:
  contents: write

env:
  PYTHON_DEFAULT: '3.12'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # VERSION BUMP - Only on workflow_dispatch
  # ===========================================================================

  version-bump:
    name: "Version Bump"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch'
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      tag_created: ${{ steps.version.outputs.tag_created }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install python-semantic-release
        run: pip install python-semantic-release

      - name: Calculate version and create tag
        id: version
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "Dry run mode - no changes will be pushed"
            # PSR 10.x: --print outputs the next version without modifying anything
            VERSION=$(semantic-release version --print 2>/dev/null || echo "none")
            echo "tag_created=false" >> $GITHUB_OUTPUT
            echo "new_version=$VERSION" >> $GITHUB_OUTPUT
            echo "Would bump to: $VERSION"
          elif [[ -n "${{ inputs.force_bump }}" ]]; then
            echo "Forcing bump: ${{ inputs.force_bump }}"
            semantic-release version --${{ inputs.force_bump }}
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
            VERSION=${LATEST_TAG#v}
            echo "new_version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag_created=true" >> $GITHUB_OUTPUT
          else
            semantic-release version
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
            VERSION=${LATEST_TAG#v}
            echo "new_version=$VERSION" >> $GITHUB_OUTPUT
            if [[ "$LATEST_TAG" != "none" ]]; then
              echo "tag_created=true" >> $GITHUB_OUTPUT
            else
              echo "tag_created=false" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Read nwave-ai public version
        id: nwave_public
        run: |
          NWAVE_VERSION=$(python3 -c "
          with open('pyproject.toml') as f:
              for line in f:
                  if line.strip().startswith('public_version'):
                      print(line.split('\"')[1])
                      break
          ")
          echo "version=$NWAVE_VERSION" >> $GITHUB_OUTPUT

      - name: Version Summary
        if: success()
        run: |
          echo "## Version Bump" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| **nwave-dev** | \`${{ steps.version.outputs.new_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **nwave-ai** | \`${{ steps.nwave_public.outputs.version }}\` (auto-bumps patch) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag created**: \`${{ steps.version.outputs.tag_created }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Dry run**: \`${{ inputs.dry_run }}\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # BUILD - On dispatch (after version-bump) or tag push
  # ===========================================================================

  build:
    name: "Build Distribution"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [version-bump]
    if: |
      always() &&
      (needs.version-bump.outputs.tag_created == 'true' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version-bump.outputs.new_version && format('v{0}', needs.version-bump.outputs.new_version) || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel pipenv
          pipenv install --dev

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ needs.version-bump.outputs.new_version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Verify version consistency
        run: |
          TAG_VERSION="${{ steps.get_version.outputs.VERSION }}"
          CATALOG_VERSION=$(pipenv run python3 -c "import yaml; print(yaml.safe_load(open('nWave/framework-catalog.yaml'))['version'])")

          if [ "$TAG_VERSION" != "$CATALOG_VERSION" ]; then
            echo "::error::Version mismatch - tag: ${TAG_VERSION}, catalog: ${CATALOG_VERSION}"
            exit 1
          fi

      - name: Build distribution
        run: |
          pipenv run python3 scripts/build_dist.py

      - name: Create GitHub tarballs
        run: |
          pipenv run python3 scripts/framework/create_github_tarballs.py \
            --version ${{ steps.get_version.outputs.VERSION }} \
            --source-dir dist \
            --output-dir dist/releases

      - name: Generate checksums
        run: |
          cd dist/releases
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/releases/*
          retention-days: 90

  # ===========================================================================
  # GITHUB RELEASE - Create release with changelog
  # ===========================================================================

  github-release:
    name: "GitHub Release"
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/releases

      - name: Extract version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ needs.build.result == 'success' && needs.version-bump.outputs.new_version || '' }}"
            # Fallback: read from pyproject.toml
            if [[ -z "$VERSION" ]]; then
              VERSION=$(python3 -c "
          import re
          with open('pyproject.toml') as f:
              for line in f:
                  m = re.match(r'version = \"(.+)\"', line)
                  if m:
                      print(m.group(1))
                      break
          ")
            fi
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate changelog from conventional commits
        run: |
          python3 << 'PYEOF'
          import subprocess
          import re
          import os
          from datetime import datetime, timezone

          version = os.environ.get("VERSION", "0.0.0")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          release_date = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          # Find previous tag
          try:
              prev_tag = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0", "HEAD^"],
                  text=True, stderr=subprocess.DEVNULL
              ).strip()
          except subprocess.CalledProcessError:
              prev_tag = ""

          # Build git log command with record separator
          record_end = "<<--EOR-->>"
          fmt = f"%s%x00%b%x00%h{record_end}"
          cmd = ["git", "log", "--no-merges", f"--pretty=format:{fmt}"]
          if prev_tag:
              cmd.insert(2, f"{prev_tag}..HEAD")

          try:
              raw = subprocess.check_output(cmd, text=True)
          except subprocess.CalledProcessError:
              raw = ""

          # Parse commits into categories
          breaking = []
          features = []
          fixes = []
          other = []

          conventional_re = re.compile(
              r"^(?P<type>[a-z]+)(?:\((?P<scope>[^)]*)\))?(?P<bang>!)?:\s*(?P<desc>.+)$"
          )

          for record in raw.split(record_end):
              record = record.strip()
              if not record:
                  continue

              parts = record.split("\x00")
              if len(parts) < 3:
                  continue

              subject = parts[0].strip()
              body = parts[1].strip()
              commit_hash = parts[2].strip()

              if not subject or not commit_hash:
                  continue

              m = conventional_re.match(subject)
              is_breaking = False

              if m and m.group("bang"):
                  is_breaking = True
              if "BREAKING CHANGE:" in body or "BREAKING-CHANGE:" in body:
                  is_breaking = True

              line = f"- {subject} (`{commit_hash}`)"

              if is_breaking:
                  breaking.append(line)
              elif m:
                  ctype = m.group("type")
                  if ctype == "feat":
                      features.append(line)
                  elif ctype == "fix":
                      fixes.append(line)
                  else:
                      other.append(line)
              else:
                  other.append(line)

          # Build changelog markdown
          sections = []
          sections.append(f"# nWave Framework v{version}\n")
          sections.append(f"**Release Date**: {release_date}\n")

          if prev_tag:
              compare_url = f"https://github.com/{repo}/compare/{prev_tag}...v{version}"
              sections.append(f"**Full Changelog**: [{prev_tag}...v{version}]({compare_url})\n")

          if breaking:
              sections.append("## Breaking Changes\n")
              sections.append("\n".join(breaking) + "\n")

          if features:
              sections.append("## Features\n")
              sections.append("\n".join(features) + "\n")

          if fixes:
              sections.append("## Bug Fixes\n")
              sections.append("\n".join(fixes) + "\n")

          if other:
              sections.append("## Other Changes\n")
              sections.append("\n".join(other) + "\n")

          if not (breaking or features or fixes or other):
              sections.append("No conventional commits found in this release.\n")

          sections.append("## Installation\n")
          sections.append(
              f"```bash\n"
              f"pipx install nwave-ai\n"
              f"nwave-ai install\n"
              f"```\n"
          )

          changelog = "\n".join(sections)

          os.makedirs("dist/releases", exist_ok=True)
          with open("dist/releases/RELEASE_NOTES.md", "w") as f:
              f.write(changelog)

          print(changelog)
          PYEOF
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: nWave Framework v${{ steps.get_version.outputs.VERSION }}
          body_path: dist/releases/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/releases/*.tar.gz
            dist/releases/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # PUBLISH TO NWAVE - Sync to public repo
  # ===========================================================================

  publish-to-nwave:
    name: "Publish to nwave-ai/nwave"
    needs: [version-bump, github-release]
    if: |
      always() &&
      needs.github-release.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      nwave_version: ${{ steps.nwave_version.outputs.version }}

    steps:
      - name: Checkout nwave-dev (source)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ needs.version-bump.outputs.new_version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Checkout nwave-ai/nwave (target)
        uses: actions/checkout@v4
        with:
          repository: nwave-ai/nwave
          token: ${{ secrets.RELEASETRAIN }}
          path: nwave-target

      - name: Sync files to nwave-ai/nwave
        run: |
          # Remove dangling symlinks before rsync (e.g. nWave/tasks/dw -> nw)
          find . -maxdepth 5 -type l ! -exec test -e {} \; -delete 2>/dev/null || true

          # Exit code 24 = "some files vanished before transfer" (race condition, safe to ignore)
          set +e
          rsync -avL --delete \
            --exclude '.git' \
            --exclude '.git*' \
            --exclude '.github/' \
            --exclude 'CLAUDE.local.md' \
            --exclude 'SESSION_STATE*' \
            --exclude 'build.log' \
            --exclude 'pyproject.toml' \
            --exclude 'nwave_ai/' \
            --exclude 'setup.cfg' \
            --exclude 'Pipfile' \
            --exclude 'Pipfile.lock' \
            --exclude '_tmp/' \
            --exclude 'htmlcov/' \
            --exclude 'reports/' \
            --exclude 'mutants/' \
            --exclude 'nwave.egg-info/' \
            --exclude 'nwave-ai.egg-info/' \
            --exclude '.execute-command-updated' \
            --exclude '.dependency-map.yaml' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '.mypy_cache/' \
            --exclude '.ruff_cache/' \
            --exclude '.coverage' \
            --exclude '.DS_Store' \
            --exclude '.venv/' \
            --exclude '.des/' \
            --exclude '.nwave/' \
            --exclude '.nwave-audit.log' \
            --exclude '.mutmut-cache' \
            --exclude '*.sqlite' \
            --exclude 'test-des-hooks/' \
            --exclude 'test-des-manual/' \
            ./ nwave-target/
          RSYNC_EXIT=$?
          set -e
          if [[ $RSYNC_EXIT -ne 0 && $RSYNC_EXIT -ne 24 ]]; then
            echo "rsync failed with exit code $RSYNC_EXIT"
            exit $RSYNC_EXIT
          fi

      - name: Auto-bump nwave-ai version
        id: nwave_version
        run: |
          # Read current published version from nwave-ai/nwave
          CURRENT=$(python3 -c "
          import re
          with open('nwave-target/pyproject.toml') as f:
              for line in f:
                  m = re.match(r'version\s*=\s*\"(.+)\"', line.strip())
                  if m:
                      print(m.group(1))
                      break
          ")

          # Read public_version floor from nwave-dev
          FLOOR=$(python3 -c "
          with open('pyproject.toml') as f:
              for line in f:
                  if line.strip().startswith('public_version'):
                      print(line.split('\"')[1])
                      break
          ")

          # Determine new version:
          # - If floor > current: use floor (manual override from nwave-dev)
          # - Otherwise: bump patch from current
          NEW_VERSION=$(python3 -c "
          def ver(v): return tuple(int(x) for x in v.split('.'))
          current = ver('${CURRENT}')
          floor = ver('${FLOOR}')
          if floor > current:
              print('${FLOOR}')
          else:
              parts = '${CURRENT}'.split('.')
              parts[-1] = str(int(parts[-1]) + 1)
              print('.'.join(parts))
          ")

          echo "Current nwave-ai: $CURRENT"
          echo "public_version floor: $FLOOR"
          echo "New nwave-ai version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update nwave-ai version files
        run: |
          NWAVE_VERSION="${{ steps.nwave_version.outputs.version }}"

          # Update pyproject.toml
          python3 -c "
          import re
          with open('nwave-target/pyproject.toml', 'r') as f:
              content = f.read()
          content = re.sub(r'version = \"[^\"]+\"', 'version = \"${NWAVE_VERSION}\"', content, count=1)
          with open('nwave-target/pyproject.toml', 'w') as f:
              f.write(content)
          "

          # Update __init__.py
          if [ -f nwave-target/nwave_ai/__init__.py ]; then
            python3 -c "
          import re
          with open('nwave-target/nwave_ai/__init__.py', 'r') as f:
              content = f.read()
          content = re.sub(r'__version__ = \"[^\"]+\"', '__version__ = \"${NWAVE_VERSION}\"', content)
          with open('nwave-target/nwave_ai/__init__.py', 'w') as f:
              f.write(content)
          "
          fi

          echo "Updated nwave-ai to version $NWAVE_VERSION"

      - name: Commit and push to nwave-ai/nwave
        working-directory: nwave-target
        run: |
          NWAVE_VERSION="${{ steps.nwave_version.outputs.version }}"
          git config user.name "nWave Release Train"
          git config user.email "noreply@nwave.ai"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "chore(release): v${NWAVE_VERSION}"
            git push
          fi

      - name: Create tag and release on nwave-ai/nwave
        working-directory: nwave-target
        env:
          GH_TOKEN: ${{ secrets.RELEASETRAIN }}
        run: |
          NWAVE_VERSION="${{ steps.nwave_version.outputs.version }}"
          TAG="v${NWAVE_VERSION}"

          # Create and push tag (skip if it already exists)
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag -a "$TAG" -m "Release ${TAG}"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG"
          fi

          # Create GitHub Release (skip if it already exists)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            cat > /tmp/release-notes.md << NOTES_EOF
          ## nwave-ai ${TAG}

          ### Install
          pipx install nwave-ai
          nwave-ai install

          ### What's included
          - nWave methodology framework
          - CLI installer (nwave-ai install / nwave-ai uninstall)
          - DES (Developer Experience System) plugin
          - IDE integration bundles
          NOTES_EOF
            gh release create "$TAG" \
              --title "nwave-ai ${TAG}" \
              --notes-file /tmp/release-notes.md
            echo "Created GitHub Release $TAG"
          fi

      - name: Sync public_version back to nwave-dev
        continue-on-error: true
        run: |
          NWAVE_VERSION="${{ steps.nwave_version.outputs.version }}"

          # Update public_version in nwave-dev pyproject.toml
          python3 -c "
          import re
          with open('pyproject.toml', 'r') as f:
              content = f.read()
          content = re.sub(
              r'public_version = \"[^\"]+\"',
              'public_version = \"${NWAVE_VERSION}\"',
              content
          )
          with open('pyproject.toml', 'w') as f:
              f.write(content)
          "

          # Commit and push to nwave-dev (use GH_TOKEN for branch protection)
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git config user.name "nWave Release Train"
          git config user.email "noreply@nwave.ai"

          # Pull latest master (version-bump job pushed a commit ahead of our checkout)
          git pull --rebase origin master

          git add pyproject.toml
          if git diff --cached --quiet; then
            echo "public_version already up to date"
          else
            git commit -m "chore: bump nwave-ai public_version to ${NWAVE_VERSION} [skip ci]"
            git push origin HEAD:master
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Publish Summary
        run: |
          NWAVE_VERSION="${{ steps.nwave_version.outputs.version }}"
          echo "## Publish to nwave-ai/nwave" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**nwave-ai version**: \`${NWAVE_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: \`v${NWAVE_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "**GitHub Release**: created on nwave-ai/nwave" >> $GITHUB_STEP_SUMMARY
          echo "**nwave-dev public_version**: synced to \`${NWAVE_VERSION}\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # PUBLISH TO PYPI - Build and upload nwave-ai wheel
  # ===========================================================================

  publish-to-pypi:
    name: "Publish to PyPI"
    needs: [publish-to-nwave]
    if: |
      always() &&
      needs.publish-to-nwave.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout nwave-ai/nwave
        uses: actions/checkout@v4
        with:
          repository: nwave-ai/nwave
          token: ${{ secrets.RELEASETRAIN }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install build tools
        run: pip install build twine pyyaml

      - name: Build wheel and sdist
        run: |
          # Build wheel directly from source tree (not via sdist)
          python -m build --wheel
          python -m build --sdist

      - name: Publish to TestPyPI
        run: |
          twine upload --repository testpypi dist/*.whl dist/*.tar.gz || {
            rc=$?
            # 400 = version already exists on TestPyPI, not a real failure
            if twine upload --repository testpypi --verbose dist/*.whl dist/*.tar.gz 2>&1 | grep -q "already exists"; then
              echo "::warning::Version already exists on TestPyPI (skipping)"
            else
              exit $rc
            fi
          }
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Smoke test - install from built wheel
        run: |
          # Install the exact wheel we just built (no TestPyPI propagation delay)
          pip install pipx
          WHEEL=$(ls dist/*.whl)
          echo "Installing wheel: $WHEEL"
          pipx install "$WHEEL" --pip-args="--extra-index-url https://pypi.org/simple/"

          # Verify CLI loads and shows correct version
          nwave-ai version
          nwave-ai --help

          # Verify install script is reachable and runs (dry-run = no side effects)
          nwave-ai install --dry-run || {
            echo "::warning::Dry-run exited non-zero (validation in dry-run mode is expected to fail)"
          }

          # Cleanup
          pipx uninstall nwave-ai

  # ===========================================================================
  # NOTIFICATION: SLACK ALERT
  # ===========================================================================

  notify-slack:
    name: "Slack Notification"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: |
      always() &&
      !cancelled()
    needs: [version-bump, build, github-release, publish-to-nwave, publish-to-pypi]

    steps:
      - name: Determine release status
        id: status
        run: |
          NEEDS_CONTEXT='${{ toJson(needs) }}'

          if echo "$NEEDS_CONTEXT" | jq -e '.[] | select(.result == "failure")' > /dev/null; then
            echo "result=failure" >> $GITHUB_OUTPUT

            FAILED_JOBS=$(echo "$NEEDS_CONTEXT" | jq -r '
              to_entries
              | map(select(.value.result == "failure"))
              | map("• " + .key)
              | join("\n")
            ')
            echo "failed_jobs<<EOF" >> $GITHUB_OUTPUT
            echo "$FAILED_JOBS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "result=success" >> $GITHUB_OUTPUT
          fi

      - name: Extract version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ needs.version-bump.outputs.new_version }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Get current timestamp
        id: timestamp
        run: |
          echo "unix=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Send release success notification
        if: steps.status.outputs.result == 'success'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Released v${{ steps.get_version.outputs.version }}",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*nwave-ai*: \`v${{ needs.publish-to-nwave.outputs.nwave_version }}\` published to *PyPI* (`pipx install nwave-ai`)\nSynced to *nwave-ai/nwave* with tag + GitHub Release"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Release"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.get_version.outputs.version }}",
                      "style": "primary"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Released at: <!date^${{ steps.timestamp.outputs.unix }}^{date_short_pretty} at {time}|timestamp>"
                    }
                  ]
                }
              ]
            }

      - name: Send release failure notification
        if: steps.status.outputs.result == 'failure'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Release Pipeline Failed",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Version:* ${{ steps.get_version.outputs.version }}\n*Failed Jobs:*\n${{ steps.status.outputs.failed_jobs }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "style": "danger"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Failed at: <!date^${{ steps.timestamp.outputs.unix }}^{date_short_pretty} at {time}|timestamp>"
                    }
                  ]
                }
              ]
            }
