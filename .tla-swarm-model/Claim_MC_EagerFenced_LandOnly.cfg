\* Purpose: NoDoubleTake violates first and aborts the run, leaving the
\* question "does fencing at least prevent double-LANDING, and does the
\* pile still drain?" unanswered. This config isolates exactly that.
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoDoubleLand
PROPERTIES
    EventualDrain
CONSTRAINT ClaimStateConstraint
