# =============================================================================
# Build Pipeline Elimination Roadmap
# =============================================================================
# Goal: Replace build-time processing with direct source installation.
# The build pipeline (~2700 lines across 10+ files) now only adds YAML
# frontmatter. Agents already have it; commands need it added to source.
# After that, installer reads source directly (like skills_plugin.py pattern).
# =============================================================================

schema_version: "2.0"
project_id: "build-pipeline-elimination"
goal: >
  Eliminate the build pipeline (tools/core/build_ide_bundle.py + processors)
  and simplify to direct source installation. Reduce ~2700 lines of build
  infrastructure to zero while preserving all installation functionality.
methodology: standard
created_at: "2026-02-10T12:00:00Z"

# -----------------------------------------------------------------------------
# Quantitative Baseline
# -----------------------------------------------------------------------------
# Build pipeline: 10+ files, ~2700 lines (build_ide_bundle 333, agent_processor
#   360, command_processor 437, team_processor 391, template_processor 300,
#   config_manager 467, dependency_resolver ~150, file_manager ~100,
#   embed_sources 399, build.py 23)
# Current agents (nw-*.md): 22 files, ALL have --- frontmatter already
# Current commands (tasks/nw/*.md): 18 files, NONE have --- frontmatter
# Legacy files: 30 legacy agents + 22 legacy commands + 27 embed files = 79
# Installer plugins to modify: 3 files (agents_plugin, commands_plugin, install_nwave)
# CI/CD build steps: 2 (lines 405-410, 552-557 in ci-cd.yml)
# Test files referencing dist/ide: 25 files
# BUILD:INJECT markers in current agents: 0
# Template variables in current commands: 0
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Rejected Simpler Alternatives
# -----------------------------------------------------------------------------
# 1. Config-only change (skip build via flag):
#    Rejected -- commands lack frontmatter, installer hardcoded to dist/ide.
#    Would break command discovery in Claude Code.
#
# 2. Single atomic commit (nuke everything at once):
#    Rejected -- 25+ test files, 3 installer plugins, 2 CI/CD steps, 18
#    commands needing frontmatter. Too many simultaneous changes; no
#    rollback safety. Risk of broken installation for all users.
# -----------------------------------------------------------------------------

phases:
  # ===========================================================================
  # PHASE 01: Make source files directly installable
  # ===========================================================================
  # After this phase, source files work with OR without the build pipeline.
  # This is the safety net -- nothing breaks, both paths work.
  # ===========================================================================
  - phase_id: "01"
    title: "Make source files directly installable"
    rationale: >
      Agents already have frontmatter. Commands need it added from
      framework-catalog.yaml. Once all source files have frontmatter,
      they can be installed directly without build processing.
    steps:
      - step_id: "01-01"
        title: "Add frontmatter to all 18 command source files"
        description: >
          Add Claude Code --- YAML frontmatter to each file in
          nWave/tasks/nw/*.md. Extract description and argument-hint
          from framework-catalog.yaml commands section. Match
          the pattern: description field, optional argument-hint field.
        acceptance_criteria:
          - "All 18 files in nWave/tasks/nw/*.md start with --- frontmatter block"
          - "Each frontmatter contains description matching framework-catalog.yaml"
          - "Commands with argument_hint in catalog have argument-hint in frontmatter"
          - "Claude Code discovers all 18 commands when installed from source"
        files_to_modify:
          - "nWave/tasks/nw/discover.md"
          - "nWave/tasks/nw/discuss.md"
          - "nWave/tasks/nw/design.md"
          - "nWave/tasks/nw/distill.md"
          - "nWave/tasks/nw/deliver.md"
          - "nWave/tasks/nw/devops.md"
          - "nWave/tasks/nw/document.md"
          - "nWave/tasks/nw/execute.md"
          - "nWave/tasks/nw/finalize.md"
          - "nWave/tasks/nw/roadmap.md"
          - "nWave/tasks/nw/review.md"
          - "nWave/tasks/nw/refactor.md"
          - "nWave/tasks/nw/mutation-test.md"
          - "nWave/tasks/nw/mikado.md"
          - "nWave/tasks/nw/root-why.md"
          - "nWave/tasks/nw/diagram.md"
          - "nWave/tasks/nw/research.md"
          - "nWave/tasks/nw/forge.md"
        estimated_effort: "M"
        dependencies: []

      - step_id: "01-02"
        title: "Verify agent source files have complete frontmatter"
        description: >
          Audit all 22 nWave/agents/nw-*.md files. Confirm each has
          valid --- frontmatter with name, description, model fields.
          Fix any that are missing or malformed.
        acceptance_criteria:
          - "All 22 agent files have --- frontmatter with name, description, model"
          - "No agent has duplicate --- blocks or malformed YAML"
          - "Agent names in frontmatter match filenames (nw-*.md -> nw-*)"
        files_to_modify:
          - "nWave/agents/nw-*.md (22 files, audit only -- expect no changes)"
        estimated_effort: "S"
        dependencies: []

      - step_id: "01-03"
        title: "Add CI frontmatter lint validation"
        description: >
          Create a lightweight Python script that validates all agent
          and command source files have well-formed frontmatter. Add
          as a CI step replacing the build step (line 405-410).
        acceptance_criteria:
          - "Script validates --- frontmatter exists and parses as valid YAML"
          - "Script checks required fields: name+description+model for agents, description for commands"
          - "Script exits non-zero if any source file fails validation"
          - "CI runs validation instead of full build for integration tests"
        files_to_modify:
          - "scripts/validation/validate_source_frontmatter.py (new)"
          - ".github/workflows/ci-cd.yml"
        estimated_effort: "M"
        dependencies:
          - "01-01"
          - "01-02"

  # ===========================================================================
  # PHASE 02: Switch installer to direct source installation
  # ===========================================================================
  # After this phase, installer reads from nWave/ not dist/ide/.
  # The build pipeline becomes dead code. Tests updated in lockstep.
  # ===========================================================================
  - phase_id: "02"
    title: "Switch installer to direct source installation"
    rationale: >
      Follow skills_plugin.py pattern: read directly from nWave/ source.
      Eliminate dist/ide dependency in installer, removing build_framework()
      and check_source() methods. Update tests atomically with installer.
    steps:
      - step_id: "02-01"
        title: "Modify agents_plugin.py to read from nWave/agents/"
        description: >
          Remove dist/ide fallback logic. Always read from
          project_root/nWave/agents/. Remove dist_agent_dir and
          selection logic. Follow skills_plugin.py pattern exactly.
        acceptance_criteria:
          - "Plugin reads only from project_root/nWave/agents/"
          - "No reference to dist/ide or framework_source for agent source"
          - "Plugin copies all nw-*.md files to target, excludes legacy/"
          - "Verification counts match source file count (22)"
        files_to_modify:
          - "scripts/install/plugins/agents_plugin.py"
        estimated_effort: "S"
        dependencies:
          - "01-02"

      - step_id: "02-02"
        title: "Modify commands_plugin.py to read from nWave/tasks/nw/"
        description: >
          Change source from framework_source/commands to
          project_root/nWave/tasks/nw/. STRUCTURAL NOTE: current source
          (dist/ide/commands/) contains an nw/ subdirectory that gets
          copytree'd. New source (nWave/tasks/nw/) is flat .md files.
          Target must preserve ~/.claude/commands/nw/ namespace. Copy
          flat .md files into target nw/ directory (mkdir + copy, not
          copytree). Exclude legacy/ subdirectory.
        acceptance_criteria:
          - "Plugin reads from project_root/nWave/tasks/nw/"
          - "No reference to dist/ide or framework_source for command source"
          - "Plugin copies all *.md files to target, excludes legacy/"
          - "All 18 commands discoverable by Claude Code after install"
        files_to_modify:
          - "scripts/install/plugins/commands_plugin.py"
        estimated_effort: "S"
        dependencies:
          - "01-01"

      - step_id: "02-03"
        title: "Remove build dependency from install_nwave.py"
        description: >
          Remove build_framework(), run_embedding(), check_source() methods.
          Remove framework_source = dist/ide assignment. Remove
          EXPECTED_AGENT_COUNT/EXPECTED_COMMAND_COUNT constants (or derive
          from source). Update validate_installation() to compare against
          nWave/ source instead of dist/ide.
        acceptance_criteria:
          - "No calls to build.py or build_ide_bundle.py from installer"
          - "No reference to dist/ide in install_nwave.py"
          - "Installation succeeds without dist/ide directory existing"
          - "Validation compares installed files against nWave/ source"
        files_to_modify:
          - "scripts/install/install_nwave.py"
        estimated_effort: "M"
        dependencies:
          - "02-01"
          - "02-02"

      - step_id: "02-04"
        title: "Update InstallContext and framework_source references"
        description: >
          Update InstallContext usage across plugins. framework_source
          field should point to project_root/nWave/ or be removed where
          plugins read source directly. Update base.py if needed.
        acceptance_criteria:
          - "InstallContext.framework_source is not dist/ide"
          - "All plugins that need source path use project_root/nWave/"
          - "Plugins not using framework_source are unaffected"
        files_to_modify:
          - "scripts/install/plugins/base.py"
          - "scripts/install/install_nwave.py"
        estimated_effort: "S"
        dependencies:
          - "02-03"

      - step_id: "02-05"
        title: "Update test fixtures and test files"
        description: >
          Remove built_framework fixture from conftest.py. Update 25+
          test files that create InstallContext with framework_source=
          dist/ide. Point them to project_root/nWave/ or use tmp_path
          fixtures. Batch: all files use same substitution pattern.
        acceptance_criteria:
          - "No test file references dist/ide"
          - "built_framework fixture removed from conftest.py"
          - "All installer acceptance and plugin tests pass"
          - "No test depends on build pipeline execution"
        files_to_modify:
          # Installer acceptance fixtures
          - "tests/acceptance/installer/conftest.py"
          - "tests/acceptance/installer/test_walking_skeleton.py (update Source framework assertions)"
          - "tests/acceptance/uninstaller/conftest.py"
          # Plugin unit tests
          - "tests/nwave/plugin-architecture/unit/test_agents_plugin.py"
          - "tests/nwave/plugin-architecture/unit/test_commands_plugin.py"
          - "tests/nwave/plugin-architecture/unit/test_templates_plugin.py"
          - "tests/nwave/plugin-architecture/unit/test_utilities_plugin.py"
          - "tests/nwave/plugin-architecture/unit/test_des_plugin.py"
          - "tests/nwave/plugin-architecture/unit/test_des_plugin_errors.py"
          - "tests/nwave/plugin-architecture/unit/test_coverage_gaps.py"
          # Plugin integration tests
          - "tests/nwave/plugin-architecture/integration/test_upgrade_scenarios.py"
          - "tests/nwave/plugin-architecture/integration/test_multi_plugin.py"
          - "tests/nwave/plugin-architecture/integration/test_behavioral_equivalence.py"
          - "tests/nwave/plugin-architecture/integration/test_des_import_validation.py"
          # Plugin E2E and acceptance
          - "tests/nwave/plugin-architecture/e2e/test_user_journey.py"
          - "tests/nwave/plugin-architecture/acceptance/conftest.py"
          - "tests/nwave/plugin-architecture/acceptance/test_des_plugin_acceptance.py"
          - "tests/nwave/plugin-architecture/acceptance/test_milestone_3_switchover.py"
          - "tests/nwave/plugin-architecture/acceptance/test_des_plugin_graceful_failure.py"
          - "tests/nwave/plugin-architecture/acceptance/test_rollback_mechanism.py"
          # Install tests
          - "tests/install/test_wrapper_plugins.py"
          - "tests/install/test_install_framework_plugin_integration.py"
          - "tests/install/test_selective_plugin_installation.py"
          - "tests/install/test_plugin_registry.py"
          # DES acceptance tests
          - "tests/des/acceptance/test_hook_path_portability.py"
          - "tests/des/acceptance/test_execute_template_sync.py"
        estimated_effort: "L"
        dependencies:
          - "02-04"

  # ===========================================================================
  # PHASE 03: Remove build pipeline code and update CI/CD
  # ===========================================================================
  # After this phase, build infrastructure is deleted. CI/CD simplified.
  # ===========================================================================
  - phase_id: "03"
    title: "Remove build pipeline and update CI/CD"
    rationale: >
      Build pipeline is now dead code. Remove it cleanly. Update CI/CD
      release workflow. Update release packager to read from source.
    steps:
      - step_id: "03-01"
        title: "Delete build pipeline files"
        description: >
          Delete: tools/core/build_ide_bundle.py, tools/build.py,
          tools/processors/ (entire directory), tools/utils/config_manager.py,
          tools/utils/dependency_resolver.py, tools/utils/file_manager.py,
          tools/core/embed_sources.py. Keep tools/utils/__init__.py if
          other utilities remain.
        acceptance_criteria:
          - "All 10+ build pipeline files deleted"
          - "tools/processors/ directory removed entirely"
          - "No Python import references to deleted modules remain"
          - "No other file imports from deleted modules"
        files_to_modify:
          - "tools/core/build_ide_bundle.py (delete)"
          - "tools/build.py (delete)"
          - "tools/processors/agent_processor.py (delete)"
          - "tools/processors/command_processor.py (delete)"
          - "tools/processors/team_processor.py (delete)"
          - "tools/processors/template_processor.py (delete)"
          - "tools/utils/config_manager.py (delete)"
          - "tools/utils/dependency_resolver.py (delete)"
          - "tools/utils/file_manager.py (delete)"
          - "tools/core/embed_sources.py (delete)"
        estimated_effort: "S"
        dependencies:
          - "02-05"

      - step_id: "03-02"
        title: "Update CI/CD, release packager, and validation scripts"
        description: >
          ATOMIC with 03-01: must be in same commit to avoid broken CI.
          (a) Remove build steps at lines 405-410 and 552-557 of ci-cd.yml.
          (b) Replace integration test build step with frontmatter validation
          (from 01-03). (c) Modify create_release_packages.py to read
          from nWave/ instead of dist/ide. (d) Update
          validate_ci_cd_workflow.py to remove build system validation.
          NOTE: config.json (generated by build at dist/ide/agents/nw/config.json)
          is implicitly eliminated — no installer code reads it (confirmed
          via grep).
        acceptance_criteria:
          - "No CI step runs build_ide_bundle.py"
          - "Frontmatter validation runs before tests"
          - "Release workflow packages from nWave/ source directory"
          - "Release packager reads agents from nWave/agents/ and commands from nWave/tasks/nw/"
          - "CI validation script does not check for build_ide_bundle.py"
          - "CI pipeline passes end-to-end"
        files_to_modify:
          - ".github/workflows/ci-cd.yml"
          - "tools/create_release_packages.py"
          - "scripts/validation/validate_ci_cd_workflow.py"
        estimated_effort: "M"
        dependencies:
          - "03-01"

      - step_id: "03-04"
        title: "Remove build-related test files"
        description: >
          Delete test files that only test build pipeline functionality
          (build adapter, build service, build checks, forge build).
          These test dead code after pipeline removal.
        acceptance_criteria:
          - "No test file imports from deleted build modules"
          - "All remaining tests pass"
          - "Test count reduction documented"
        files_to_modify:
          - "tests/installer/adapters/test_build_adapter.py (delete if exists)"
          - "tests/installer/checks/test_build_checks.py (delete if exists)"
          - "tests/installer/services/test_build_service.py (delete if exists)"
          - "tests/installer/cli/test_forge_build.py (delete if exists)"
        estimated_effort: "S"
        dependencies:
          - "03-01"

  # ===========================================================================
  # PHASE 04: Clean up legacy artifacts
  # ===========================================================================
  # Remove legacy files that were only consumed by the build pipeline.
  # ===========================================================================
  - phase_id: "04"
    title: "Clean up legacy artifacts"
    rationale: >
      Legacy agents (BUILD:INJECT markers), legacy commands (template
      variables), and embed files (build-time injection content) are
      orphaned. 79 files, ~15000 lines of dead content.
    steps:
      - step_id: "04-01"
        title: "Delete legacy agents and commands"
        description: >
          Delete nWave/agents/legacy/ (30 files) and nWave/tasks/nw/legacy/
          (22 files). These contain BUILD:INJECT markers and template
          variables consumed only by the deleted build pipeline.
        acceptance_criteria:
          - "nWave/agents/legacy/ directory removed"
          - "nWave/tasks/nw/legacy/ directory removed"
          - "No remaining file references deleted content"
        files_to_modify:
          - "nWave/agents/legacy/ (delete directory, 30 files)"
          - "nWave/tasks/nw/legacy/ (delete directory, 22 files)"
        estimated_effort: "S"
        dependencies:
          - "03-01"

      - step_id: "04-04"
        title: "Migrate embed data to skills and update agent references"
        description: >
          CRITICAL: nWave/data/embed/ is DUAL-USE. Build pipeline used
          BUILD:INJECT to inline content from it (dead). But current
          agents also reference it: nw-researcher writes distilled
          research there, nw-data-engineer reads it as knowledge base,
          3 researcher skills reference it as output path.
          Action: (a) Audit 27 embed files against current skill coverage.
          (b) Migrate any content not yet covered by skills into new
          skill files. (c) Update nw-researcher.md, nw-data-engineer.md,
          and researcher skills to use nWave/skills/ paths instead of
          nWave/data/embed/. (d) Delete nWave/data/embed/ only after
          migration complete.
        acceptance_criteria:
          - "All embed content either migrated to skills or confirmed redundant"
          - "nw-researcher.md output paths updated to nWave/skills/"
          - "nw-data-engineer.md knowledge base path updated"
          - "3 researcher skill files updated to reference nWave/skills/"
          - "nWave/data/embed/ directory removed"
          - "No agent or skill references nWave/data/embed/"
        files_to_modify:
          - "nWave/agents/nw-researcher.md"
          - "nWave/agents/nw-data-engineer.md"
          - "nWave/skills/researcher/authoritative-sources.md"
          - "nWave/skills/researcher/research-methodology.md"
          - "nWave/skills/researcher/operational-safety.md"
          - "nWave/data/embed/ (audit, migrate, then delete)"
        estimated_effort: "M"
        dependencies:
          - "04-01"

      - step_id: "04-02"
        title: "Update framework-catalog.yaml documentation"
        description: >
          Remove header comment referencing build system as consumer.
          Update to document that frontmatter lives in source files.
          Preserve catalog as metadata reference (wave assignments,
          quality gates, reference materials).
        acceptance_criteria:
          - "No comment references build_ide_bundle.py or build system"
          - "Header documents catalog's role as metadata reference"
          - "All command metadata remains accessible for documentation"
        files_to_modify:
          - "nWave/framework-catalog.yaml"
        estimated_effort: "S"
        dependencies:
          - "03-01"

      - step_id: "04-03"
        title: "Clean up dist/ directory and .gitignore"
        description: >
          Delete dist/ide/ if it exists locally. Verify dist/ remains
          in .gitignore (already is). Remove any Makefile or script
          targets that reference the build step. Remove --force-rebuild
          flag from installer CLI.
        acceptance_criteria:
          - "dist/ide/ directory does not exist"
          - "dist/ remains in .gitignore"
          - "Installer --help does not mention --force-rebuild"
          - "No script or Makefile references dist/ide"
        files_to_modify:
          - "scripts/install/install_nwave.py (remove --force-rebuild arg)"
        estimated_effort: "S"
        dependencies:
          - "03-01"

# =============================================================================
# Summary (post-review v2)
# =============================================================================
# Phases: 4
# Steps: 14 (was 13, added 04-04 for embed migration)
# Files deleted: ~90 (10 build + 52 legacy + ~4 build tests + 27 embed after migration)
# Files modified: ~30 (18 commands + 3 installer + CI/CD + 27 tests + 5 agent/skill refs)
# Files created: 1 (frontmatter validation script)
# Lines removed: ~17,700 (2700 build + ~15000 legacy/embed)
# Lines added: ~250 (18 frontmatter blocks + validation script)
# Net reduction: ~17,450 lines
#
# Review fixes applied (reviewer: nw-solution-architect-reviewer):
# - C-01: Split embed deletion into audit+migrate step (04-04), not blind delete
# - H-01: Added 8 missing test files to step 02-05 (total: 27 files)
# - H-02: Added test_walking_skeleton.py with Source framework assertion note
# - H-03: Documented flat-to-namespace copy logic change in step 02-02
# - M-01: Documented config.json implicit elimination in step 03-02
# - M-02: Merged 03-02 and 03-03 for atomicity (single commit with 03-01)
#
# Risk mitigation: Phase 01 makes source installable without breaking build.
# Both paths work after phase 01. Only phase 02 makes the switch irreversible.
# =============================================================================
