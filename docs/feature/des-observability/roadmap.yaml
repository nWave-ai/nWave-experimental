schema_version: "2.0"
project_id: des-observability
title: "DES Observability Infrastructure"
description: >
  Implement full hook lifecycle observability for the DES enforcement system.
  Closes 8 gaps (G1-G8) identified in observability-plan.md, adds execution
  statistics tracking (turns/tokens), and standardizes log formats.
  Section 12 (audit toggle with NullObject pattern) is already DONE.

source_document: docs/feature/des-observability/observability-plan.md

# -----------------------------------------------------------------------
# Dependency graph (from observability-plan.md Section 6.2):
#
#   P1-1 (hook_id) --> P1-2 (HOOK_COMPLETED) --> P5-2 (thread hook_id to services)
#                                             --> P6-1 (stderr capture)
#                      P2-1 (pre_write logging)     [independent]
#                      P3-1 (protocol anomaly)      [independent]
#                      P4-1 (post_tool_use decision) [independent]
#                      P5-1 (task_correlation_id)   [independent]
#
#   EXEC-STATS depends on P1-2 (needs HOOK_COMPLETED infrastructure)
#   LOG-FORMAT depends on all P-phases (changes serialization layer)
# -----------------------------------------------------------------------

steps:
  # =====================================================================
  # PHASE 1: Foundation (CRITICAL -- unblocks all other phases)
  # =====================================================================

  - id: "01-01"
    title: "Add hook_id generation to adapter (P1-1)"
    description: >
      Generate a UUID4 hook_id at the start of each handler function in
      claude_code_hook_adapter.py. Include hook_id in every HOOK_INVOKED
      event. This is the foundation for all correlation work.
    gap_refs: ["G3", "G4"]
    phase_ref: "P1-1"
    depends_on: []
    agent: "@nw-software-crafter"
    files_to_modify:
      - path: src/des/adapters/drivers/hooks/claude_code_hook_adapter.py
        changes:
          - "Add 'import uuid' to imports"
          - "Add hook_id parameter to _log_hook_invoked()"
          - "Generate hook_id = str(uuid.uuid4()) at start of handle_pre_tool_use()"
          - "Generate hook_id at start of handle_subagent_stop()"
          - "Generate hook_id at start of handle_post_tool_use()"
          - "Generate hook_id at start of handle_pre_write()"
          - "Pass hook_id to _log_hook_invoked() in all four handlers"
          - "Include hook_id field in HOOK_INVOKED event data dict"
      - path: tests/des/unit/adapters/drivers/hooks/test_hook_id_generation.py
        changes:
          - "Create new test file for hook_id generation tests"
    acceptance_criteria:
      - "hook_id is a valid UUID4 string (matches UUID4 regex)"
      - "hook_id is unique per handler invocation (call twice, get different IDs)"
      - "hook_id appears in HOOK_INVOKED event data under key 'hook_id'"
      - "All four handlers (pre_tool_use, subagent_stop, post_tool_use, pre_write) generate hook_id"
      - "_log_hook_invoked accepts optional hook_id parameter (backward compatible: None omits field)"
      - "All existing tests pass without modification"
    max_turns: 25

  - id: "01-02"
    title: "Add HOOK_COMPLETED event with timing and exit code (P1-2)"
    description: >
      Add a _log_hook_completed() function that emits HOOK_COMPLETED with
      hook_id, handler, exit_code, decision, and duration_ms. Use
      time.perf_counter_ns() for monotonic timing. Call in a finally block
      of each handler. Wrap in try/except so logging never breaks the hook.
    gap_refs: ["G2", "G4"]
    phase_ref: "P1-2"
    depends_on: ["01-01"]
    agent: "@nw-software-crafter"
    files_to_modify:
      - path: src/des/adapters/drivers/hooks/claude_code_hook_adapter.py
        changes:
          - "Add 'import time' to imports"
          - "Add _log_hook_completed(hook_id, handler, exit_code, decision, duration_ms) function"
          - "Add start_ns = time.perf_counter_ns() at entry of each handler"
          - "Add finally block to handle_pre_tool_use() calling _log_hook_completed()"
          - "Add finally block to handle_subagent_stop() calling _log_hook_completed()"
          - "Add finally block to handle_post_tool_use() calling _log_hook_completed()"
          - "Add finally block to handle_pre_write() calling _log_hook_completed()"
          - "Map exit_code to decision string: 0=allow, 1=error, 2=block"
          - "Add slow_hook detection: if duration_ms > threshold, add slow_hook=true field"
      - path: tests/des/unit/adapters/drivers/hooks/test_hook_completed_event.py
        changes:
          - "Create new test file for HOOK_COMPLETED event tests"
    acceptance_criteria:
      - "HOOK_COMPLETED event emitted on allow path (exit_code=0, decision='allow')"
      - "HOOK_COMPLETED event emitted on block path (exit_code=2, decision='block')"
      - "HOOK_COMPLETED event emitted on error path (exit_code=1, decision='error')"
      - "HOOK_COMPLETED event emitted for post_tool_use (always exit_code=0, decision='allow' or 'passthrough')"
      - "duration_ms is a positive float"
      - "hook_id in HOOK_COMPLETED matches hook_id in corresponding HOOK_INVOKED"
      - "HOOK_COMPLETED emitted even when handler raises exception (finally block)"
      - "_log_hook_completed wrapped in try/except (never raises)"
      - "slow_hook=true added when duration_ms exceeds handler threshold"
      - "All existing tests pass without modification"
    max_turns: 30

  # =====================================================================
  # PHASE 2: Pre-Write Observability (CRITICAL gap G1)
  # =====================================================================

  - id: "02-01"
    title: "Add full logging to handle_pre_write (P2-1)"
    description: >
      The handle_pre_write handler currently has ZERO logging events.
      Add HOOK_INVOKED at entry, HOOK_PRE_WRITE_ALLOWED or
      HOOK_PRE_WRITE_BLOCKED after the SessionGuardPolicy check, and
      HOOK_COMPLETED at exit. All wrapped in try/except (fail-open for
      Write/Edit operations).
    gap_refs: ["G1"]
    phase_ref: "P2-1"
    depends_on: ["01-01"]
    agent: "@nw-software-crafter"
    files_to_modify:
      - path: src/des/adapters/drivers/hooks/claude_code_hook_adapter.py
        changes:
          - "Add HOOK_INVOKED call at handle_pre_write() entry with handler='pre_write'"
          - "Add input_summary with file_path, session_active, des_task_active"
          - "After policy.check(): emit HOOK_PRE_WRITE_ALLOWED with reason and file_path"
          - "After policy.check() blocked: emit HOOK_PRE_WRITE_BLOCKED with reason and file_path"
          - "Logging in the exception handler (fail-open path) for pre_write"
      - path: tests/des/unit/adapters/drivers/hooks/test_pre_write_logging.py
        changes:
          - "Create new test file for pre_write logging tests"
    acceptance_criteria:
      - "HOOK_INVOKED emitted at handle_pre_write entry with handler='pre_write'"
      - "input_summary includes file_path, session_active, des_task_active booleans"
      - "HOOK_PRE_WRITE_ALLOWED emitted when session not active (reason='no_session')"
      - "HOOK_PRE_WRITE_ALLOWED emitted for allowed paths (reason from policy)"
      - "HOOK_PRE_WRITE_BLOCKED emitted when guard blocks (includes file_path and reason)"
      - "Exception in logging does not change handler behavior (still fail-open)"
      - "All existing tests pass without modification"
    max_turns: 25

  # =====================================================================
  # PHASE 3: Protocol Anomaly Logging (gap G6)
  # =====================================================================

  - id: "03-01"
    title: "Log empty stdin and JSON parse errors as HOOK_PROTOCOL_ANOMALY (P3-1)"
    description: >
      Each handler has early-return paths for empty stdin and JSON parse
      errors that currently produce no audit events. Add HOOK_PROTOCOL_ANOMALY
      events for these paths in all four handlers. Include anomaly_type,
      handler, detail, and fallback_action fields.
    gap_refs: ["G6"]
    phase_ref: "P3-1"
    depends_on: ["01-01"]
    agent: "@nw-software-crafter"
    files_to_modify:
      - path: src/des/adapters/drivers/hooks/claude_code_hook_adapter.py
        changes:
          - "In handle_pre_tool_use empty-stdin branch: emit HOOK_PROTOCOL_ANOMALY(anomaly_type='empty_stdin', fallback_action='allow')"
          - "In handle_pre_tool_use JSON parse branch: emit HOOK_PROTOCOL_ANOMALY(anomaly_type='json_parse_error', fallback_action='error')"
          - "In handle_subagent_stop empty-stdin branch: emit HOOK_PROTOCOL_ANOMALY(anomaly_type='empty_stdin', fallback_action='allow')"
          - "In handle_subagent_stop JSON parse branch: emit HOOK_PROTOCOL_ANOMALY(anomaly_type='json_parse_error', fallback_action='error')"
          - "In handle_post_tool_use empty-stdin branch: emit HOOK_PROTOCOL_ANOMALY(anomaly_type='empty_stdin', fallback_action='allow')"
          - "In handle_post_tool_use JSON parse branch: emit HOOK_PROTOCOL_ANOMALY(anomaly_type='json_parse_error', fallback_action='allow')"
          - "In handle_pre_write empty-stdin branch: emit HOOK_PROTOCOL_ANOMALY(anomaly_type='empty_stdin', fallback_action='allow')"
          - "In handle_pre_write JSON parse branch: emit HOOK_PROTOCOL_ANOMALY(anomaly_type='json_parse_error', fallback_action='allow')"
          - "All anomaly logging wrapped in try/except (never breaks handler)"
      - path: tests/des/unit/adapters/drivers/hooks/test_protocol_anomaly_logging.py
        changes:
          - "Create new test file for protocol anomaly tests"
    acceptance_criteria:
      - "Empty stdin in any handler produces HOOK_PROTOCOL_ANOMALY with anomaly_type='empty_stdin'"
      - "Malformed JSON in any handler produces HOOK_PROTOCOL_ANOMALY with anomaly_type='json_parse_error'"
      - "Each anomaly event includes handler name, detail string, and fallback_action"
      - "fallback_action matches actual handler behavior ('allow' for pre_write/post_tool_use, 'error' for pre_tool_use JSON parse)"
      - "Anomaly logging failure does not change handler exit code or response"
      - "All existing tests pass without modification"
    max_turns: 25

  # =====================================================================
  # PHASE 4: PostToolUse Decision Logging (gap G5)
  # =====================================================================

  - id: "04-01"
    title: "Add decision logging to PostToolUse handler (P4-1)"
    description: >
      After PostToolUseService.check_completion_status() returns, log
      whether context was injected (HOOK_POST_TOOL_USE_INJECTED) or
      not (HOOK_POST_TOOL_USE_PASSTHROUGH). Logging in the adapter
      layer, not the service, to keep the hexagonal boundary clean.
    gap_refs: ["G5"]
    phase_ref: "P4-1"
    depends_on: ["01-01"]
    agent: "@nw-software-crafter"
    files_to_modify:
      - path: src/des/adapters/drivers/hooks/claude_code_hook_adapter.py
        changes:
          - "After service.check_completion_status() in handle_post_tool_use():"
          - "If additional_context is not None: emit HOOK_POST_TOOL_USE_INJECTED with context_type, is_des_task"
          - "If additional_context is None: emit HOOK_POST_TOOL_USE_PASSTHROUGH with is_des_task and reason"
          - "Extract feature_name and step_id from DES markers when available"
          - "All logging wrapped in try/except"
      - path: tests/des/unit/adapters/drivers/hooks/test_post_tool_use_decision_logging.py
        changes:
          - "Create new test file for post_tool_use decision logging tests"
    acceptance_criteria:
      - "HOOK_POST_TOOL_USE_INJECTED emitted when additional_context is not None"
      - "INJECTED event includes is_des_task boolean and context_type ('continuation' or 'failure_notification')"
      - "HOOK_POST_TOOL_USE_PASSTHROUGH emitted when additional_context is None"
      - "PASSTHROUGH event includes is_des_task boolean and reason string"
      - "Logging failure does not affect response to Claude Code"
      - "All existing tests pass without modification"
    max_turns: 25

  # =====================================================================
  # PHASE 5: Task Lifecycle Correlation (gap G3)
  # =====================================================================

  - id: "05-01"
    title: "Add task_correlation_id to signal file and HOOK_COMPLETED (P5-1)"
    description: >
      Generate a task_correlation_id when creating the DES task signal in
      PreToolUse. Store it in the signal file JSON. Read it back in
      SubagentStop before removing the signal. Pass it through to
      HOOK_COMPLETED events. For PostToolUse, read from the most recent
      audit entry. For non-DES tasks, use agent_id as correlation ID.
    gap_refs: ["G3"]
    phase_ref: "P5-1"
    depends_on: ["01-02"]
    agent: "@nw-software-crafter"
    files_to_modify:
      - path: src/des/adapters/drivers/hooks/claude_code_hook_adapter.py
        changes:
          - "In _create_des_task_signal(): generate task_correlation_id = str(uuid.uuid4())"
          - "Include task_correlation_id in signal file JSON"
          - "In handle_pre_tool_use(): read task_correlation_id back from signal and pass to _log_hook_completed"
          - "In handle_subagent_stop(): read task_correlation_id from _read_des_task_signal() before removal"
          - "In handle_post_tool_use(): for DES tasks, read task_correlation_id from most recent HOOK_COMPLETED audit entry"
          - "Add task_correlation_id field to HOOK_COMPLETED and HOOK_INVOKED events when available"
          - "For non-DES tasks in subagent_stop: use agent_id from hook_input as correlation fallback"
      - path: tests/des/unit/adapters/drivers/hooks/test_task_correlation_id.py
        changes:
          - "Create new test file for task_correlation_id tests"
    acceptance_criteria:
      - "Signal file JSON contains task_correlation_id field"
      - "task_correlation_id is a valid UUID4 string"
      - "HOOK_COMPLETED in pre_tool_use includes task_correlation_id for DES tasks"
      - "HOOK_COMPLETED in subagent_stop includes same task_correlation_id from signal"
      - "HOOK_COMPLETED in post_tool_use includes task_correlation_id (from audit log lookup)"
      - "task_correlation_id is null/absent for non-DES tasks (graceful degradation)"
      - "Signal file deletion does not break subagent_stop (graceful null)"
      - "All existing tests pass without modification"
    max_turns: 30

  - id: "05-02"
    title: "Thread hook_id through application services (P5-2)"
    description: >
      Add optional hook_id field to AuditEvent dataclass. Propagate hook_id
      from adapter handlers through service validate() methods so all
      service-emitted events (ALLOWED, BLOCKED, PASSED, FAILED, COMMIT_*)
      carry the hook_id for correlation with the adapter HOOK_INVOKED event.
      NOTE: PostToolUseService does NOT need hook_id threading because its
      decision events (INJECTED/PASSTHROUGH) are emitted in the adapter layer
      (step 04-01), not in the service. The adapter already has hook_id.
    gap_refs: ["G3"]
    phase_ref: "P5-2"
    depends_on: ["01-02"]
    agent: "@nw-software-crafter"
    files_to_modify:
      - path: src/des/ports/driven_ports/audit_log_writer.py
        changes:
          - "Add 'hook_id: str | None = None' field to AuditEvent dataclass (with default None for backward compat)"
      - path: src/des/adapters/driven/logging/jsonl_audit_log_writer.py
        changes:
          - "Include hook_id in JSON output when event.hook_id is not None"
      - path: src/des/application/pre_tool_use_service.py
        changes:
          - "Add optional hook_id parameter to validate() method"
          - "Pass hook_id to _log_allowed() and _log_blocked()"
          - "Include hook_id in AuditEvent constructor calls"
      - path: src/des/application/subagent_stop_service.py
        changes:
          - "Add optional hook_id parameter to validate() method"
          - "Pass hook_id to all _log_* methods"
          - "Include hook_id in AuditEvent constructor calls"
      - path: src/des/adapters/drivers/hooks/claude_code_hook_adapter.py
        changes:
          - "Pass hook_id when calling service.validate() in handle_pre_tool_use()"
          - "Pass hook_id when calling service.validate() in handle_subagent_stop()"
      - path: tests/des/unit/adapters/drivers/hooks/test_hook_id_threading.py
        changes:
          - "Create new test file for hook_id propagation tests"
    acceptance_criteria:
      - "AuditEvent accepts optional hook_id parameter (default None)"
      - "hook_id=None omits the field from serialized JSON (backward compatible)"
      - "hook_id is included in JSON when provided"
      - "PreToolUseService.validate() accepts optional hook_id and forwards to audit events"
      - "SubagentStopService.validate() accepts optional hook_id and forwards to audit events"
      - "HOOK_PRE_TOOL_USE_ALLOWED/BLOCKED events carry the same hook_id as HOOK_INVOKED"
      - "HOOK_SUBAGENT_STOP_PASSED/FAILED events carry the same hook_id as HOOK_INVOKED"
      - "COMMIT_VERIFIED/NOT_VERIFIED events carry hook_id"
      - "All existing tests pass without modification (hook_id defaults to None)"
    max_turns: 30

  # =====================================================================
  # PHASE 6: stderr Capture and Enhanced HOOK_ERROR (gap G7)
  # =====================================================================

  - id: "06-01"
    title: "Capture stderr in error events (P6-1)"
    description: >
      When an exception occurs in a handler, capture stderr output and
      include it in the HOOK_ERROR event. Use io.StringIO with
      contextlib.redirect_stderr in main(). Add error_type (exception
      class name) to HOOK_ERROR events. Truncate stderr to 1000 chars.
    gap_refs: ["G7"]
    phase_ref: "P6-1"
    depends_on: ["01-02"]
    agent: "@nw-software-crafter"
    files_to_modify:
      - path: src/des/adapters/drivers/hooks/claude_code_hook_adapter.py
        changes:
          - "Add 'import io' and 'import contextlib' to imports"
          - "In main(): wrap handler call with contextlib.redirect_stderr(StringIO())"
          - "On exception: read stderr buffer, truncate to 1000 chars"
          - "Include stderr_capture in HOOK_ERROR event data"
          - "Add error_type field (exception.__class__.__name__) to HOOK_ERROR events"
          - "Add error_type to all three exception handlers (pre_tool_use, subagent_stop, post_tool_use)"
      - path: tests/des/unit/adapters/drivers/hooks/test_stderr_capture.py
        changes:
          - "Create new test file for stderr capture tests"
    acceptance_criteria:
      - "HOOK_ERROR event includes error_type field (exception class name)"
      - "HOOK_ERROR event includes stderr_capture field when stderr has content"
      - "stderr_capture is truncated to 1000 characters maximum"
      - "stderr_capture is empty string (not absent) when no stderr output"
      - "stderr redirect does not interfere with normal handler operation"
      - "All existing tests pass without modification"
    max_turns: 45

  # =====================================================================
  # EXECUTION STATISTICS TRACKING (new requirement beyond observability-plan)
  # =====================================================================

  - id: "07-01"
    title: "Add turns_used and tokens_used fields to execution log format"
    description: >
      Extend execution-log.yaml format to support per-step execution
      statistics. Add turns_used and tokens_used as optional structured
      metadata in the COMMIT phase event. Update log_phase CLI to accept
      --turns-used and --tokens-used optional arguments. Update
      PhaseEvent domain model to carry optional metadata. Update
      YamlExecutionLogReader to parse the new fields.
    gap_refs: []
    phase_ref: "EXEC-STATS-1"
    depends_on: []
    agent: "@nw-software-crafter"
    files_to_modify:
      - path: src/des/domain/phase_event.py
        changes:
          - "Add optional turns_used: int | None = None field to PhaseEvent dataclass"
          - "Add optional tokens_used: int | None = None field to PhaseEvent dataclass"
      - path: src/des/cli/log_phase.py
        changes:
          - "Add --turns-used optional int argument"
          - "Add --tokens-used optional int argument"
          - "When provided, append as pipe-delimited fields after timestamp: sid|phase|status|data|ts|turns|tokens"
          - "Print extended entry to stdout"
      - path: src/des/adapters/driven/hooks/yaml_execution_log_reader.py
        changes:
          - "In PhaseEventParser.parse(): detect 6th and 7th pipe fields"
          - "Map field 5 (index 5) to turns_used, field 6 (index 6) to tokens_used"
          - "Handle missing fields gracefully (backward compat with 5-field format)"
      - path: tests/des/unit/domain/test_phase_event_exec_stats.py
        changes:
          - "Create new test file for execution statistics fields"
      - path: tests/des/unit/adapters/driven/hooks/test_exec_log_reader_stats.py
        changes:
          - "Create new test file for reader parsing of stats fields"
    acceptance_criteria:
      - "PhaseEvent dataclass has turns_used and tokens_used optional fields (default None)"
      - "log_phase CLI accepts --turns-used and --tokens-used optional int arguments"
      - "Entry format with stats: 'sid|phase|status|data|ts|turns|tokens'"
      - "Entry format without stats: 'sid|phase|status|data|ts' (backward compatible)"
      - "PhaseEventParser.parse() returns turns_used and tokens_used when present in 7-field format"
      - "PhaseEventParser.parse() returns None for turns_used/tokens_used in 5-field format"
      - "YamlExecutionLogReader correctly reads both old and new format events"
      - "All existing tests pass without modification"
    max_turns: 45

  - id: "07-02"
    title: "Extract agent stats from Task tool result and record in execution log"
    description: >
      Claude Code does NOT send token/turn stats in SubagentStop hook_input.
      The available fields are: agent_id, agent_type, agent_transcript_path,
      cwd, executionLogPath, projectId, stepId, stop_hook_active.
      Stats (total_tokens, tool_uses, duration_ms) are only in the Task tool
      RESULT returned to the orchestrator. Design: the orchestrator extracts
      stats from the Task result and passes them to the DES CLI log_phase
      via --turns-used and --tokens-used flags when recording the COMMIT phase.
      Update the DES prompt template to instruct the orchestrator (not the agent)
      to record stats. Also include stats in SubagentStopContext and audit events
      for future use when Claude Code adds stats to hook_input.
    gap_refs: []
    phase_ref: "EXEC-STATS-2"
    depends_on: ["07-01", "01-02"]
    agent: "@nw-software-crafter"
    files_to_modify:
      - path: src/des/ports/driver_ports/subagent_stop_port.py
        changes:
          - "Add optional turns_used: int | None = None to SubagentStopContext"
          - "Add optional tokens_used: int | None = None to SubagentStopContext"
      - path: src/des/application/subagent_stop_service.py
        changes:
          - "Include turns_used and tokens_used in HOOK_SUBAGENT_STOP_PASSED audit event data when available"
          - "Include turns_used and tokens_used in HOOK_SUBAGENT_STOP_FAILED audit event data when available"
          - "Include in COMMIT_VERIFIED event data when available"
      - path: src/des/adapters/drivers/hooks/claude_code_hook_adapter.py
        changes:
          - "In handle_subagent_stop(): attempt extraction of stats from hook_input (future-proofing)"
          - "Include turns_used and tokens_used in HOOK_COMPLETED event data when available"
      - path: tests/des/unit/adapters/drivers/hooks/test_exec_stats_extraction.py
        changes:
          - "Create new test file for stats propagation through SubagentStopContext and audit events"
    acceptance_criteria:
      - "SubagentStopContext carries optional turns_used and tokens_used (default None)"
      - "HOOK_SUBAGENT_STOP_PASSED includes turns_used and tokens_used when provided"
      - "HOOK_SUBAGENT_STOP_FAILED includes turns_used and tokens_used when provided"
      - "COMMIT_VERIFIED includes turns_used and tokens_used when provided"
      - "handle_subagent_stop tries hook_input.get('total_tokens') and hook_input.get('num_turns') but gracefully handles None"
      - "HOOK_COMPLETED for subagent_stop includes turns_used and tokens_used when available"
      - "Missing stats fields do not break validation (graceful None)"
      - "All existing tests pass without modification"
    max_turns: 45

  # =====================================================================
  # LOG FORMAT STANDARDIZATION (observability-plan Section 11)
  # =====================================================================

  - id: "08-01"
    title: "Structured YAML execution log format (schema v3.0)"
    description: >
      Replace pipe-delimited strings in execution-log.yaml with proper
      YAML objects. Bump schema_version to "3.0". Update log_phase CLI
      to write structured format. Update YamlExecutionLogReader to
      support both v2.0 (pipe) and v3.0 (structured) formats with
      automatic detection based on schema_version field.
    gap_refs: []
    phase_ref: "LOG-FORMAT-1"
    depends_on: ["07-01"]
    agent: "@nw-software-crafter"
    files_to_modify:
      - path: src/des/cli/log_phase.py
        changes:
          - "Write structured YAML objects instead of pipe-delimited strings"
          - "New format: {sid: step_id, p: phase, s: status, d: data, t: timestamp}"
          - "Include tu: turns_used and tk: tokens_used when provided"
          - "Bump schema_version to '3.0' on write"
      - path: src/des/adapters/driven/hooks/yaml_execution_log_reader.py
        changes:
          - "Detect schema_version from YAML data (default '2.0' if missing)"
          - "For v2.0: parse pipe-delimited strings (existing logic)"
          - "For v3.0: parse structured YAML objects (dict with sid, p, s, d, t keys)"
          - "Map short keys back to PhaseEvent fields"
      - path: src/des/domain/phase_event.py
        changes:
          - "Add PhaseEventParser.parse_structured() for dict-based events"
          - "Add PhaseEventParser.parse_auto() that detects string vs dict"
      - path: tests/des/unit/domain/test_phase_event_structured.py
        changes:
          - "Create new test file for structured format parsing"
      - path: tests/des/unit/adapters/driven/hooks/test_exec_log_reader_v3.py
        changes:
