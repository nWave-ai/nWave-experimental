meta:
  feature: release-commitizen
  architect: Morgan
  date: "2026-02-26"
  updated: "2026-02-26 (US-CZ-05 scope expansion: full PSR replacement)"
  total_steps: 8
  total_scenarios: 33
  production_files: 9
  production_files_deleted: 1
  test_files: 1
  steps_per_file_ratio: 0.89

steps:
  step_01:
    title: "CZ config and --base-version arg with priority chain"
    description: >
      Add [tool.commitizen] config to pyproject.toml. Add --base-version CLI arg.
      Modify calculate_dev() to use base-version when provided, fall back to
      _bump_patch when empty. Reject invalid base-version with exit code 2.
    acceptance_criteria:
      - "--base-version '1.2.0' produces '1.2.0.dev1'"
      - "Empty --base-version produces '1.1.23.dev1' (fallback)"
      - "Invalid --base-version exits code 2 with PEP 440 error"
      - "Sequential counter works: existing dev1 yields dev2"
      - "[tool.commitizen] section in pyproject.toml with pep440 scheme"
    architectural_constraints:
      - "calculate_dev() signature extended; rc/stable/nwave-ai untouched"
      - "Validation reuses existing _validate_version() pattern"
    files_modified:
      - "pyproject.toml"
      - "scripts/release/next_version.py"
      - "tests/release/test_next_version.py"
    traceability:
      - "US-CZ-01 scenarios 1-5"
      - "US-CZ-03 scenarios 3, 5"

  step_02:
    title: "Version floor override in calculate_dev"
    description: >
      Add --version-floor CLI arg. Apply floor comparison after CZ/fallback
      resolution using packaging.Version ordering. Floor wins only when higher
      than resolved base.
    acceptance_criteria:
      - "Floor '1.3.0' overrides base '1.2.0' producing '1.3.0.dev1'"
      - "Floor '1.1.0' ignored when base is '1.2.0'"
      - "Floor overrides fallback when CZ fails (empty base + high floor)"
      - "Invalid floor exits code 2 with descriptive error"
      - "Empty floor applies no override"
    architectural_constraints:
      - "Floor comparison uses packaging.version.Version"
      - "Floor applies to dev stage only; rc/stable untouched"
    files_modified:
      - "scripts/release/next_version.py"
      - "tests/release/test_next_version.py"
    traceability:
      - "US-CZ-02 scenarios 1-5"
      - "US-CZ-03 scenario 4"

  step_03:
    title: "Mid-cycle escalation and counter reset validation"
    description: >
      Validate that base version change mid-cycle (e.g. 1.1.26 to 1.2.0)
      naturally resets dev counter via _highest_counter base filtering. Validate
      tag coexistence and no de-escalation after revert.
    acceptance_criteria:
      - "Base '1.2.0' resets counter to dev1 (no v1.2.0.dev* tags)"
      - "Old v1.1.26.dev* tags ignored when base is '1.2.0'"
      - "Multiple base versions coexist in tag list"
      - "Reverted feat does not change CZ output (scans all commits)"
    architectural_constraints:
      - "No code changes; tests prove existing _highest_counter behavior"
      - "Tests use deterministic tag lists, no git dependency"
    files_modified:
      - "tests/release/test_next_version.py"
    traceability:
      - "US-CZ-01 scenarios 6-7"
      - "US-CZ-01b Gherkin scenarios (6 escalation permutations)"

  step_04:
    title: "Workflow wiring: CZ + floor steps in release-dev.yml"
    description: >
      Add CZ analysis step and floor read step to version-calc job. Wire
      outputs to next_version.py via --base-version and --version-floor args.
      Use || BASE="" pattern for CZ error absorption.
    acceptance_criteria:
      - "CZ step runs cz bump --get-next with || BASE='' fallback"
      - "Floor step reads tool.nwave.public_version via read_toml_field.py"
      - "Both values passed to next_version.py"
      - "pip install includes commitizen alongside packaging"
      - "Existing workflow structure unchanged (CI gate, build, tag, notify)"
    architectural_constraints:
      - "commitizen added to pip install (already a dev dependency)"
      - "release-rc.yml and release-prod.yml remain untouched"
    files_modified:
      - ".github/workflows/release-dev.yml"
    traceability:
      - "US-CZ-01 AC (workflow wiring)"
      - "US-CZ-02 AC (floor read in workflow)"
      - "US-CZ-03 scenarios 1-2"

  step_05:
    title: "Full promotion chain validation (dev to RC to stable)"
    description: >
      Validate three-stage promotion after mid-cycle escalation. Prove
      discover_tag picks highest by packaging.Version, RC strips dev suffix,
      stable strips RC suffix, self-healing works, floor not consulted at
      RC/stable.
    acceptance_criteria:
      - "discover_tag picks v1.2.0.dev2 over v1.1.26.dev8"
      - "calculate_rc strips v1.2.0.dev2 to 1.2.0rc1"
      - "calculate_stable strips v1.2.0rc2 to 1.2.0"
      - "Self-healing: accidental v1.1.26rc1 ignored at stable"
      - "Floor NOT consulted at RC or stable stages"
    architectural_constraints:
      - "No code changes; tests validate existing behavior"
      - "Tests use --tag-list for deterministic input"
    files_modified:
      - "tests/release/test_next_version.py"
    traceability:
      - "US-CZ-04 scenarios 1-7"

  step_06:
    title: "CZ config expansion and PSR config removal"
    description: >
      Expand [tool.commitizen] with version_files and changelog_file. Remove
      [tool.semantic_release] and all sub-sections. Remove python-semantic-release
      from dev deps. Delete .releaserc. Regenerate requirements.lock.
    acceptance_criteria:
      - "version_files includes 'nWave/VERSION' and 'nWave/framework-catalog.yaml:version'"
      - "changelog_file set to 'CHANGELOG.md'"
      - ".releaserc no longer exists in the repo"
      - "[tool.semantic_release] and sub-sections absent from pyproject.toml"
      - "python-semantic-release absent from pyproject.toml and requirements.lock"
    architectural_constraints:
      - "[tool.commitizen] is the sole version management config"
      - "commitizen>=3.12.0 remains as the only version tool dependency"
    files_modified:
      - "pyproject.toml"
      - ".releaserc (DELETED)"
      - "requirements.lock (regenerated)"
    traceability:
      - "US-CZ-05 scenarios 1-4 (config, .releaserc, PSR sections, dependency)"

  step_07:
    title: "Legacy release.yml migration from PSR to CZ"
    description: >
      Replace semantic-release commands with cz bump in version-bump job. Update
      sync-public strip regex from [tool.semantic_release] to [tool.commitizen].
      Remove .releaserc from rsync excludes in all 3 release workflows.
    acceptance_criteria:
      - "version-bump uses 'cz bump' instead of 'semantic-release version'"
      - "dry-run uses 'cz bump --dry-run' instead of 'semantic-release version --print'"
      - "force-bump uses 'cz bump --increment {level}'"
      - "sync-public strips [tool.commitizen] instead of [tool.semantic_release]"
      - "rsync excludes in release.yml, release-rc.yml, release-prod.yml no longer reference .releaserc"
    architectural_constraints:
      - "Observable behavior of version-bump preserved (same inputs/outputs)"
      - "build, github-release, publish jobs untouched"
    files_modified:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-rc.yml"
      - ".github/workflows/release-prod.yml"
    traceability:
      - "US-CZ-05 scenarios 5-6 (release.yml migration, changelog)"

  step_08:
    title: "CI and documentation reference cleanup (PSR to CZ)"
    description: >
      Update ci.yml version-drift message to reference commitizen. Update
      workflows README.md to describe CZ as the version management tool.
    acceptance_criteria:
      - "ci.yml prints 'commitizen' not 'python-semantic-release' in drift message"
      - "workflows README describes CZ as version management tool"
      - "No remaining references to PSR in workflow files or docs"
    architectural_constraints:
      - "Check logic unchanged; only human-readable messages updated"
    files_modified:
      - ".github/workflows/ci.yml"
      - ".github/workflows/README.md"
    traceability:
      - "US-CZ-05 scenario 7 (CI and documentation references)"

