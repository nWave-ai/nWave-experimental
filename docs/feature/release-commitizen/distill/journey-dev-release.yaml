journey:
  name: "CZ-Driven Dev Release Version Calculation"
  epic: "release-commitizen"
  trigger: "Manual workflow_dispatch on master (same trigger as today)"
  persona: "Mike (release engineer, nwave-dev maintainer)"

  emotional_arc:
    start: "Frustrated - version bump ignores commit types"
    middle: "Trusting - CZ analyzes commits, priority chain resolves correctly"
    end: "Confident - correct bump level, tagged, traceable"

  problem:
    summary: "next_version.py always calls _bump_patch() for dev releases"
    example: "4 feat: commits produced v1.1.23.dev2 instead of v1.2.0.dev1"
    root_cause: "Hardcoded patch bump ignores conventional commit semantics"

  steps:
    - id: "cz-analysis"
      name: "Commitizen determines bump level"
      actor: "CI/CD system"
      action: "Run cz bump --get-next to analyze commits since last stable tag"
      consumes:
        - pyproject_toml_version: "Current version anchored at last stable (e.g. 1.1.22)"
        - git_history: "Commits since last stable tag"
        - tool_commitizen_config: "CZ config in pyproject.toml"
      produces:
        - cz_base_version: "e.g. 1.2.0 (feat commits) or 1.1.23 (fix commits only)"
      feeling: "Trusting"
      rules:
        - "cz bump --get-next outputs just the version string, no side effects"
        - "feat: -> minor bump, fix: -> patch bump, !: -> major bump"
        - "Highest bump level across all commits wins"
        - "CZ always re-scans ALL commits since last stable tag (pyproject.toml version), not just new ones since last dev tag"
        - "Mid-cycle escalation: if a feat: appears after fix:-only dev releases, CZ output jumps from patch to minor (e.g. 1.1.26 to 1.2.0)"
        - "De-escalation cannot happen: a feat: commit stays in git history even if reverted; CZ still sees it"
        - "If CZ fails or returns empty, output is empty string (not an error)"
      error_path:
        on_failure: "Output empty string. Pipeline continues with fallback."
        on_unparseable: "Output empty string. Pipeline continues with fallback."

    - id: "floor-read"
      name: "Read version floor from pyproject.toml"
      actor: "CI/CD system"
      action: "Read [tool.nwave].public_version via read_toml_field.py"
      consumes:
        - pyproject_toml: "[tool.nwave].public_version field"
      produces:
        - version_floor: "e.g. 1.1.0"
      feeling: "Aware"
      rules:
        - "Floor is a manual override set by the team in pyproject.toml"
        - "Floor only wins when it is strictly greater than the CZ base"
        - "Empty or missing floor is treated as no override"

    - id: "version-calc"
      name: "Calculate next dev version with priority chain"
      actor: "CI/CD system"
      action: "Run next_version.py --stage dev --base-version {cz} --version-floor {floor}"
      consumes:
        - cz_base_version: "From cz-analysis step"
        - version_floor: "From floor-read step"
        - pyproject_toml_version: "Current version for fallback"
        - existing_dev_tags: "For sequential counter"
      produces:
        - dev_version: "e.g. 1.2.0.dev1"
        - dev_tag: "e.g. v1.2.0.dev1"
      feeling: "Confident"
      rules:
        - "Priority: floor (if higher) > CZ base > _bump_patch fallback"
        - "Sequential .devN counter from existing tags for the resolved base"
        - "_highest_counter filters tags by base version: when base changes (e.g. 1.1.26 to 1.2.0), old dev tags are invisible and counter resets to dev1"
        - "Multiple base versions can coexist in tags (v1.1.26.dev8 and v1.2.0.dev1 are both valid)"
        - "Output is PEP 440 compliant"
      error_path:
        on_invalid_floor: "Exit code 2: 'Invalid version-floor'"
        on_invalid_base: "Exit code 2: 'Invalid base-version'"

  version_resolution:
    priority_chain:
      - level: 1
        name: "Version floor override"
        source: "[tool.nwave].public_version"
        condition: "floor > base_version"
        example: "floor 2.0.0 > CZ 1.2.0 -> base = 2.0.0"
      - level: 2
        name: "Commitizen commit analysis"
        source: "cz bump --get-next"
        condition: "--base-version is non-empty"
        example: "4 feat: commits -> base = 1.2.0"
      - level: 3
        name: "_bump_patch fallback"
        source: "current_version.micro + 1"
        condition: "--base-version is empty (CZ failed or returned nothing)"
        example: "current 1.1.22 -> base = 1.1.23"

  example_scenarios:
    - name: "feat commits, no floor override"
      cz_output: "1.2.0"
      floor: "1.1.0"
      existing_tags: []
      result: "1.2.0.dev1"
      explanation: "CZ detects feat commits -> minor bump. Floor is lower, ignored."

    - name: "fix commits only"
      cz_output: "1.1.23"
      floor: "1.1.0"
      existing_tags: []
      result: "1.1.23.dev1"
      explanation: "CZ detects only fix commits -> patch bump."

    - name: "floor overrides CZ"
      cz_output: "1.2.0"
      floor: "1.3.0"
      existing_tags: []
      result: "1.3.0.dev1"
      explanation: "Floor 1.3.0 > CZ 1.2.0, floor wins."

    - name: "CZ fails, fallback to patch"
      cz_output: ""
      floor: "1.1.0"
      existing_tags: []
      result: "1.1.23.dev1"
      explanation: "CZ empty -> _bump_patch(1.1.22) = 1.1.23. Floor is lower."

    - name: "CZ fails, floor overrides fallback"
      cz_output: ""
      floor: "2.0.0"
      existing_tags: []
      result: "2.0.0.dev1"
      explanation: "CZ empty -> fallback 1.1.23. Floor 2.0.0 > 1.1.23, floor wins."

    - name: "Sequential counter with existing tags"
      cz_output: "1.2.0"
      floor: "1.1.0"
      existing_tags: ["v1.2.0.dev1"]
      result: "1.2.0.dev2"
      explanation: "CZ base 1.2.0, existing dev1 tag, counter increments to dev2."

    - name: "Mid-cycle patch-to-minor escalation"
      pyproject_version: "1.1.25"
      cz_output: "1.2.0"
      floor: ""
      existing_tags: ["v1.1.26.dev1", "v1.1.26.dev2", "v1.1.26.dev3", "v1.1.26.dev4", "v1.1.26.dev5", "v1.1.26.dev6", "v1.1.26.dev7", "v1.1.26.dev8"]
      result: "1.2.0.dev1"
      explanation: "feat: commit added mid-cycle. CZ re-scans all commits since v1.1.25, outputs 1.2.0. _highest_counter finds no v1.2.0.dev* tags (v1.1.26.dev* are invisible). Counter resets to dev1."

    - name: "Mid-cycle patch-to-major escalation"
      pyproject_version: "1.1.25"
      cz_output: "2.0.0"
      floor: ""
      existing_tags: ["v1.1.26.dev1", "v1.1.26.dev2", "v1.1.26.dev3"]
      result: "2.0.0.dev1"
      explanation: "Breaking change commit added mid-cycle. CZ outputs 2.0.0. Old v1.1.26.dev* tags invisible to counter."

    - name: "Mid-cycle minor-to-major escalation"
      pyproject_version: "1.1.25"
      cz_output: "2.0.0"
      floor: ""
      existing_tags: ["v1.2.0.dev1", "v1.2.0.dev2", "v1.2.0.dev3", "v1.2.0.dev4"]
      result: "2.0.0.dev1"
      explanation: "BREAKING CHANGE added after feat: commits. CZ outputs 2.0.0. Old v1.2.0.dev* tags invisible to counter."

    - name: "Multiple base versions coexist after escalation"
      pyproject_version: "1.1.25"
      cz_output: "1.2.0"
      floor: ""
      existing_tags: ["v1.1.26.dev1", "v1.1.26.dev2", "v1.1.26.dev3", "v1.1.26.dev4", "v1.1.26.dev5", "v1.1.26.dev6", "v1.1.26.dev7", "v1.1.26.dev8", "v1.2.0.dev1"]
      result: "1.2.0.dev2"
      explanation: "After escalation, both v1.1.26.dev* and v1.2.0.dev* tags coexist. Counter only matches v1.2.0.dev* (finds dev1), produces dev2."

    - name: "Reverted feat does not de-escalate"
      pyproject_version: "1.1.25"
      cz_output: "1.2.0"
      floor: ""
      existing_tags: ["v1.2.0.dev1"]
      result: "1.2.0.dev2"
      explanation: "A feat: commit was reverted, but CZ scans all commits including the original feat:. Highest bump is still MINOR. CZ outputs 1.2.0. No de-escalation."

  shared_artifacts:
    - name: "cz_base_version"
      source: "cz-analysis"
      consumers: ["version-calc (--base-version arg)"]
      format: "PEP 440 base version string or empty"

    - name: "version_floor"
      source: "floor-read"
      consumers: ["version-calc (--version-floor arg)"]
      format: "PEP 440 base version string or empty"

    - name: "dev_version"
      source: "version-calc"
      consumers: ["tag-release", "notify", "Stage 2 RC promotion"]
      format: "PEP 440: X.Y.Z.devN"

    - name: "dev_tag"
      source: "version-calc"
      consumers: ["tag-release", "Stage 2 RC promotion", "traceability"]
      format: "vX.Y.Z.devN"

  integration_checkpoints:
    - between: ["cz-analysis", "version-calc"]
      validates: "CZ output is either a valid PEP 440 base version or empty string"
    - between: ["floor-read", "version-calc"]
      validates: "Floor is either a valid PEP 440 base version or empty string"
    - between: ["version-calc", "tag-release"]
      validates: "Calculated version is valid PEP 440 devN format"

  promotion_chain:
    description: "Full dev -> RC -> stable promotion after mid-cycle escalation"
    stages:
      - id: "stage-1-dev"
        name: "Dev Release"
        workflow: "release-dev.yml"
        trigger: "workflow_dispatch (auto or manual)"
        auto_discover: false
        input: "CZ analysis + floor override"
        output: "dev tag (e.g. v1.2.0.dev2)"
        floor_applied: true

      - id: "stage-2-rc"
        name: "RC Promotion"
        workflow: "release-rc.yml"
        trigger: "workflow_dispatch (manual, tag field empty)"
        auto_discover: true
        auto_discover_tool: "discover_tag.py --pattern dev"
        auto_discover_sort: "packaging.Version (semantic, not lexicographic)"
        input: "resolved dev tag (highest by Version sort)"
        output: "RC tag (e.g. v1.2.0rc1)"
        floor_applied: false
        version_calc: "calculate_rc: strip dev suffix to base, append rcN"
        counter_source: "existing v{base}rc* tags"

      - id: "stage-3-stable"
        name: "Stable Promotion"
        workflow: "release-prod.yml"
        trigger: "workflow_dispatch (manual, tag field empty)"
        auto_discover: true
        auto_discover_tool: "discover_tag.py --pattern rc"
        auto_discover_sort: "packaging.Version (semantic, not lexicographic)"
        input: "resolved RC tag (highest by Version sort)"
        output: "stable tag (e.g. v1.2.0)"
        floor_applied: false
        version_calc: "calculate_stable: strip RC suffix to base"
        side_effects:
          - "pyproject.toml version bumped to stable version"
          - "GitHub Release (full, not pre-release)"
          - "PyPI stable publish"
          - "nwave-ai/nwave public repo synced"
          - "Marker tag on nwave-dev"

    orphaned_tags:
      description: "Dev tags from pre-escalation base (e.g. v1.1.26.dev*) are never promoted"
      behavior: "Remain as historical artifacts in the repo"
      safety: "discover_tag.py always picks the highest by packaging.Version, so orphaned tags from lower bases are invisible to promotion"

    self_healing:
      description: "Accidental wrong-tag promotions are self-correcting"
      mechanism: "discover_tag.py always picks the highest tag at each stage"
      example: "v1.1.26rc1 (accidental) and v1.2.0rc1 (correct) both exist; stable promotion picks v1.2.0rc1"

    one_click_ux:
      description: "Each stage requires one click with no manual tag entry"
      mechanism: "Leave tag input field empty; discover_tag.py auto-discovers"
      chain_example: "v1.2.0.dev2 -> click -> v1.2.0rc1 -> click -> v1.2.0"

  promotion_chain_scenarios:
    - name: "Dev to RC after mid-cycle escalation"
      tags_in_repo: ["v1.1.26.dev1", "v1.1.26.dev2", "v1.1.26.dev3", "v1.1.26.dev4", "v1.1.26.dev5", "v1.1.26.dev6", "v1.1.26.dev7", "v1.1.26.dev8", "v1.2.0.dev1", "v1.2.0.dev2"]
      discover_pattern: "dev"
      discover_result: "v1.2.0.dev2"
      calculate_function: "calculate_rc"
      result: "1.2.0rc1"
      explanation: "discover_tag sorts by packaging.Version; 1.2.0.dev2 > 1.1.26.dev8. calculate_rc strips to 1.2.0, appends rc1."

    - name: "Sequential RC counter"
      tags_in_repo: ["v1.2.0.dev2", "v1.2.0.dev3", "v1.2.0rc1"]
      discover_pattern: "dev"
      discover_result: "v1.2.0.dev3"
      calculate_function: "calculate_rc"
      existing_rc_tags: ["v1.2.0rc1"]
      result: "1.2.0rc2"
      explanation: "Bug found in rc1, fix merged, dev3 created. RC counter increments to rc2."

    - name: "RC to stable"
      tags_in_repo: ["v1.2.0rc1", "v1.2.0rc2"]
      discover_pattern: "rc"
      discover_result: "v1.2.0rc2"
      calculate_function: "calculate_stable"
      result: "1.2.0"
      explanation: "discover_tag finds highest RC; calculate_stable strips to base."

    - name: "Accidental wrong-tag self-heals at stable"
      tags_in_repo: ["v1.1.26rc1", "v1.2.0rc1"]
      discover_pattern: "rc"
      discover_result: "v1.2.0rc1"
      calculate_function: "calculate_stable"
      result: "1.2.0"
      explanation: "v1.1.26rc1 was accidental. discover_tag picks v1.2.0rc1 (higher). Stable is 1.2.0."

    - name: "Floor not applied at RC stage"
      floor: "2.0.0"
      dev_tag: "v1.2.0.dev2"
      calculate_function: "calculate_rc"
      result: "1.2.0rc1"
      explanation: "Floor is dev-stage only. RC inherits base from dev tag, not floor."

    - name: "Full chain one-click"
      pyproject_version: "1.1.25"
      dev_tag: "v1.2.0.dev2"
      rc_result: "1.2.0rc1"
      stable_result: "1.2.0"
      clicks: 2
      manual_tag_entries: 0
      chain: "v1.2.0.dev2 -> v1.2.0rc1 -> v1.2.0"

  files_changed:
    - file: "pyproject.toml"
      change: "Add [tool.commitizen] section (4 lines)"
    - file: "scripts/release/next_version.py"
      change: "Add --base-version and --version-floor args; refactor calculate_dev()"
    - file: "tests/release/test_next_version.py"
      change: "Add TestDevBaseVersionAndFloor class (5 tests)"
    - file: ".github/workflows/release-dev.yml"
      change: "Add CZ analysis step, floor read step, pass both to next_version.py"
