journey:
  name: "RC Release (Promote to Beta)"
  epic: "release-train-revamp"
  stage: 2
  trigger: "Manual workflow_dispatch, referencing a dev tag"
  persona: "Mike (maintainer) + Beta Testers (consumers)"

  emotional_arc:
    start: "Deliberate - promoting with intention after reviewing dev release"
    middle: "Transparent - published to prod PyPI with pre-release marker"
    end: "Distributed - beta testers have access via standard tooling"

  steps:
    - id: "trigger"
      name: "Trigger RC promotion"
      actor: "Mike"
      action: "workflow_dispatch on release-rc.yml"
      inputs:
        - source_dev_tag: "e.g. v1.1.22.dev3"
        - dry_run: "boolean (default: false)"
      feeling: "Deliberate"
      produces:
        - workflow_run_id

    - id: "validate-source"
      name: "Validate source dev tag"
      actor: "CI/CD system"
      action: "Confirm dev tag exists, checkout that exact commit"
      consumes:
        - source_dev_tag
      produces:
        - validated_commit_sha
        - base_version: "1.1.22"
      feeling: "Trusting"
      error_path:
        on_missing_tag: "STOP. List available dev tags for that version."

    - id: "ci-status-gate"
      name: "CI Status Gate"
      actor: "CI/CD system"
      action: "Query GitHub API check-runs for the validated commit SHA; verify all checks passed"
      consumes:
        - validated_commit_sha
      produces:
        - ci_check_status: "green | failed | pending | none"
      feeling: "Trusting"
      rules:
        - "Single API call: GET /repos/{owner}/{repo}/commits/{sha}/check-runs"
        - "Four outcomes: all green (proceed), any failed (STOP), any pending (STOP), no checks (STOP)"
        - "No tests re-run; the commit was already validated by trunk CI"
        - "Fail fast: cheapest validation first (2-second API call before version calculation)"
      error_path:
        on_failed: "STOP. 'CI failed on {sha}'. No RC created."
        on_pending: "STOP. 'CI still running on {sha}, retry later'."
        on_none: "STOP. 'No CI run found for {sha}'."

    - id: "version-calc"
      name: "Calculate RC version"
      actor: "CI/CD system"
      action: "Determine next rcN for the base version"
      consumes:
        - base_version
        - existing_rc_tags
      produces:
        - rc_version: "e.g. 1.1.22rc1"
      gate: "ci-status-gate must be green"
      rules:
        - "PEP 440 format: X.Y.ZrcN (no dot before rc)"
        - "Sequential integer for N"
        - "N increments from highest existing rcN for same X.Y.Z"

    - id: "build"
      name: "Build from same commit"
      actor: "CI/CD system"
      action: "Build dist packages from the validated commit"
      consumes:
        - validated_commit_sha
      produces:
        - dist_artifacts: "wheel + sdist"
        - checksums: "SHA256SUMS.txt"
      feeling: "Rigorous"
      notes: "Promotion, not rebuild. Same source as the dev release."

    - id: "tag-release"
      name: "Create RC tag and GitHub pre-release"
      actor: "CI/CD system"
      action: "git tag vX.Y.ZrcN on nwave-dev, create GitHub pre-release"
      consumes:
        - rc_version
        - dist_artifacts
      produces:
        - rc_tag: "v1.1.22rc1"
        - github_pre_release_url
      feeling: "Progressing"

    - id: "pypi-publish"
      name: "Publish to PyPI production"
      actor: "CI/CD system"
      action: "Upload to PyPI with pre-release marker via OIDC"
      consumes:
        - dist_artifacts
      produces:
        - pypi_package_url
      feeling: "Transparent"
      rules:
        - "Trusted Publisher (OIDC), no stored API tokens"
        - "Pre-release marker: pip ignores by default"
        - "Users opt in: pip install --pre nwave-ai"
      error_path:
        on_version_exists: "Warning; version already on PyPI. Increment rcN."
        on_oidc_failure: "STOP. Check Trusted Publisher configuration."

    - id: "sync-beta-repo"
      name: "Sync to nWave-beta repo"
      actor: "CI/CD system"
      action: "rsync to nwave-ai/nWave-beta, patch pyproject.toml, commit with traceability"
      consumes:
        - source_code_at_commit
        - rc_version
        - source_dev_tag
        - validated_commit_sha
      produces:
        - beta_repo_commit
        - beta_repo_tag: "v1.1.22rc1"
        - beta_repo_release_url
      feeling: "Distributing"
      traceability:
        commit_message: |
          chore(release): v1.1.22rc1

          Source: nwave-dev@{validated_commit_sha}
          Dev tag: {source_dev_tag}
          Pipeline: {workflow_run_url}

    - id: "notify"
      name: "Slack notification"
      actor: "CI/CD system"
      action: "Send RC release notification with install instructions"
      consumes:
        - rc_version
        - pypi_package_url
        - beta_repo_release_url
      feeling: "Accomplished"

  beta_tester_journey:
    - id: "discover"
      actor: "Beta tester"
      action: "Visit nWave-beta repo, see pre-release"
      feeling: "Invited"
    - id: "install"
      actor: "Beta tester"
      action: "pip install --pre nwave-ai==1.1.22rc1"
      feeling: "Easy"
    - id: "feedback"
      actor: "Beta tester"
      action: "File issues on nWave-beta repo"
      feeling: "Valued"

  shared_artifacts:
    - name: "rc_version"
      source: "version-calc"
      consumers: ["tag-release", "pypi-publish", "sync-beta-repo", "notify", "Stage 3"]
    - name: "rc_tag"
      source: "tag-release"
      consumers: ["Stage 3 stable promotion", "traceability chain"]
    - name: "source_dev_tag"
      source: "trigger input"
      consumers: ["validate-source", "sync-beta-repo commit message"]
    - name: "ci_check_status"
      source: "ci-status-gate"
      consumers: ["build gate"]
    - name: "validated_commit_sha"
      source: "validate-source"
      consumers: ["ci-status-gate", "build", "sync-beta-repo commit message", "Stage 3"]
    - name: "dist_artifacts"
      source: "build"
      consumers: ["tag-release", "pypi-publish"]
    - name: "pypi_package_url"
      source: "pypi-publish"
      consumers: ["notify", "beta testers"]

  integration_checkpoints:
    - between: ["validate-source", "ci-status-gate"]
      validates: "Source dev tag resolves to a valid commit"
    - between: ["ci-status-gate", "version-calc"]
      validates: "CI passed on the source commit SHA; safe to proceed with version calculation"
    - between: ["version-calc", "build"]
      validates: "RC version calculated; ready to build"
    - between: ["build", "pypi-publish"]
      validates: "Build succeeded; wheel passes twine check"
    - between: ["pypi-publish", "sync-beta-repo"]
      validates: "Package available on PyPI before beta repo release"
    - between: ["Stage 2", "Stage 3"]
      validates: "RC tag exists, PyPI package installable, beta testing complete"
