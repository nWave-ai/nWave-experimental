# Definition-of-Ready canonical item-set -- the ONE authoritative place (AD-55).
#
# SSOT for the 9-item Definition-of-Ready hard gate. Transcribed verbatim from
# the canonical home `nWave/agents/nw-product-owner.md`, heading
# "## DoR Checklist (9-Item Hard Gate)" (line numbers drift as the agent file
# is edited -- cite the heading text, not a raw line range, so this pointer
# survives reformatting). Item 9 (Outcome-KPIs) is the live-hole closure: a
# loaded 8-item skill copy silently drops it -- this file restores it as
# authoritative.
#
# Read-only by the `scripts/cli/read_dor_items.py` standalone reader (stdlib
# block-sequence scan, NO `des` gate-catalog coupling, OSS hooks-only per D-2).
#
# `items`       -- the enumerated nine readiness items, in id order.
# `hard_gates`  -- separate hard gates ABOVE the nine (DISCUSS D-5 / DDD-3);
#                  job-traceability is NOT readiness item ten.

version: "1.0.0"

items:
  - Problem statement clear, domain language
  - User/persona with specific characteristics
  - 3+ domain examples with real data
  - UAT in Given/When/Then (3-7 scenarios)
  - AC derived from UAT
  - Right-sized (1-3 days, 3-7 scenarios)
  - Technical notes: constraints/dependencies
  - Dependencies resolved or tracked
  - Outcome KPIs defined with measurable targets and a stated baseline (current-state value the target is measured against)

hard_gates:
  - job-traceability
