# Language-Adapter Port Catalog -- SSOT
# F-LANGUAGE-ADAPTER-PLUGIN-INFRASTRUCTURE slice-01 walking-skeleton floor
#
# Machine-readable distillation of docs/architecture/language-adapter-catalog.md
# (Nova-audit v0). Consumed by:
#   - scripts/cli/validate_language_adapter_catalog.py   (schema + path grounding)
#   - src/des/cli/doctor.py                              (per-target-language gap report)
#
# Slice-01 floor enumerates the three Nova-audited LANGUAGE_BOUND gate CLIs
# (the walking-skeleton substrate). Subsequent slices append the remaining
# Nova v0 ports (slice-02..slice-07) per the F-LANGUAGE-ADAPTER-PLUGIN-INFRA
# slice plan.
#
# Validate: python -m scripts.cli.validate_language_adapter_catalog \
#   nWave/data/language-adapter-ports.yaml
#
# Schema: nWave/schemas/language-adapter-ports.schema.json

schema-version: "1.0"

supported-languages:
  - python
  - typescript
  - go

ports:
  - port-id: run_contract_gate
    classification: LANGUAGE_BOUND
    summary: >-
      Contract-marker scope digest + whole-tree contract suite invocation via
      pytest. Python-only test runner; needs per-language TestRunnerPort
      adapter for non-Python targets.
    witnesses:
      - src/des/cli/run_contract_gate.py

  - port-id: verify_environmental_e2e
    classification: LANGUAGE_BOUND
    summary: >-
      Wheel build + pip install --target + pytest invocation for E1
      environmental-e2e gate. Bound to Python build toolchain (hatchling /
      setuptools / pip) and pytest test runner.
    witnesses:
      - src/des/cli/verify_environmental_e2e.py

  - port-id: check_robustness_density
    classification: LANGUAGE_BOUND
    summary: >-
      PBT density gate -- globs *.py + greps for `# domain: <id>`-tagged
      @given (Hypothesis). Python-only scan + decorator convention; needs
      per-language PropertyBasedTestingPort adapter for TS/Go/Rust.
    witnesses:
      - scripts/cli/check_robustness_density.py
