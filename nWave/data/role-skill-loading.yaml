version: 1
roles:
  nw-software-crafter:
    on_demand:
      nw-algebraic-design-protocol: CONTESTED_LAW or REPRESENTATION_CHANGE obligation, or contested law/representation change
      nw-certainty-by-construction: INVALID_STATE or PRESERVATION obligation, or invalid-state/preservation claim
    phase:
      nw-code-design-oo: GREEN or refactor on an object-oriented route
  nw-functional-software-crafter:
    on_demand:
      nw-algebraic-design-protocol: CONTESTED_LAW or REPRESENTATION_CHANGE obligation, or contested law/representation change
      nw-certainty-by-construction: INVALID_STATE or PRESERVATION obligation, or invalid-state/preservation claim
    phase:
      nw-fp-principles: PREPARE on a functional route
      nw-fp-algebra-driven-design: GREEN on a functional route
      nw-code-design-fp: GREEN or refactor on a functional route
  nw-software-crafter-reviewer:
    reviewer_of:
      - nw-software-crafter
      - nw-functional-software-crafter
    phase:
      nw-sc-review-dimensions: review start
      nw-at-completeness-check: AT-density review
  nw-solution-architect:
    on_demand:
      nw-algebraic-design-protocol: contested design or law
      nw-certainty-by-construction: invalid-state or preservation claim
      nw-stress-analysis: external/nondeterministic boundary; recovery/degradation; contagion; substrate uncertainty; high-uncertainty socio-technical boundary; or explicit --residuality force-on
    paradigm:
      object_oriented: nw-code-design-oo
      functional: nw-code-design-fp
  nw-solution-architect-reviewer:
    reviewer_of:
      - nw-solution-architect
    phase:
      nw-sar-critique-dimensions: architecture review
  nw-ddd-architect:
    on_demand:
      nw-algebraic-design-protocol: contested design or law
      nw-certainty-by-construction: invalid-state or preservation claim
      nw-stress-analysis: external/nondeterministic boundary; recovery/degradation; contagion; substrate uncertainty; high-uncertainty socio-technical boundary; or explicit --residuality force-on
    paradigm:
      object_oriented: nw-code-design-oo
      functional: nw-code-design-fp
  nw-ddd-architect-reviewer:
    reviewer_of:
      - nw-ddd-architect
    phase:
      nw-ddd-strategic: review start
      nw-ddd-architect: review start
      nw-ddd-tactical: aggregate review
  nw-platform-architect:
    on_demand:
      nw-algebraic-design-protocol: contested design or law
      nw-certainty-by-construction: invalid-state or preservation claim
      nw-stress-analysis: external/nondeterministic boundary; recovery/degradation; contagion; substrate uncertainty; high-uncertainty socio-technical boundary; or explicit --residuality force-on
  nw-system-designer:
    on_demand:
      nw-algebraic-design-protocol: contested infrastructure or recovery law
      nw-certainty-by-construction: invalid recovery or failure-policy state
      nw-stress-analysis: external/nondeterministic boundary; recovery/degradation; contagion; substrate uncertainty; high-uncertainty socio-technical boundary; or explicit --residuality force-on
  nw-system-designer-reviewer:
    reviewer_of:
      - nw-system-designer
  nw-platform-architect-reviewer:
    reviewer_of:
      - nw-platform-architect
    phase:
      nw-par-critique-dimensions: dimension review
      nw-par-review-criteria: dimension review
      nw-review-output-format: output generation
  nw-acceptance-designer:
    on_demand:
      nw-algebraic-design-protocol: compositional or stateful surface
      nw-certainty-by-construction: invalid-state or preservation claim
    phase:
      nw-test-design-mandates: Phase 0 policy detection
      nw-property-based-testing: BROAD_INPUT_DOMAIN obligation, or Phase 2 property authoring
      nw-code-analysis-port: F — code/test fact query
    catalog_only:
      - nw-bdd-methodology
      - nw-test-design-mandates-scenario-design
      - nw-test-design-mandates-layered-mechanics
      - nw-test-design-mandates-composition-contract
      - nw-test-organization-conventions
      - nw-ad-critique-dimensions
      - nw-tdd-methodology-paradigm
      - nw-tdd-methodology-walking-skeleton
      - nw-distill
      - nw-distill-prior-wave-reading
      - nw-distill-feature-delta-schema
      - nw-distill-port-treatment-policy
      - nw-distill-red-scaffolding
      - nw-distill-coverage-obligations
      - nw-at-completeness-check
      - nw-test-optimization-paradigm-match
      - nw-test-optimization-consolidation
      - nw-test-refactoring-catalog
      - nw-ad-mandate-summaries
      - nw-ad-distill-dod
      - nw-cross-cutting-invariants
    language_pbt:
      python: nw-pbt-python
      typescript: nw-pbt-typescript
      javascript: nw-pbt-typescript
      rust: nw-pbt-rust
      go: nw-pbt-go
      java: nw-pbt-jvm
      kotlin: nw-pbt-jvm
      scala: nw-pbt-jvm
      dotnet: nw-pbt-dotnet
      csharp: nw-pbt-dotnet
      fsharp: nw-pbt-dotnet
      haskell: nw-pbt-haskell
      erlang: nw-pbt-erlang-elixir
      elixir: nw-pbt-erlang-elixir
  nw-acceptance-designer-reviewer:
    reviewer_of:
      - nw-acceptance-designer
    phase:
      nw-ad-critique-dimensions: review start
      nw-at-completeness-check: review start
  nw-user-examiner:
    reviewer_of: []
