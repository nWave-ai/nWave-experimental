      nw-stress-analysis: external/nondeterministic boundary; recovery/degradation; contagion; substrate uncertainty; high-uncertainty socio-technical boundary; or explicit --residuality force-on
    paradigm:
      object_oriented: nw-code-design-oo
      functional: nw-code-design-fp
