# Dispatch SSOT — atdd_pure mode.
#
# THE single source for "what an atdd_pure dispatch must contain". Consumed by:
#   - `des dispatch`               (reads `profiles.full.sections` + `profiles.lane.*`
#                                   to select a dispatch's section set; section bodies
#                                   are rendered from dispatch.py, not from this file)
#   - atdd_pure_prompt_validator   (CHECKS a dispatch against this — via the
#                                   LANE_PROFILES projection, drift-checked)
#   - skills nw-execute/nw-deliver (NOT YET — nw-execute still carries its own inline
#                                   copy of the dispatch prompt. Replacing that copy
#                                   with a dispatch-ref pointer is the TARGET, not
#                                   today's state; owned by the pinned-lifecycle epic
#                                   F-DES-ATDD-PURE-DISPATCH-LIFECYCLE)
#
# Generator and checker share ONE source → they cannot drift. The operator supplies
# only the fuzzy fills ({intent}, task specifics); the SYSTEM produces the checked
# artifact (system-pays principle, 2026-07-06).
#
# Design: docs/feature/des-dispatch-ssot-renderer/design/dispatch-ssot-design.md
# Vendor rendering (marker syntax / command form / paths): nWave/dispatch/vendors.yaml
version: 1
mode: atdd_pure

# The canonical ordered section id set — each entry is an `id` only; section
# BODIES are rendered from dispatch.py using placeholders {feature_id} {slice}
# {phase} {agent} {command} {lane_title} {intent} {task_context} {design_context}
# {boundary}, not from a field in this file (see header above).
sections:
  - id: DES_METADATA
  - id: AGENT_IDENTITY
  - id: SKILL_LOADING
  - id: TASK_CONTEXT
  - id: DESIGN_CONTEXT
  - id: ATDD_PURE_PHASES
  - id: QUALITY_GATES
  - id: AT_COMPLETION_LEDGER
  - id: RECORDING_INTEGRITY
  - id: BOUNDARY_RULES
  - id: TERMINATING_RUN
  - id: TIMEOUT_INSTRUCTION

# Section-SELECTION profiles. `full` = every section. `review` = full minus the 5
# implementation-only sections (a read-only review writes no code). `lane.*` rows are
# the SSOT projected into src/des/domain/lane_profile.py::LANE_PROFILES (drift-checked).
profiles:
  full:
    sections: [DES_METADATA, AGENT_IDENTITY, SKILL_LOADING, TASK_CONTEXT, DESIGN_CONTEXT,
               ATDD_PURE_PHASES, QUALITY_GATES, AT_COMPLETION_LEDGER, RECORDING_INTEGRITY,
               BOUNDARY_RULES, TERMINATING_RUN, TIMEOUT_INSTRUCTION]
  # Applied when DES-PHASE ∈ {C_REVIEWER_AUDIT, F_FINAL_REVIEW}.
  review:
    drop_sections: [ATDD_PURE_PHASES, QUALITY_GATES, AT_COMPLETION_LEDGER,
                    RECORDING_INTEGRITY, TERMINATING_RUN]
  lane:
    prefactoring:
      # behavior-preserving prefactoring never writes AT-recording sections.
      drop_sections: [AT_COMPLETION_LEDGER, RECORDING_INTEGRITY]
      guard_kind: GREEN_TO_GREEN
      at_requirement: EXEMPT
      feature_readiness: false
      skipped_invariants: [slice_plan_section, scenario_slice_tags,
                           reuse_first_or_design_skip, sustainability]
      annotation_token: prefactoring
      requires: []
    bugfix:
      # a bugfix writes code + records ATs → the FULL section set (unchanged from the
      # previous fall-through-to-full behavior); adds the readiness justification req.
      drop_sections: []
      guard_kind: RED_TO_GREEN
      at_requirement: REQUIRED
      feature_readiness: true
      skipped_invariants: []
      annotation_token: bugfix
      # names the defect + the regression test test_<name> (readiness gate: bugfix_lane_justification).
      requires: [lane_justification]
    charter:
      # NON-CODE-FACING, PHASELESS lane (fix-po-charter-dispatch-marker-lane): a
      # spine-MANDATED sub-dispatch of a `nw-product-owner` authoring an expectation
      # charter, issued INSIDE another wave's active floor (nw-bugfix §Phase 0-charter;
      # nw-deliver §Per-slice pipelining). Charter authoring is NOT one of the 3
      # canonical DELIVER phases, so the dispatch declares NO DES-PHASE at all -- it
      # never borrows D_DISTILL (which asserts "the DISTILL-wave acceptance-designer
      # return") and so never corrupts the audit trail at entry or at exit.
      # It writes no code and records no ATs -> drop the 5 implementation-only sections.
      # (drop_sections MUST stay on ONE line -- dispatch_lane_ssot._read_lane_drop_sections.)
      drop_sections: [ATDD_PURE_PHASES, QUALITY_GATES, AT_COMPLETION_LEDGER, RECORDING_INTEGRITY, TERMINATING_RUN]
      guard_kind: NONE
      at_requirement: EXEMPT
      feature_readiness: false
      skipped_invariants: [slice_plan_section, scenario_slice_tags,
                           reuse_first_or_design_skip, sustainability]
      annotation_token: charter
      requires: []
