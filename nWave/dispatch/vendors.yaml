# Dispatch SSOT — vendor rendering axis.
#
# `des dispatch` derives the marker syntax, command-reference form, config paths and
# instruction surface per target vendor (TargetPlatform, scripts/install/context_detector.py).
# The ENFORCEMENT (the DES adapter, the gates, the section set) is vendor-NEUTRAL — every
# vendor points its hook mechanism at the same Python DES adapter. Only the DELIVERY SURFACE
# derives here. This is the language-adapter-registry pattern on the VENDOR axis: Claude
# rendered fully now; the others are additive rows, verified when first implemented.
#
# Design: docs/feature/des-dispatch-ssot-renderer/design/dispatch-ssot-design.md
version: 1

vendors:
  # target_platform value == context_detector.TargetPlatform member value.
  claude_code:
    status: supported
    config_root: "~/.claude"
    # marker rendered as an HTML comment: "<!-- KEY : VALUE -->"
    marker_syntax: "<!-- {key} : {value} -->"
    # a wave/spine command is referenced as a slash command "/nw-refactor".
    command_ref: "/{command}"
    instruction_surface: skill          # SKILL.md files + /nw-* commands
    injection_event: SessionStart       # matcher startup|clear|compact (using-nwave-spine)

  codex:
    status: todo-verify                 # additive: verify against developers.openai.com/codex before shipping
    config_root: "~/.codex"
    marker_syntax: "# DES-{key}: {value}"   # TODO-verify — Codex has no HTML-comment convention
    command_ref: "{command}"                # TODO-verify — Codex command invocation form
    instruction_surface: developer_instructions   # ~/.codex/config.toml [ ... ] TOML
    injection_event: hooks_json         # ~/.codex/hooks.json (see codex_des_plugin.py)

  copilot_cli:
    status: todo-verify
    config_root: "~/.copilot"
    marker_syntax: "# DES-{key}: {value}"   # TODO-verify
    command_ref: "{command}"                # TODO-verify
    instruction_surface: todo-verify
    injection_event: todo-verify        # see copilot_des_plugin.py (no separate runtime marker per its docstring)

  opencode:
    status: todo-verify
    config_root: "~/.config/opencode"
    marker_syntax: "# DES-{key}: {value}"   # TODO-verify
    command_ref: "{command}"                # TODO-verify
    instruction_surface: todo-verify
    injection_event: todo-verify
