# Workflow-flavor schema (D4 § 3.2 slice-03)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.2.
# Per INV-4 workflow IS data with atdd_pure as the sole active flavor +
# INV-12 future change = reconfig not rewrite.
#
# Files validated against this schema live at `nWave/flavors/<flavor-id>.yaml`.
# Currently: atdd_pure.yaml (the sole executable workflow).

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://nwave.dev/schemas/flavors/_schema.yaml"
title: "nWave Workflow Flavor Schema"
description: |
  Schema for workflow flavor YAML files. A flavor describes which gates
  fire on which lifecycle event, composing atomic gates (per nWave/gates/
  catalog) into a workflow. Customer SELECTS flavor (built-in only):
  no customer-defined flavors per Ale ratification 2026-05-26.

type: object
# mode-registry-single-locus slice-05 (Layer B): the registry is the single,
# COMPLETE home for the mode 4-tuple. The schema-required set is extended from
# {flavor_id, description, lifecycle_events} to additionally require the
# asset-facing 4-tuple fields (display_name, default, selection, skill_load_set,
# descriptor, deliver_phase_shape) so a half-declared mode is refused by the
# schema itself (the mode_registry_completeness gate enforces the cross-flavor
# invariants the schema cannot — exactly-one default, agent existence).
required:
  - flavor_id
  - display_name
  - description
  - default
  - selection
  - skill_load_set
  - descriptor
  - deliver_phase_shape
  - lifecycle_events
additionalProperties: false

properties:
  flavor_id:
    type: string
    pattern: "^[a-z][a-z0-9_]*$"
    description: |
      The sole executable identifier is `atdd_pure`.

  display_name:
    type: string
    minLength: 3
    description: |
      mode-registry-single-locus slice-05 (face (d) of the mode 4-tuple): the
      human-readable mode name. The single locus the 16-skill / 7-agent inline
      prose copies are retired into; assets reference it, never re-state it.

  default:
    type: boolean
    description: |
      mode-registry-single-locus slice-05 (face (b) of the mode 4-tuple):
      whether this flavor is the absent-config default. EXACTLY ONE flavor
      across the registry declares `default: true` (cross-flavor invariant
      enforced by the mode_registry_completeness gate); it MUST equal
      `workflow_mode.resolve_workflow_mode`'s absent-config default (enforced
      by the docgen --check resolver↔registry agreement leg, Layer C).

  selection:
    type: string
    enum: [deterministic-config]
    description: |
      mode-registry-single-locus slice-05: how the mode is selected. ALWAYS
      `deterministic-config` (read from `.nwave/config.yaml` by the resolver),
      NEVER an LLM prompt to the user — this closes the §1.4 leak that turned
      mode selection into asset prose. No conflicting `selection` across
      flavors (enforced by the mode_registry_completeness gate).

  description:
    type: string
    minLength: 20
    description: "Multi-line description of flavor intent + tradeoffs."

  required_artifacts:
    type: array
    description: |
      Artifacts the flavor expects in the feature workspace (validated
      at dispatch time by pre-dispatch readiness gate D1). Placeholders
      like `{feature_id}` are substituted at composition time.
    items:
      type: string
      pattern: "^[a-zA-Z.][a-zA-Z0-9_./*{}-]*$"
    uniqueItems: true

  skill_load_set:
    type: object
    description: |
      mode-registry-single-locus slice-01 (face (c) of the mode 4-tuple):
      per-agent conditional skill-load declarations — the single locus the
      agent specs' inline per-mode tables are retired into. The dispatch
      path resolves `skill_load_set[<agent>].conditional` for the active
      flavor via `flavor_dispatcher.resolve_skill_load_set` (D-inject).
      A declared-empty `conditional: []` is a real answer, distinct from
      an absent agent row (refused fail-closed by the resolver).
    additionalProperties: false
    patternProperties:
      "^[a-z][a-z0-9-]*[a-z0-9]$":
        type: object
        required: [conditional]
        additionalProperties: false
        properties:
          conditional:
            type: array
            description: "Skill names loaded iff this flavor is active."
            items:
              type: string
              pattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
            uniqueItems: true

  descriptor:
    type: string
    minLength: 20
    description: |
      mode-registry-single-locus slice-02 (face (d) of the mode 4-tuple):
      the mode's one-line human-readable descriptor — the factual core of
      the prose docgen projects into `GENERATED:mode-descriptor` regions.
      The registry is the sole author; assets carry projections, never
      hand-written copies.

  deliver_phase_shape:
    type: string
    minLength: 5
    description: |
      Face (d) companion (slice-02): the DELIVER-wave phase shape rendered
      beside the descriptor in `GENERATED:mode-descriptor` regions (e.g.
      "A_GREEN_ATS -> B_COVERAGE_CLEANUP -> (feature-end) E_BATCH_REFACTOR").

  lifecycle_events:
    type: object
    description: |
      Map of abstract lifecycle event name (from host-bridge-events.yaml
      closed vocabulary) to gate composition.
    additionalProperties: false
    patternProperties:
      "^[a-z][a-z0-9_.]*$":
        type: array
        description: "Ordered list of gates to fire on this event."
        items:
          $ref: "#/$defs/GateInvocation"

$defs:
  GateInvocation:
    type: object
    required: [gate_id, on_failure]
    additionalProperties: false
    properties:
      gate_id:
        type: string
        pattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
        description: |
          Must match a gate_id in nWave/gates/_catalog.yaml.
      args:
        type: object
        description: |
          Args passed to the gate CLI invocation. Keys must match cli_args
          declared in the per-gate YAML file.
        additionalProperties: true
      on_failure:
        type: string
        enum: [block, warn, log]
        description: |
          block: halt composition + propagate failure.
          warn: continue composition + annotate result.
          log: continue silently, log event for audit.
      feature_end_required_records:
        type: array
        description: |
          des-spine-control-plane-ssot slice-04 (gate-composition SSOT, DDD-3):
          the feature-end cycle records the subagent.stop boundary demands in
          the AT-completion ledger before a feature is closeable. The YAML home
          of the records the subagent_stop_handler frozenset used to hardcode
          (representation 3 -> 1). Only meaningful on the subagent.stop event.
        items:
          type: string
        uniqueItems: true
      feature_end_na_marker_reconciles:
        type: object
        description: |
          fix-na-marker-reconcile-drift slice-01: the ONE shared source naming
          which NotApplicable marker reconciles which required record above,
          read by BOTH the subagent.stop hook and the CLI mirror via
          des.application.feature_end_na_marker_reconciliation. Each key is an
          emitted NA marker; each value is the required record it discharges.
          Declared here because the flavor and the runtime already carry this
          field -- a schema that omits a field its own flavor ships rejects the
          shipped artifact, and the validator then fails on the CONFORMING
          file. Only meaningful on the subagent.stop event.
        additionalProperties:
          type: string
