# Gate-contract: blast-radius (D4 Phase 1 — control-plane SSOT mirror)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=blast-radius.

gate_id: blast-radius
responsibility: |
  Measure a change's real reach -- files, lines changed, boundary files and
  consumer counts -- and classify it into a tier (S/M/L) from that measurement.
  The line count is NOT the radius: a two-line change to a symbol with many
  callers measures larger. Measurement errors degrade toward L, never silently
  toward S.
module: des.cli.blast_radius
entry_function: main
language_neutral_contract: true

log_events:
  - BlastRadiusMeasured
  - BlastRadiusInputRejected
  - BlastRadiusConfigRejected

failure_modes:
  - error_class: BlastRadiusInputRejected
    exit_code: 2
    remediation: "Provide exactly one input mode (--paths / --staged / --diff) and verify every declared path exists in the scope being measured."
  - error_class: BlastRadiusConfigRejected
    exit_code: 2
    remediation: "A configured blast_radius threshold in .nwave/des-config.json is outside its documented floor/ceiling range; correct the offending threshold."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
