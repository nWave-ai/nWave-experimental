# Gate-contract: bugfix-pipeline-tick (autonomous-consolidation-and-bugfix-loops
# feature, slice-03)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` # 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=bugfix-pipeline-tick.

gate_id: bugfix-pipeline-tick
responsibility: |
  Evaluate one bugfix-pipeline defect stage-transition tick against the D-4
  two-lane invariant: cloud-lane stages (RCA, charter authoring, AT
  authoring) fan out concurrently, always admitted; box-lane stages (RED
  seal, crafter's GREEN pass, Vera's examine, commit-slice) stay strictly
  serialized to exactly ONE in-flight item -- a concurrent second entry is
  DEFERRED (BoxLaneEntryDeferred, naming the current occupant), never
  silently admitted or dropped. A stage failure is recorded loudly
  (PipelineStageFailed, non-empty reason) and, for a box-lane stage, frees
  the slot. A claim-drained action is refused
  (DrainClaimRejectedNoAttestation, D-8) unless the ledger already carries a
  PipelineStageCompleted record for the terminal commit-slice stage. State
  is replayed from the AT-completion ledger's own recorded content only.
module: des.cli.bugfix_pipeline_tick
entry_function: main
language_neutral_contract: true

log_events:
  - PipelineStageStarted
  - PipelineStageCompleted
  - PipelineStageFailed
  - BoxLaneEntryDeferred
  - DrainClaimRejectedNoAttestation

failure_modes:
  - error_class: UsageError
    exit_code: 2
    remediation: "Provide --feature-id, --project-root, --defect-id, --action and --now (plus --stage unless --action=claim-drained); see `des bugfix-pipeline-tick --help`."

idempotency: side-effects-explicit

host_visibility:
  - cli
