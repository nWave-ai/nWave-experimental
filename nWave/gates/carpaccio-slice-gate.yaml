# Gate-contract: carpaccio-slice-gate (D4 Phase 1 slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=carpaccio-slice-gate.

gate_id: carpaccio-slice-gate
responsibility: |
  ATDD-pure DELIVER entry gate: carpaccio decomposition + AT-review + slice ordering.
module: des.cli.carpaccio_slice_gate
entry_function: main
language_neutral_contract: true

cli_args:
  - name: --feature-id
    required: true
    type: string
    help: "Feature being dispatched."
  - name: --entering-slice
    required: true
    type: string
    help: "Slice id being entered (slice-NN)."
  - name: --repo-root
    required: false
    type: path
    help: "Repo root path."

log_events:
  - SliceCleared
  - CarpaccioGateCleared
  - CarpaccioGateRejected

failure_modes:
  - error_class: MalformedInput
    exit_code: 2
    remediation: "Repair cited input (table OR slice tag)"
  - error_class: CARPACCIO_SLICE_TOO_LARGE
    exit_code: 44
    remediation: "Re-slice to ≤ carpaccio_slice_max OR tag @coupled"
  - error_class: AT_REVIEW_NOT_APPROVED
    exit_code: 45
    remediation: "Run des record-at-review-verdict to record an APPROVED verdict for the entering slice."
  - error_class: SlicePlanSectionMissing
    exit_code: 1
    remediation: "Add `## Wave: DISCUSS / [REF] Slice Plan` section"
  - error_class: ATReviewGateRejected
    exit_code: 1
    remediation: "Record ATReviewVerdict via at_review_verdict CLI"

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
