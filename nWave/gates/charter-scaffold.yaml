# Gate-contract: charter-scaffold (charter-scaffold feature, direct-cutover
# vertical 2, GDP-1/5 producing-tool principle)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` # 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=charter-scaffold.
# Normative authority: docs/product/architecture/ADR-SSOT-002-canonical-
# delivery-model.md §4b (Resolve -> Author(Namespace)).

gate_id: charter-scaffold
responsibility: |
  The PRODUCING tool for expectation-charter scaffolds (GDP-5, system-pays;
  fires only on ADR §4b `Resolve(true, Missing | Empty) = Author(Namespace)`
  -- never at DELIVER-entry, never unconditionally). `--seed-mode` is
  required and closed to exactly three legal modes, each with its own
  required flag: `direct-value` (`--value`, the immutable value-side seed
  verbatim -- ordinary value-side authorship), `bug-observable`
  (`--observable`, what a user sees once the bug is fixed), and
  `brownfield-discovery` (`--area`, the existing system area retrofitted).
  There is no default mode and no fourth token; an omitted, unknown, or
  legacy (`slice-plan`) `--seed-mode` refuses LOUD before any file access.
  One invocation generates exactly one charter scaffold at
  `docs/product/expectations/<feature-id>/<intent-name>.md` using
  `nWave/templates/expectation-charter.md` as the skeleton, Intent
  pre-filled from the given seed VERBATIM -- uncontaminated by construction
  (it only ever sees the value-side seed for the selected mode, never
  design/impl vocabulary, and never a feature-delta file). Idempotent:
  never overwrites an existing charter. Degrades LOUD on a missing,
  unreadable, or ambiguous (checkout-vs-installed digest mismatch) charter
  template, or on invalid input for the selected mode -- a JSON
  verdict/detail naming every location tried, never a silent no-op nor a
  partial scaffold that looks complete. No Slice-Plan parser, no
  feature-delta dependency, no `des.cli.validate_feature_delta` reuse.
module: des.cli.charter_scaffold
entry_function: main
language_neutral_contract: true

log_events: []

failure_modes:
  - error_class: MissingOrInvalidSeedMode
    exit_code: 2
    remediation: "argparse itself refuses before any file access: an omitted or unrecognized --seed-mode prints usage plus an error to stderr and exits 2 -- no JSON verdict is emitted for this case. Pass exactly one required --seed-mode of direct-value, bug-observable, or brownfield-discovery -- slice-plan and any other token are refused."
  - error_class: MissingSeedModeInput
    exit_code: 1
    remediation: "The JSON verdict names the missing required flag for the selected --seed-mode (--value for direct-value, --observable for bug-observable, --area for brownfield-discovery); pass it verbatim."
  - error_class: MissingCharterTemplate
    exit_code: 1
    remediation: "The JSON verdict names 'missing-charter-template'; the detail names every location tried (module-relative and --repo-root-relative). Verify nWave/templates/expectation-charter.md exists and is readable at one of them."
  - error_class: AmbiguousCharterTemplate
    exit_code: 1
    remediation: "The JSON verdict names 'ambiguous-charter-template' when a developer checkout's own template disagrees (by content digest) with the shipped/installed copy; the detail names both paths. Reconcile the two copies -- never silently prefers either."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
