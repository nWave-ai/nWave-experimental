# Gate-contract: check-slice-at-completeness (D4 Phase 1 slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=check-slice-at-completeness.

gate_id: check-slice-at-completeness
responsibility: |
  Verify a slice's .feature ATs satisfy completeness invariants (W5 scope, tag coverage, scenario count).
module: des.cli.check_slice_at_completeness
entry_function: main
language_neutral_contract: true

log_events:
  - SliceAtCompletenessChecked

failure_modes:
  - error_class: MalformedInput
    exit_code: 2
    remediation: "Provide --feature-id + --slice-id"
  - error_class: AtSetIncomplete
    exit_code: 1
    remediation: "Author missing ATs per slice plan"

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
