# Gate-contract: classify-features (D4 Phase 1 slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=classify-features.

gate_id: classify-features
responsibility: |
  Classify each docs/feature/* directory by workflow mode (atdd_pure | classic | unknown).
module: des.cli.classify_features
entry_function: main
language_neutral_contract: true

cli_args:
  - name: --repo-root
    required: false
    type: path
    help: "Repo root containing docs/feature/."

log_events:
  - FeaturesClassified

failure_modes:
  - error_class: FeaturesDirNotFound
    exit_code: 1
    remediation: "Create docs/feature/ directory"

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
