# Gate-contract: dispatch (des-dispatch-ssot-renderer Fase-2, system-pays
# principle 2026-07-06)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` # 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=dispatch.

gate_id: dispatch
responsibility: |
  Generates a gate-valid atdd_pure dispatch prompt (des-dispatch-ssot-renderer
  Fase-2, the GENERATOR): renders the marker block (DES-VALIDATION,
  DES-PROJECT-ID, DES-MODE, DES-PHASE, DES-SLICE, DES-WAVE, optional
  DES-LANE / DES-LANE-JUSTIFICATION) plus the mandatory `# SECTION` headers
  directly from nWave/dispatch/atdd_pure.yaml + vendors.yaml +
  des.domain.lane_profile.LANE_PROFILES -- the SAME data the readiness gate
  and AtddPurePromptValidator consult -- so the produced prompt passes those
  gates BY CONSTRUCTION instead of a human hand-assembling it and being
  rejected one requirement at a time (empirically 8 rounds for FR-11's small
  fix). Read-only over its SSOT inputs; writes only stdout.
module: des.cli.dispatch
entry_function: main
language_neutral_contract: true

log_events: []

failure_modes:
  - error_class: UsageOrMalformed
    exit_code: 2
    remediation: "Argparse rejects a missing/unknown --mode, --project-id, --slice, --phase, or --lane by name via choices/required; an unreadable or malformed nWave/dispatch/atdd_pure.yaml is reported with the offending path -- pass --repo-root at a checkout that contains it. A bugfix-lane dispatch missing --defect or --regression-test is also rejected here."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
