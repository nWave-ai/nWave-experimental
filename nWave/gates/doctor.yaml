# Gate-contract: doctor (D4 Phase 1 slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=doctor.

gate_id: doctor
responsibility: |
  Operator-facing diagnostic command summarising install state, hook registration, ledger health.
module: des.cli.doctor
entry_function: main
language_neutral_contract: true

log_events:
  - DoctorReportEmitted

failure_modes:
  - error_class: InstallDegraded
    exit_code: 1
    remediation: "Run installer to refresh installed copy"

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
