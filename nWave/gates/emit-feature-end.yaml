# Gate-contract: emit-feature-end (D4 Phase 1 — control-plane SSOT mirror)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=emit-feature-end.

gate_id: emit-feature-end
responsibility: |
  Emit one feature-end completion-ledger record (EBatchRefactorCompleted or
  FeatureEndReviewVerdict bound to a signed verdict hash) to the tamper-evident
  AT-completion ledger, so an orchestrator-run feature-end leaves a verifiable
  trace. A FeatureEndReviewVerdict without its signed --verdict-hash is refused
  (anti-theater); --verdict-hash on EBatchRefactorCompleted is refused.
module: des.cli.emit_feature_end
entry_function: main
language_neutral_contract: true

log_events:
  - FeatureEndRecordEmitted
  - EmitRefused

failure_modes:
  - error_class: EmitRefused
    exit_code: 2
    remediation: "Supply a signed --verdict-hash for FeatureEndReviewVerdict, or omit --verdict-hash for EBatchRefactorCompleted."

idempotency: side-effects-explicit

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
