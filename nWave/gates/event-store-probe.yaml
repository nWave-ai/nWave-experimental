# Gate-contract: event-store-probe (unified-event-store slice-02, DD-14)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=event-store-probe.

gate_id: event-store-probe
responsibility: |
  Earned Trust startup probe (principle 13, DD-14) for the unified event store: exercises a canary write/flock/read/delete against --repo-root's telemetry substrate and refuses LOUD (never exit 0) when the substrate cannot honor its contract -- missing directory, permission-denied, not-a-directory, or ENOSPC.
module: des.cli.event_store_probe
entry_function: main
language_neutral_contract: true

log_events:
  - EventStoreProbeOk
  - EventStoreProbeRefused

failure_modes:
  - error_class: StoreProbeFailed
    exit_code: 1
    remediation: "Fix the telemetry substrate at the named path (create the directory / restore permissions / remove the non-directory file / free disk space) and re-run the probe."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
