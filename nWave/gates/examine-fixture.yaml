# Gate-contract: examine-fixture (examinable-gate-surface feature)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` # 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=examine-fixture.

gate_id: examine-fixture
responsibility: |
  Builds a real, drivable repository the certification gate
  (`des verify-slice-commit`) accepts on the clean case -- a genuinely
  shipped+attested fixture tree -- so the examine surface can be exercised
  end-to-end without hand-assembling repo state. Emits the built fixture's
  path; Python-only, no git hard-dep in the gate logic.
module: des.cli.examine_fixture
entry_function: main
language_neutral_contract: true

log_events:
  - ExamineFixtureBuilt

failure_modes:
  - error_class: UsageError
    exit_code: 2
    remediation: "Provide a writable --out directory; see `des examine-fixture --help`."

idempotency: side-effects-explicit

host_visibility:
  - cli
