# Gate-contract: feature-delta-doctor (feature-delta-doctor-and-ssot slice-01, WS-2 / M2)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` # 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=feature-delta-doctor.

gate_id: feature-delta-doctor
responsibility: |
  One-pass structural gap aggregator over a feature-delta.md (FR-11 root fix):
  reads a feature-delta.md ONCE and reports every structural gap in ONE JSON
  payload -- missing mandatory sections, malformed Wave headings, malformed or
  unjustified Reuse Analysis rows -- each gap self-explaining what/why/how
  (the STANDING every-failure-explains-what-why-how mandate). Composes the
  existing validate_feature_delta_content / locked_sections_present /
  validate_reuse_analysis_content validators verbatim; does not re-implement
  their classification logic. Filesystem-only (no git dependency); the
  content-grounding leg of Reuse Analysis validation (CodeFactPort citation
  resolution) is deliberately out of scope for this doctor's core.
module: des.cli.feature_delta_doctor
entry_function: main
language_neutral_contract: true

log_events: []

failure_modes:
  - error_class: UsageOrMalformed
    exit_code: 2
    remediation: "Verify the feature-delta path exists and is readable (unreadable/undecodable input exits 2, distinct from 0 zero-gaps and 1 gaps-found)."
  - error_class: GapsFound
    exit_code: 1
    remediation: "Fix each reported gap per its emitted how-to-fix, then re-run until gap_count is 0."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
