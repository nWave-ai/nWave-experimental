# Gate-contract: feature-open (feature-context-bootstrap feature)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` # 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=feature-open.

gate_id: feature-open
responsibility: |
  Create one evidence-aware initial feature context. Renders a bootstrap
  `feature-delta.md` from a declared feature-id and intent, refusing to
  overwrite an existing feature-delta for the same feature-id
  (feature-context-conflict). With `--adopt-wip`/`--adopt-root`, inventories
  an existing repository-relative WIP directory (path + sha256 + UNKNOWN test
  status per file) into the bootstrap record instead of starting empty.
  Emits a `FeatureContextReceipt` naming the written feature-delta and the
  canonical next step (`/nw-discuss`).
module: des.cli.feature_open
entry_function: main
language_neutral_contract: true

log_events:
  - FeatureContextReceipt
  - FeatureContextRefused

# Every entry below exit 1 reaches the operator as one `FeatureContextRefused`
# JSON line carrying `error` (the stable slug named here), `what`, `why` and
# `how` -- never as a Python traceback (GDP-3). The `how` re-invokes the
# producing tool rather than asking for a hand edit (GDP-4).
failure_modes:
  - error_class: UsageError
    exit_code: 2
    remediation: "Provide both --feature-id and --intent; see `des feature-open --help`."
  - error_class: IntentEmpty
    exit_code: 1
    remediation: "error=intent-empty -- rerun `des feature-open` with a non-empty --intent."
  - error_class: AdoptFlagsIncomplete
    exit_code: 1
    remediation: "error=adopt-flags-incomplete -- rerun `des feature-open` supplying --adopt-wip and --adopt-root together, or neither."
  - error_class: AdoptRootInvalid
    exit_code: 1
    remediation: "error=adopt-root-is-repo-root|adopt-root-outside-repo|adopt-root-not-a-directory -- rerun `des feature-open` with --adopt-root naming an existing subdirectory inside the repository."
  - error_class: FeatureContextConflict
    exit_code: 1
    remediation: "error=feature-context-conflict -- run `des next --feature-id <id>` for the lawful next step on the existing feature, or open a different --feature-id."

idempotency: side-effects-explicit

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
