# Gate-contract: find-similar-responsibility (codefact-similar-responsibility
# feature, slice-01, WS-9b reuse-first keystone; GDP-6 advisory/degrade-LOUD)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` # 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=find-similar-responsibility.

gate_id: find-similar-responsibility
responsibility: |
  The observable CLI over the ADDITIVE `query.similar-responsibility`
  CodeFactPort capability (AST tier, dispatched in AstAdapter.query mirroring
  the shipped `_step_shape_corpus` seam). Given a proposed NEW symbol --name
  and a --scope directory, shows the operator (and a crafter's Phase-A
  reuse-before-create check) the RANKED EXISTING module-level def/class symbols
  whose structural fingerprint (name-token Jaccard + parameter arity) overlaps
  the proposed name -- so a duplicate candidate {file,line,overlap} is SEEN
  before a parallel implementation is written. Advisory (GDP-6): ALWAYS exits 0
  -- it informs, it never blocks. Degrades LOUD (reason_code 'absent') on a
  nonexistent/empty/unparseable scope -- never a fabricated empty candidate list
  that would look identical to a genuine 'looked and found nothing' answer. Pure
  Python + AST only (no git, no Tsunami hard-dep).
module: des.cli.find_similar_responsibility
entry_function: main
language_neutral_contract: true

cli_args:
  - name: --name
    required: true
    type: string
    help: "The proposed new symbol's name to fingerprint against the scope."
  - name: --scope
    required: true
    type: path
    help: "Directory to search for existing module-level def/class symbols."
  - name: --format
    required: false
    type: string
    help: "Output format (only 'json' is supported)."

log_events: []

failure_modes:
  - error_class: ScopeCannotBeSearched
    exit_code: 0
    remediation: "Advisory command -- exits 0 even when the scope cannot be searched. The JSON payload's reason_code is 'absent' and 'detail' names the cause (nonexistent path / empty directory / nothing parseable); point --scope at a directory containing parseable Python to get ranked candidates."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
