# Gate-contract: flavor-scaffold (fix-flavor-scaffold-producing-tool slice-01,
# GDP-4/5 producing-tool principle)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` # 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=flavor-scaffold.

gate_id: flavor-scaffold
responsibility: |
  The PRODUCING tool for a new workflow-flavor 4-tuple (GDP-4/5, system-pays):
  emits a structurally-complete flavor YAML skeleton carrying the 9
  nWave/flavors/_schema.yaml required fields (flavor_id, display_name,
  description, default, selection, skill_load_set, descriptor,
  deliver_phase_shape, lifecycle_events), each declared exactly once with
  default:false -- so `mode-registry-completeness`'s HOW routes to a producing
  tool instead of a manual hand-assembled edit that the gate rejects one field
  at a time. Writes nWave/flavors/<id>.yaml (or stdout with --stdout);
  read-only over the schema SSOT.
module: des.cli.flavor_scaffold
entry_function: main
language_neutral_contract: true

cli_args:
  - name: --flavor-id
    required: true
    type: string
    help: "New flavor's id, e.g. `my_flavor` (pattern ^[a-z][a-z0-9_]*$)."
  - name: --display-name
    required: false
    type: string
    help: "Human-readable display name (default: titled from --flavor-id)."
  - name: --repo
    required: false
    type: path
    help: "Repo root to write nWave/flavors/<id>.yaml under (default: cwd)."
  - name: --stdout
    required: false
    type: bool
    help: "Print the scaffold to stdout instead of writing a file."

log_events: []

failure_modes:
  - error_class: UsageOrMalformed
    exit_code: 2
    remediation: "Argparse rejects a missing --flavor-id or a flavor-id not matching ^[a-z][a-z0-9_]*$ by name; an unwritable --repo target or an unreadable nWave/flavors/_schema.yaml is reported with the offending path -- pass --repo at a checkout that contains the flavors schema."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
