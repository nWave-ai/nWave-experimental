# Gate-contract: gate-design-at-coherence
# (f-coherence-and-attestation slice-06, JOB-028; RENAMED from gate-g by
#  f-code-design-manifest-and-gate-g slice-04 -- DDD-5, a GENERAL design↔AT
#  coherence gate after the slice-03 generalization. The module des.cli.gate_g
#  is unchanged.)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=gate-design-at-coherence.
#
# Source of truth for the contract: src/des/cli/gate_g.py (the thin CLI driver
# `main` over the existing `evaluate_gate_g`, slice-03). The driver re-implements
# no domain logic -- it parses the design-contract + AT-module paths, drives the
# unchanged mechanical diff, and prints the §17 GateVerdict.

gate_id: gate-design-at-coherence
responsibility: |
  Mechanical design↔AT coherence gate: diff the design `[REF] Code-Design`
  example-table (or a code-design.manifest.yaml's row-ids) against the AT
  module's scenarios and emit a §17 GateVerdict (ADR-GV-001, the five verdicts).
  A dropped row or a signature mismatch surfaces FAIL; an unconfirmable prose
  contract surfaces the North-Star cap LOUD as UNVERIFIED; an unsupported AT
  language degrades LOUD to INDETERMINATE. A PASS means "no objection found",
  never an authorizing GO (asymmetric authority, Invariant 1).
module: des.cli.gate_g
entry_function: main
language_neutral_contract: true

cli_args:
  - name: --design-contract
    required: true
    type: path
    help: "The feature-delta carrying the prose `[REF] Code-Design` example-table, or a code-design.manifest.yaml whose example-tables row-ids are the design side."
  - name: --at-module
    required: true
    type: path
    help: "The acceptance-test module directory (or file) whose Gherkin scenarios (and @row: tags) are diffed against the design side."

log_events: []

failure_modes:
  - error_class: UsageError
    exit_code: 2
    remediation: "Pass both --design-contract <path> and --at-module <path>; the gate has nothing to diff without them."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
