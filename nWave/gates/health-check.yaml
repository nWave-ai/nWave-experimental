# Gate-contract: health-check (D4 Phase 1 slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=health-check.

gate_id: health-check
responsibility: |
  Probe DES install health (config presence, hook registration, executable readiness).
module: des.cli.health_check
entry_function: main
language_neutral_contract: true

cli_args: []

log_events:
  - DesHealthCheckCompleted

failure_modes:
  - error_class: InstallDegraded
    exit_code: 1
    remediation: "Run pipenv run python3 scripts/install/install_nwave.py"

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
