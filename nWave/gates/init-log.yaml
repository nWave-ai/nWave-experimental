# Gate-contract: init-log (D4 Phase 1 slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=init-log.

gate_id: init-log
responsibility: |
  Initialize a per-feature execution-log skeleton at DELIVER start (classic-mode only).
module: des.cli.init_log
entry_function: main
language_neutral_contract: true

log_events:
  - ExecutionLogInitialized

failure_modes:
  - error_class: MalformedInput
    exit_code: 2
    remediation: "Provide --project-dir path"
  - error_class: AlreadyInitialized
    exit_code: 0
    remediation: "execution-log.json already exists; no-op"

idempotency: side-effects-explicit

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
