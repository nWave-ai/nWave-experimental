# Gate-contract: loop (D4 Phase 1 slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=loop.

gate_id: loop
responsibility: |
  Public `des loop` command over the canonical standing-loop facade -- idempotent
  tick control for a background consolidation/drain loop, realized as the
  subcommand set {probe, inspect, list, arm, tick, recover, stop}.
module: des.cli.loop
entry_function: main
language_neutral_contract: true

cli_args:
  - name: --project
    required: true
    type: path
    help: "Project root the loop operates on. Common to every subcommand."
  - name: --format
    required: false
    type: choice
    choices: ["human", "json"]
    default: human
    help: "Output rendering. Common to every subcommand."
  - name: --loop
    required: false
    type: string
    help: "inspect/arm: the loop identifier to target."
  - name: --handle
    required: false
    type: string
    help: "inspect/list/tick/recover/stop: the armed occurrence handle to target."
  - name: --apply
    required: false
    type: bool
    help: "recover: apply the recovered verdict instead of only reporting it."
  - name: --idempotency-key
    required: false
    type: string
    help: "arm/tick/stop: the idempotency key guarding a repeated invocation (required for arm/tick/stop, optional for recover)."
  - name: --context
    required: false
    type: choice
    choices: ["reconstructed", "native_chat"]
    help: "probe/arm: the context-continuity mode the loop tick runs under."
  - name: --continuity-proof
    required: false
    type: string
    help: "arm: proof binding this arm to a specific continuity context."
  - name: --max-tokens
    required: false
    type: int
    default: 1200
    help: "arm: per-tick token budget."
  - name: --max-wall-seconds
    required: false
    type: int
    default: 30
    help: "arm: per-tick wall-clock budget."
  - name: --max-replays
    required: false
    type: int
    default: 1
    help: "arm: maximum idempotent-replay count before refusal."
  - name: --cooldown-seconds
    required: false
    type: int
    default: 0
    help: "arm: minimum seconds between ticks."
  - name: --dry-run
    required: false
    type: bool
    help: "arm: validate the arm request without persisting it."

log_events:
  - LoopArmed
  - LoopTicked
  - LoopStopped
  - LoopRecovered

failure_modes:
  - error_class: IdempotencyConflict
    exit_code: 1
    remediation: "Reuse the same --idempotency-key for a retried tick, or arm a fresh occurrence."
  - error_class: LoopRefusal
    exit_code: 1
    remediation: "Read the refusal reason emitted on stdout/stderr; it names the failed precondition."

idempotency: side-effects-explicit

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
