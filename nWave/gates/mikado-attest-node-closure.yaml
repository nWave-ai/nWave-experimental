# Gate-contract: mikado-attest-node-closure (f-mikado-node-closure-record
# slice-01, ADR-D70 D70-3)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=mikado-attest-node-closure.

gate_id: mikado-attest-node-closure
responsibility: |
  Attests one Mikado node's state transition (`closed`|`work_started`) as a re-verifiable `LedgerFamily.MIKADO` record, invoked by whoever performs the node's closing (or work-started) act -- human or gate (ADR-D70 D70-3). Writes exactly one PRIMARY record via `EventStorePort.append` -- never `append_derived` (D70-2: this writer's population is 100% null-`agent_id` by construction, so DD-8's `ReductionKeyIneligible` would refuse every such call).

  Validates its own three required non-empty strings (`--attesting-act`, `--cited-sha`, `--cited-artifact-path`) and the closed `--transition` vocabulary BEFORE any store call, then wires and probes `UnifiedEventStoreAdapter` (Earned Trust, DD-14) before ever attempting `append()`. A store-side refusal the writer's own pre-check does not independently cover (`InvalidScope`/`PartitionKeyRequired`) is encapsulated in the writer's OWN WHAT/WHY/HOW envelope -- the store's own HOW names a D80-level remediation, never a re-runnable `des mikado-attest-node-closure` invocation, so the writer adds its own re-runnable HOW on top while preserving the original store exception text verbatim inside the envelope.

  Performs ZERO git verification, by design (D70-5): `--cited-sha`/`--cited-artifact-path` are never independently checked against `.git/` -- the record's own claim is a DESIGNATION, re-derived independently only at READ time by the slice-02 tree-coherence gate, never by this writer re-checking its own claim.
module: des.cli.mikado_node_closure_attest
entry_function: main
language_neutral_contract: true

log_events:
  - NodeClosureAttested
  - NodeWorkStartedAttested
  - MikadoNodeClosureAttestRefused
  - MikadoNodeClosureAttestProbeRefused
  - MikadoNodeClosureAttestRejected

failure_modes:
  - error_class: SystemExit
    exit_code: 2
    remediation: "Malformed invocation (a missing required flag, or --transition outside the closed {closed, work_started} vocabulary) -- argparse's own 'invalid choice'/'the following arguments are required' wording names the accepted set; re-run with every flag filled in and --transition one of closed|work_started."
  - error_class: MikadoNodeClosureAttestRefused
    exit_code: 1
    remediation: "One of --attesting-act/--cited-sha/--cited-artifact-path is empty or whitespace-only -- refused BEFORE any EventStorePort call, so nothing is written (a blank value would write a 'closed because I said so' record, ADR-D70 D70-3 exists to make structurally impossible). Re-run `des mikado-attest-node-closure ...` with every flag filled in, including a non-empty value for the named flag."
  - error_class: MikadoNodeClosureAttestProbeRefused
    exit_code: 1
    remediation: "UnifiedEventStoreAdapter.probe() failed before any append() was attempted (Earned Trust, DD-14) -- the writer's own WHAT/WHY/HOW envelope names the fault class (missing-directory/permission-denied/not-a-directory/enospc/other) and preserves the original StoreProbeFailed text verbatim; resolve the named substrate fault, then re-run `des mikado-attest-node-closure ...`."
  - error_class: MikadoNodeClosureAttestRejected
    exit_code: 1
    remediation: "The store itself refused the record (InvalidScope or PartitionKeyRequired) for a case the writer's own three-string pre-check does not cover, e.g. an empty --node-id -- the writer's own WHAT/WHY/HOW envelope preserves the original store exception text verbatim; nothing is written. Resolve the named fault (e.g. supply a non-empty --node-id), then re-run `des mikado-attest-node-closure ...`."

idempotency: side-effects-explicit
# Two identical invocations append TWO distinct records (each write is
# assigned its own monotonic seq, D70-3) -- never coalesced into one. This
# is deliberate: the writer performs zero deduplication and zero git
# verification (D70-5), so repeat-attestation is an observable, honest
# side effect, never silently absorbed.

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
