# Gate-contract: mode-registry-completeness (mode-registry-single-locus slice-05, Layer B)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=mode-registry-completeness.

gate_id: mode-registry-completeness
responsibility: |
  Refuse a half-declared mode: every flavor under nWave/flavors/ declares the
  schema-required 4-tuple fields, exactly one flavor declares default:true,
  every skill_load_set agent has a spec under nWave/agents/, and no conflicting
  selection — naming each completeness defect.
module: des.cli.mode_registry_completeness
entry_function: main
language_neutral_contract: true

cli_args:
  - name: --root
    required: false
    type: path
    help: "Root of the asset tree to check (default: this repository)."

log_events: []

failure_modes:
  - error_class: HalfDeclaredMode
    exit_code: 2
    remediation: "Complete the flavor 4-tuple, keep exactly one default:true, and ensure every skill_load_set agent exists."
  - error_class: FlavorsDirNotFound
    exit_code: 1
    remediation: "Provide a --root containing an nWave/flavors/ directory with flavor files."

idempotency: idempotent

host_visibility:
  - cli
  - git-hook
