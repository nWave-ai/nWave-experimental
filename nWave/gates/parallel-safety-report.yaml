# Gate-contract: parallel-safety-report (measured-parallel-safety-report, row 3)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=parallel-safety-report.

gate_id: parallel-safety-report
responsibility: |
  Advisory POST-HOC measured cross-check of a Slice/Feature Plan's declared-parallel
  claims: reuses des blast-radius per declared-parallel pair and reports MEASURED-SAFE
  (disjoint touched files/boundary-crossings/consumers), DRIFT (overlap, naming it), or
  UNMEASURED (blast-radius timeout, naming the file) -- never coerced to a false verdict,
  never a refusal (DF/D-2).
module: des.cli.parallel_safety_report
entry_function: main
language_neutral_contract: true

log_events:
  - ParallelSafetyReport
  - ParallelSafetyInputRejected

failure_modes:
  - error_class: ParallelSafetyInputRejected
    exit_code: 2
    remediation: "A --scope names a declared-serial or absent row, or the count is not exactly two for slice-01 -- correct the invocation; this is validation-time, before any measurement runs."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
