# Gate-contract: plan (D4 Phase 1 slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=plan.

gate_id: plan
responsibility: |
  Advisory ready-set and unused-parallelism report. Reads a validated feature's
  Slice Plan and an explicit set of already-complete slices; never launches
  work, changes a ledger, or authorizes a gate -- makes safe, declared
  parallelism visible before an operator falls back to a serial delivery path.
module: des.cli.delivery_plan
entry_function: main
language_neutral_contract: true

cli_args:
  - name: --feature-delta
    required: true
    type: path
    help: "Path to the feature-delta.md carrying the Slice Plan to project."
  - name: --completed
    required: false
    type: string
    help: "A slice already completed in the current immutable candidate. Repeatable."

log_events:
  - DeliveryPlan
  - DeliveryPlanRejected

failure_modes:
  - error_class: SlicePlanInvalid
    exit_code: 2
    remediation: "Supply a well-formed feature-delta whose Slice Plan passes validate_slice_plan_content."
  - error_class: UnknownCompletedId
    exit_code: 2
    remediation: "Only pass --completed ids that are declared in the feature's Slice Plan."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
