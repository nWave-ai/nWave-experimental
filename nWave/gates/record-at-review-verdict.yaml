# Gate-contract: record-at-review-verdict (oss-review-verdict-demotion S2, D-register)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=record-at-review-verdict.

gate_id: record-at-review-verdict
responsibility: |
  Record a keyless AT-review verdict (ADR-029 D5 producer half). On APPROVED
  appends one ATReviewVerdict record to the per-feature AT-completion ledger
  carrying the reviewer identity, the AT-set binding (at_ids derived from the
  entering slice's scenarios) and the content seal (at_content_hash, SHA-256
  over sorted scenario bodies). No hmac_sha256 field is written and no signing
  key is resolved -- key absence is a non-event (OSS demotion). On
  NEEDS_REVISION nothing is written; the slice loops back to the
  acceptance-designer. The carpaccio slice gate is the consumer that reads
  this record at the DELIVER entry gate.
module: des.cli.at_review_verdict
entry_function: main
language_neutral_contract: true

log_events: []

failure_modes:
  - error_class: MalformedArgs
    exit_code: 2
    remediation: "Pass --feature-id, --slice-id, --verdict (APPROVED|NEEDS_REVISION) and --reviewer-agent-id."

idempotency: side-effects-explicit

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
