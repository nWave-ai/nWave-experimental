# Gate-contract: record-prose-delivered (D4 Phase 1 — control-plane SSOT mirror)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=record-prose-delivered.

gate_id: record-prose-delivered
responsibility: |
  Record the completion of a PROSE slice -- one whose deliverable is documentation
  rather than code, and which therefore has no test suite to attest it. Without
  this producer a prose slice carries a Slice-Id commit but no SliceCommitVerified
  record, leaving feature integrity permanently unreconciled.
module: des.cli.record_prose_delivered
entry_function: main
language_neutral_contract: true

log_events:
  - SliceProseDelivered
  - MalformedInput

failure_modes:
  - error_class: MalformedInput
    exit_code: 2
    remediation: "Provide --feature-id, --slice-id, --reviewer-agent-id, --doc-review-ref and --verdict APPROVED; a verdict other than APPROVED is refused (anti-theater)."

idempotency: side-effects-explicit

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
