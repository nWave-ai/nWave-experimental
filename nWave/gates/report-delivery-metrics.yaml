# Gate-contract: report-delivery-metrics (declared-facts-reachable-recorded
# slice-07, DD-12)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` # 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=report-delivery-metrics.
#
# Backfilled by the arm-coherence catalog-coherence gate-arming pass
# (2026-07-29): this per-gate file did not exist since the row's own
# commit (df0b49b3a). log_events/failure_modes/idempotency below are
# derived from reading src/des/cli/report_delivery_metrics.py directly
# (it never calls a LogPersistencePort, and its only exit-1 path is a
# caught LedgerIntegrityViolation) -- host_visibility is NOT derivable
# from the module itself; it is set here by analogy to
# parallel-safety-report.yaml, the closest existing sibling (a pure-read
# advisory report gate with no git-hook surface), not measured.

gate_id: report-delivery-metrics
responsibility: |
  Read-only delivery-cost/time-to-green report over the audit log and
  AT-completion ledger, behind one CLI with two independent --metric
  queries: agent-usage-by-stage (deduped token totals per stage from the
  JSONL audit log) and time-to-green (RedObserved x SliceCommitVerified
  ledger records joined per slice_id into GREEN/IN_PROGRESS/UNATTRIBUTED
  states, never a bare duration). Both degrade LOUD to an explicit
  could-not-verify status on zero matching records, never a silent 0.
module: des.cli.report_delivery_metrics
entry_function: main
language_neutral_contract: true

log_events: []

failure_modes:
  - error_class: LedgerIntegrityViolation
    exit_code: 1
    remediation: "The AT-completion ledger is corrupt -- the verdict's 'detail' field names the corruption; repair or regenerate the ledger before re-querying time-to-green for this feature-id."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
