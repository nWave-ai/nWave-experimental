# Gate-contract: resolve-workflow-mode (D4 Phase 1 slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=resolve-workflow-mode.

gate_id: resolve-workflow-mode
responsibility: |
  Resolve the one active workflow mode without mutating the project. Classic is
  removed: historic requests are reported as migration-required and never reach
  a workload or a fallback dispatcher.
module: des.cli.resolve_workflow_mode
entry_function: main
language_neutral_contract: true

cli_args:
  - name: --project-dir
    required: true
    type: path
    help: "Project root to resolve the workflow mode against."
  - name: --operation
    required: true
    type: string
    help: "Operation to protect before execution."
  - name: --mode
    required: false
    type: string
    help: "Explicitly requested mode (only atdd_pure is selectable; anything else is migration-required)."
  - name: --dispatch-marker
    required: false
    type: string
    help: "Marker asserting the request originated from a real spine dispatch."
  - name: --stop-context-mode
    required: false
    type: string
    help: "Stop-hook context mode carried alongside the resolution request."
  - name: --require-dispatch-marker
    required: false
    type: bool
    help: "Reject the resolution unless --dispatch-marker is present."
  - name: --falsifier-state
    required: false
    type: string
    help: "Falsifier-gate state to fold into the resolution outcome."
  - name: --show-agent-guidance
    required: false
    type: bool
    help: "Print the migration-required agent guidance and exit 0 without resolving."
  - name: --candidate-wheel
    required: false
    type: path
    help: "A packaged candidate to scan for retired classic-workflow carriers before resolving."
  - name: --json
    required: false
    type: bool
    help: "Emit machine-readable JSON (the command's default output is already JSON on stdout)."

log_events: []

failure_modes:
  - error_class: CandidateIncompatible
    exit_code: 1
    remediation: "Rebuild the candidate wheel from the atdd_pure-only package; it carries a retired classic-workflow carrier."
  - error_class: ModeNotSelected
    exit_code: 1
    remediation: "Read the emitted diagnostic/reason_code; classic requests are migration-required, not a fallback path."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
