# Gate-contract: reverify-slice-commit (D4 Phase 1 slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=reverify-slice-commit.

gate_id: reverify-slice-commit
responsibility: |
  Re-verify an orphaned slice commit (E1 scoped-wrapper closing W5 cross-feature collision).
module: des.cli.reverify_slice_commit
entry_function: main
language_neutral_contract: true

log_events:
  - SliceCommitReverified

failure_modes:
  - error_class: MalformedInput
    exit_code: 2
    remediation: "--slice-id MUST match slice-NN(-letter)?"
  - error_class: OrphanRecoveryFailed
    exit_code: 1
    remediation: "Audit ledger for sibling SliceCommitVerified"

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
