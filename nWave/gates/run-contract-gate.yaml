# Gate-contract: run-contract-gate (D4 Phase 1 slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=run-contract-gate.

gate_id: run-contract-gate
responsibility: |
  Run the contract test suite + emit GateScopeVerified ledger record with digest.
module: des.cli.run_contract_gate
entry_function: main
language_neutral_contract: false

log_events:
  - GateScopeVerified
  - ContractGateCleared
  - ContractGateRejected

failure_modes:
  - error_class: ContractSuiteFailed
    exit_code: 1
    remediation: "Fix failing contract tests"
  - error_class: CollectionError
    exit_code: 2
    remediation: "Repair test collection errors"

idempotency: side-effects-explicit

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
