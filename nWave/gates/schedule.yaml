# Gate-contract: schedule (des-saturated-scheduler feature, slice-01)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` # 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=schedule.

gate_id: schedule
responsibility: |
  Read-only, plan-only "what can run now" query for --feature-id. Reads the
  declared Slice Plan (docs/feature/<id>/feature-delta.md) and the
  AT-completion ledger, then derives a deterministic artifact-level lane DAG:
  every unblocked lane READY, exactly one box lane admitted, and every
  blocked lane naming its missing artifact, awaited condition, and next
  action. Per DD-D2, a cross-slice declared-artifact dependency is keyed to
  the artifact actually attested in the ledger -- never to whether its
  producing slice finished as a whole. Never starts a process or agent
  (verified: `subprocess.Popen`/`subprocess.run`/`os.system` are unreachable
  from this code path); the ONE optional child-boundary is the caller's own
  `--consumer box-action` self-refusal, which itself performs no spawn.
module: des.cli.schedule
entry_function: schedule
language_neutral_contract: true

log_events:
  - SchedulePlanProduced
  - ScheduleInputRejected
  - ScheduleEvidenceIndeterminate
  - SchedulingConsumerRefused

failure_modes:
  - error_class: UsageError
    exit_code: 2
    remediation: "Provide a valid --feature-id; see `des schedule --help`."
  - error_class: ScheduleInputRejected
    exit_code: 2
    remediation: "Supply a readable docs/feature/<feature-id>/feature-delta.md declaring at least one Slice Plan row, then rerun des schedule."
  - error_class: ScheduleEvidenceIndeterminate
    exit_code: 3
    remediation: "Run `des verify-integrity <repo-root> --feature-id <feature-id>` to diagnose the unreadable AT-completion ledger, repair per docs/operations/repair-instructions.md, then rerun des schedule."
  - error_class: SchedulingConsumerRefused
    exit_code: 1
    remediation: "Submit the named generated dispatch prompt(s) for the READY cloud lane(s) through your own agent tooling, or explicitly defer, then rerun des schedule."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
