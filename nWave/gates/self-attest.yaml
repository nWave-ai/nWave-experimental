# Gate-contract: self-attest (f-coherence-and-attestation slice-06, JOB-028)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=self-attest.
#
# Source of truth for the contract: src/des/cli/self_attest.py (the thin CLI
# driver `main` over the pure-domain `des.domain.self_attest.classify`, slice-04).
# The driver re-implements no classification logic -- it reads the dual-source
# verdict record, delegates to the unchanged `classify`, and prints the §17 verdict.

gate_id: self-attest
responsibility: |
  Self-attest verdict classifier: read a dual-source verdict record (mechanical
  verdict, LLM-reviewer verdict, a reference to the mechanical evidence, a
  watchdog/timeout signal) and classify onto the §17 GateVerdict SSOT
  (ADR-GV-001, the five verdicts). A machine YES never authorizes: a bare-LLM
  say-so floors to UNVERIFIED, a divergence or a fired watchdog degrades LOUD to
  INDETERMINATE, only a mechanically-grounded agreement yields PASS -- and even
  that PASS means "no objection found", never an authorizing GO (Invariant 1).
module: des.cli.self_attest
entry_function: main
language_neutral_contract: true

log_events: []

failure_modes:
  - error_class: UsageError
    exit_code: 2
    remediation: "Pass --record <path> pointing at a JSON object carrying the four dual-source fields; the classifier has nothing to classify without it."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
