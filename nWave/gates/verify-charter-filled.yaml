# Gate-contract: verify-charter-filled (charter-scaffold feature, slice-02,
# the enforcement half of the slice-01 producing-tool vertical)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` # 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=verify-charter-filled.

gate_id: verify-charter-filled
responsibility: |
  The backstop gate that closes the loop slice-01 opened: slice-01
  (`des charter-scaffold`) PRODUCES a charter scaffold; this gate VERIFIES a
  charter is actually FILLED (not just scaffolded-and-forgotten) before an
  operator trusts it or lets it arm a downstream EXAMINE. A charter is FILLED
  iff every judgment section the scaffold left as a TODO placeholder has been
  replaced by real content: (a) the oracle section ("## Expected observations
  (oracle)") is non-empty AND carries >=1 negative observation line, (b) the
  start-recipe section ("## Preconditions") is non-empty, (c) no residual
  scaffold `<...>` placeholder markers remain in either judgment section.
  Emits PASS (filled), FAIL (present-but-hollow -- naming EACH still-TODO
  section + HOW to fix it), INDETERMINATE (unreadable/malformed path --
  missing file, empty file, directory -- LOUD what/why/how, never a false
  PASS). GDP-1 (fires early, at charter-author time). Pure Python +
  filesystem only -- no git.
module: des.cli.verify_charter_filled
entry_function: main
language_neutral_contract: true

log_events: []

failure_modes:
  - error_class: CharterHollow
    exit_code: 1
    remediation: "The JSON verdict is 'FAIL'; 'missing_sections' names EACH still-incomplete section (oracle / start-recipe) with the concrete fix -- fill the Preconditions section with the real start recipe and/or add >=1 'Negative: ...' line to the oracle."
  - error_class: CharterUnreadable
    exit_code: 1
    remediation: "The JSON verdict is 'INDETERMINATE'; 'detail' names the unreadable condition (missing file / empty file / directory path) -- verify --charter points at an existing, non-empty charter file."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
