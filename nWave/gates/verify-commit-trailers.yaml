# Gate-contract: verify-commit-trailers (D4 Phase 1 slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=verify-commit-trailers.

gate_id: verify-commit-trailers
responsibility: |
  AT-completion-ledger audit window. Resolves the commit's Slice-Id trailer(s)
  via des.domain.slice_id_trailer.extract_slice_ids, then for each slice audits
  the AT-review ledger record reusing the carpaccio gate's check_at_review logic
  (one check, one home). Pure-read: no file is written.
module: des.cli.verify_commit_trailers
entry_function: main
language_neutral_contract: true

cli_args:
  - name: --commit
    required: false
    type: string
    default: HEAD
    help: "Target commit SHA or ref (default: HEAD)."

log_events:
  - SliceAuditCleared

failure_modes:
  - error_class: CannotEvaluate
    exit_code: 7
    remediation: "git absent, SHA unresolvable, or no Slice-Id trailer found -- nothing to audit."
  - error_class: ATReviewNotApproved
    exit_code: 45
    remediation: "The slice's AT-review ledger record is absent, not-approved, or stale. Run des record-at-review-verdict."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
  - git-hook
