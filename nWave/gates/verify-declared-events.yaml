# Gate-contract: verify-declared-events (declared-vs-emitted defect class)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=verify-declared-events.

gate_id: verify-declared-events
responsibility: |
  Shipped prose (a skill, an agent spec, a command definition, CLAUDE.md, or a
  permanent ADR) sometimes names an event/ledger record as if the system
  produces it -- present tense, no caveat -- when no code path writes it. This
  gate mechanically extracts every event/record name src/des actually emits
  (a producer registry, two tiers: STRICT durable-ledger writes, BROAD any
  real code-emitted string) and every event/record name shipped prose claims
  is produced (a backtick-quoted PascalCase name from this codebase's own
  event-suffix vocabulary, inside a window that also carries a
  production-claiming trigger word), then diffs them. A claim that also
  invokes "ledger" (a durability claim) must clear the STRICT tier; any other
  claim only needs the BROAD tier. A claim whose own text already discloses
  it is aspirational ("not yet built", "DESIGNED-NOT-BUILT", ...) is
  self-exempt. A residual mismatch that is a mechanical false positive (e.g.
  a shared TYPE name discussed in an architecture paragraph, never a literal
  event string) is registered in
  `nWave/data/declared-event-exemptions.json` with a reviewable reason.
module: des.cli.verify_declared_events
entry_function: main
language_neutral_contract: true

log_events: []

failure_modes:
  - error_class: UndeclaredEventClaim
    exit_code: 1
    remediation: "Build the missing producer and wire it to a real ledger/audit write, correct the prose to the real event name, add an explicit not-yet-built caveat, or register a reviewed exemption in nWave/data/declared-event-exemptions.json."
  - error_class: DeclaredEventsInputUnavailable
    exit_code: 4
    remediation: "Point --repo-root at a real nWave-dev checkout (it must hold src/des/**/*.py and at least one of the shipped prose roots)."
  - error_class: MalformedArgs
    exit_code: 2
    remediation: "Pass a valid --repo-root path."

idempotency: idempotent

host_visibility:
  - cli
