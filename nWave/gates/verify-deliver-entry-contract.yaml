# Gate-contract: verify-deliver-entry-contract (f-deliver-entry-contract-freeze slice-01)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=verify-deliver-entry-contract.
# Companion ADR: ADR-FLOW-004 (DELIVER-entry contract freeze; ADR-GV-001 no sixth verdict).
#
# Source of truth for the contract: src/des/cli/verify_deliver_entry_contract.py
# (the thin CLI driver `main` over the pure `evaluate_contract_freeze`). The driver
# parses --feature-id/--repo-root/--format, drives the structural-completeness check,
# writes ContractFrozen on PASS, and prints the §17 GateVerdict on JSON-stdout.

gate_id: verify-deliver-entry-contract
responsibility: |
  DELIVER-entry contract-freeze gate (ADR-FLOW-004, DDD-1). At the first DELIVER
  gate-IN, assert the contract is STRUCTURALLY complete: the locked [REF] sections
  are present (Architecture & Contract Tests / ADR Refs / Reuse Analysis / Slice
  Plan), the wave headings + 5-column Slice Plan validate, and every planned
  Slice-Plan row has an authored AT module (@feature-{id} + @slice-NN). On PASS,
  write ONE ContractFrozen ledger record -- the frozen baseline per-slice gate-INs
  re-verify against (feature-level granularity, ADR-FLOW-002 D8). Composes the
  EXISTING validate_feature_delta checks (in-process) + the NEW locked-section-
  presence check + the feature_tag_files Slice-Id->AT resolution. Emits a §17
  GateVerdict (ADR-GV-001 -- the five existing verdicts, no sixth, no engine):
  PASS (+ ContractFrozen) on a structurally-complete contract, FAIL naming the
  offender on a missing locked section / a planned-slice-with-no-AT-module, and
  INDETERMINATE (degrade-LOUD, Invariant 2) when the feature-delta is unreadable --
  never a false freeze. Target-machine agnostic: Python + filesystem only, NO git,
  NO grep binary, NO import yaml. Structural completeness != semantic completeness
  (the human-GO boundary is flagged LOUD).
module: des.cli.verify_deliver_entry_contract
entry_function: main
language_neutral_contract: true

log_events:
  - ContractFrozen

failure_modes:
  - error_class: UsageError
    exit_code: 2
    remediation: "Pass --feature-id <id> and --repo-root <path>; the gate has nothing to check without them."
  - error_class: ContractIncomplete
    exit_code: 1
    remediation: "Repair the named offender: add the missing locked [REF] section, fix the malformed Slice Plan, or author the AT module for the planned slice (a .feature carrying @feature-<id> + @slice-NN)."
  - error_class: ContractUnreadable
    exit_code: 4
    remediation: "The feature-delta is absent / undecodable -- the gate degrades LOUD to INDETERMINATE. Author or repair docs/feature/<id>/feature-delta.md so the gate can read the contract."

idempotency: side-effects-explicit

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
