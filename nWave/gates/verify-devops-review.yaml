# Gate-contract: verify-devops-review (f-design-devops-review-gate slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=verify-devops-review.

gate_id: verify-devops-review
responsibility: |
  DEVOPS platform-architect-review CONSUMER veto gate (the consumer half of the
  per-wave review-verdict gate carried to DEVOPS from the DESIGN parity). Wired
  into the DEVOPS gate-out stack (nWave/waves/devops.yaml) so a DEVOPS return is
  refused unless an artefact-current approved verdict exists. A THIN wrapper over
  the wave-parametric ReviewVerdictGate.evaluate core (the SSOT-reuse proof: a
  SECOND wave with zero new verdict logic): reads the latest DevopsReviewVerdict
  ledger record, seals the feature-delta content (SHA-256 over the artefact
  bytes), and projects the verdict (PASS / VETOED / INDETERMINATE) onto an exit
  code plus a JSON-stdout recovery. Asymmetric authority (§22.0): a
  NEEDS_REVISION is a mechanically-honored VETO; an artefact-current APPROVED is
  "no objection found" (PASS), never an authorizing GO; absent / stale /
  schema-unknown -> INDETERMINATE degrade-LOUD (§17), never a silent pass.
module: des.cli.verify_devops_review
entry_function: main
language_neutral_contract: true

cli_args:
  - name: --feature-id
    required: true
    type: string
    help: "Feature identifier; resolves the feature-delta artefact and the per-feature ledger."
  - name: --repo-root
    required: false
    type: path
    help: "Repository root override; defaults to the resolved current repo root."

log_events: []

failure_modes:
  - error_class: MalformedArgs
    exit_code: 2
    remediation: "Pass --feature-id."
  - error_class: DevopsReviewVetoed
    exit_code: 1
    remediation: "The platform-architect-review returned NEEDS_REVISION -- address the reviewer findings in docs/feature/{feature-id}/feature-delta.md, then record a fresh APPROVED verdict whose artefact hash matches the updated feature-delta before retrying the return."
  - error_class: DevopsReviewIndeterminate
    exit_code: 1
    remediation: "No artefact-current APPROVED verdict exists (absent / stale / unknown schema, or the feature-delta is unreadable) -- record a current APPROVED platform-architect-review verdict via `des record-devops-review` whose hash matches the feature-delta, then retry."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
