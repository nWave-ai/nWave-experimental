# Gate-contract: verify-dispatch-ref-coherence (f-dispatch-template-ssot-reconciliation slice-04)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=verify-dispatch-ref-coherence.
#
# ADDITIVE (slice-04 scope): this gate is NOT yet wired against the real
# `nWave/skills/nw-execute/SKILL.md`, and is NOT part of any always-on gate
# stack. It reuses the concept (pointer + registry + no-inline-restatement,
# git-free) of `verify-wave-contract-coherence` -- not its list-diff algorithm
# (design Decision 5): the dispatch registry declares `{mode, lane}` names,
# not an enumerable gate-stack list to diff prose against.
#
# Source of truth for the contract: src/des/cli/verify_dispatch_ref_coherence.py
# (the thin CLI driver `main` over the pure `evaluate_dispatch_ref_coherence`).
# The driver parses --skill/--dispatch-yaml, drives the git-free coherence
# check, and prints the §17 GateVerdict on JSON-stdout.

gate_id: verify-dispatch-ref-coherence
responsibility: |
  Git-free dispatch-ref coherence gate. Verify a skill's prose carries a valid
  `dispatch-ref: mode=<mode> lane=<lane>` pointer -- `mode` resolving against
  the dispatch registry's top-level `mode:` key, `lane` against a
  `profiles.lane.<lane>:` entry in the same registry
  (`nWave/dispatch/atdd_pure.yaml` by default) -- and restates no dispatch
  section body inline (>=2 CONSECUTIVE canonical section-id bullet items,
  reused concept from `verify-wave-contract-coherence` Shape 3). A single
  passing section-id mention is explicitly NOT a restatement. Emits a §17
  GateVerdict (ADR-GV-001 -- the five existing verdicts, no sixth, no engine):
  PASS on a valid pointer + zero restatement, FAIL naming the offender on a
  missing pointer / unresolvable mode / unresolvable lane / inline
  restatement, and INDETERMINATE (degrade-LOUD, Invariant 2) when the target
  skill file or the registry is unreadable -- never a silent pass.
  Target-machine agnostic: stdlib `re` + a narrow line-oriented YAML scan, NO
  git, NO `grep` binary, NO AST, NO `import yaml`.
module: des.cli.verify_dispatch_ref_coherence
entry_function: main
language_neutral_contract: true

log_events: []

failure_modes:
  - error_class: UsageError
    exit_code: 2
    remediation: "Pass --skill <path> (and optionally --dispatch-yaml <path>); the gate has nothing to check without a skill file."
  - error_class: CoherenceFailed
    exit_code: 1
    remediation: "Run `des dispatch` to regenerate a dispatch-ref pointer naming a real mode/lane, or replace an inline section-id enumeration with the pointer."
  - error_class: TargetUnreadable
    exit_code: 4
    remediation: "The skill file or the dispatch registry is absent / undecodable -- the gate degrades LOUD to INDETERMINATE. Author or repair the named path so the gate can resolve the pointer."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
