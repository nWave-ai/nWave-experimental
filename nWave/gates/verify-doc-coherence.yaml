# Gate-contract: verify-doc-coherence (evolution-plan P0.5 — doc<->code coherence)
#
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=verify-doc-coherence.

gate_id: verify-doc-coherence
responsibility: |
  Check doc claims (npm scripts, repo file paths, python -m modules)
  against the actual tree: shipped docs claiming absent artifacts are
  refused with line + why + how -- docs cannot overstate the code
  (evolution P0.5).
module: des.cli.verify_doc_coherence
entry_function: main
language_neutral_contract: true

log_events:
  - DocCoherenceVerified
  - DocCoherenceRefused
  - DocCoherenceIndeterminate
  - DocCoherenceDocSkipped
  - DocCoherenceArmSkipped

failure_modes:
  - error_class: DocCoherenceRefused
    exit_code: 1
    remediation: "A doc claims an absent script/file/module; fix the doc (or ship the artifact) at the named line."
  - error_class: DocCoherenceIndeterminate
    exit_code: 2
    remediation: "--repo is not a directory / no docs readable; pass --repo pointing at the project root."

idempotency: idempotent

host_visibility:
  - cli
