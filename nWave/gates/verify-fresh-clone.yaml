# Gate-contract: verify-fresh-clone (evolution-plan P0.1 — evidence-by-execution)
#
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=verify-fresh-clone.

gate_id: verify-fresh-clone
responsibility: |
  Execute the project's declared demo recipe in a fresh export of the
  COMMITTED tree, so "works only on my machine / broken on fresh clone"
  cannot reach done (evidence-by-execution gate, evolution P0.1).
module: des.cli.verify_fresh_clone
entry_function: main
language_neutral_contract: true

log_events:
  - FreshCloneVerified
  - FreshCloneRefused
  - FreshCloneIndeterminate
  - FreshCloneStepStarted
  - FreshCloneStepPassed

failure_modes:
  - error_class: FreshCloneRefused
    exit_code: 1
    remediation: "A declared demo-recipe step FAILED in the fresh export; fix the committed tree (or the recipe) until every step passes on a fresh clone."
  - error_class: FreshCloneIndeterminate
    exit_code: 2
    remediation: "No recipe declared / tree not exportable; declare the demo recipe and run from a git work-tree."

idempotency: side-effects-explicit

host_visibility:
  - cli
