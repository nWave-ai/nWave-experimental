# Gate-contract: verify-integrity (D4 Phase 1 slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=verify-integrity.

gate_id: verify-integrity
responsibility: |
  Verify the deliver execution-log records all required phase events for the feature.
module: des.cli.verify_deliver_integrity
entry_function: main
language_neutral_contract: true

cli_args:
  - name: --project-dir
    required: true
    type: path
    help: "Deliver project to verify."
  - name: --mode
    required: false
    type: choice
    help: "classic | atdd_pure (auto-detected if omitted)."

log_events:
  - DeliverIntegrityVerified
  - FeatureEndCheckpoint

failure_modes:
  - error_class: MalformedInput
    exit_code: 2
    remediation: "Provide --project-dir + valid mode"
  - error_class: MissingRequiredRecord
    exit_code: 1
    remediation: "Check required-feature-end frozenset coverage"

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
