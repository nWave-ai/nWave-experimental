# Gate-contract: verify-negative-at (evolution-plan P0.3 — negative-AT mandate)
#
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=verify-negative-at.

gate_id: verify-negative-at
responsibility: |
  Verify every CRITICAL test scope carries >=1 negative AT -- an assertion
  that the WRONG output is NOT produced (evolution P0.3). Static analysis
  only (pytest + Gherkin arms); honest N/A on non-critical scopes.
module: des.cli.verify_negative_at
entry_function: main
language_neutral_contract: true

cli_args:
  - name: --test-file
    required: false
    type: path
    help: "Test file to analyze (.py or .feature); repeatable."
  - name: --test-dir
    required: false
    type: path
    help: "Directory to scan for test_*.py / *_test.py / *.feature files."
  - name: --repo
    required: false
    type: path
    help: "Path to the repository root."
    default: "."
  - name: --all-critical
    required: false
    type: bool
    help: "Treat every scanned file as a critical scope (the caller decides criticality; the gate never fabricates it)."
    default: false

log_events:
  - NegativeAtVerified
  - NegativeAtRefused
  - NegativeAtNotApplicable
  - NegativeAtIndeterminate

failure_modes:
  - error_class: NegativeAtRefused
    exit_code: 1
    remediation: "A critical scope carries no negative AT; add an executed wrong-output-NOT-produced assertion (pytest: @pytest.mark.negative_at or _not_/_never_/_rejects_ naming; Gherkin: @negative tag) to the named scope."
  - error_class: NegativeAtIndeterminate
    exit_code: 2
    remediation: "No input given / file unreadable; pass at least one --test-file or a --test-dir."

idempotency: idempotent

host_visibility:
  - cli
