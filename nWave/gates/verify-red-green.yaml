# Gate-contract: verify-red-green (evolution-plan P0.2 — RED->GREEN non-vacuity seal)
#
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=verify-red-green.

gate_id: verify-red-green
responsibility: |
  Seal the RED->GREEN transition of an AT file as mechanical non-vacuity
  evidence: --record-red captures the failing witness, --verify-green seals
  only a genuinely red-then-green untampered AT (runner-agnostic JUnit-XML
  outcome contract via a declared --run-cmd; evolution P0.2).
module: des.cli.verify_red_green
entry_function: main
language_neutral_contract: true

cli_args:
  - name: --repo
    required: false
    type: path
    help: "Repository root."
    default: "."
  - name: --test-file
    required: true
    type: path
    help: "The AT file (repo-relative or absolute)."
  - name: --record-red
    required: false
    type: bool
    help: "Record the RED witness (mutually exclusive with --verify-green; one is required)."
    default: false
  - name: --verify-green
    required: false
    type: bool
    help: "Verify GREEN against the recorded RED seal (mutually exclusive with --record-red; one is required)."
    default: false
  - name: --run-cmd
    required: false
    type: string
    help: "Declared runner command with {test_file} and {junit_out} placeholders (default: pytest --junitxml form)."

log_events:
  - RedObserved
  - RedGreenSealed
  - RedGreenRefused
  - RedGreenIndeterminate

failure_modes:
  - error_class: RedGreenRefused
    exit_code: 1
    remediation: "The AT is vacuous (never red), BROKEN (collection error, not RED), tampered after RED, or still failing at verify-green; fix the AT/implementation and re-run the record-red -> verify-green pair."
  - error_class: RedGreenIndeterminate
    exit_code: 2
    remediation: "Test file not found / no RED seal recorded; check the path and run --record-red before --verify-green."

idempotency: side-effects-explicit

host_visibility:
  - cli
