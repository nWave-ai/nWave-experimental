# Gate-contract: verify-scheduling-coherence (des-saturated-scheduler feature, slice-01)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` # 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=verify-scheduling-coherence.

gate_id: verify-scheduling-coherence
responsibility: |
  Read-only verification that every declared SchedulingPolicy projection
  (cli_help, session_start, skills, runtime, gate_message, command_catalog)
  agrees with the current policy digest -- one typed policy is the sole
  normative scheduling source (DD-D5/DD-D6). Reports `PASS` with the checked
  projection names and digest, or the exact stale target plus the
  regeneration command. Writes nothing.
module: des.cli.schedule
entry_function: verify_scheduling_coherence
language_neutral_contract: true

log_events:
  - SchedulingCoherenceVerified

failure_modes:
  - error_class: UsageError
    exit_code: 2
    remediation: "Provide valid arguments; see `des verify-scheduling-coherence --help`."
  - error_class: SchedulingCoherenceDrifted
    exit_code: 1
    remediation: "Regenerate the stale projection named in the verdict (e.g. `python scripts/docgen.py --projection scheduling-policy`), then rerun des verify-scheduling-coherence."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
