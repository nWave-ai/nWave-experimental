# Gate-contract: verify-slice-commit (D4 Phase 1 slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=verify-slice-commit.

gate_id: verify-slice-commit
responsibility: |
  Verify a slice commit carries the slice's .feature AT files and emit SliceCommitVerified ledger record.
module: des.cli.verify_slice_commit_completeness
entry_function: main
language_neutral_contract: true

log_events:
  - SliceCommitVerified

failure_modes:
  - error_class: MalformedInput
    exit_code: 2
    remediation: "Provide --repo + --commit, commit MUST have Slice-Id"
  - error_class: CommitHeadRaced
    exit_code: 1
    remediation: "Re-launch with current HEAD pin"

idempotency: side-effects-explicit

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
