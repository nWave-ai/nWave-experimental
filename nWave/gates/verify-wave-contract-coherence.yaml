# Gate-contract: verify-wave-contract-coherence (f-wave-contract-coherence slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=verify-wave-contract-coherence.
# Companion ADR: ADR-FLOW-006 (D7 the coherence-check, D9 no sixth verdict / no engine).
#
# Source of truth for the contract: src/des/cli/verify_wave_contract_coherence.py
# (the thin CLI driver `main` over the pure `evaluate_coherence`). The driver
# parses --wave/--prose/--waves-dir, drives the git-free coherence check, and
# prints the §17 GateVerdict on JSON-stdout.

gate_id: verify-wave-contract-coherence
responsibility: |
  Git-free wave-contract coherence gate (ADR-FLOW-006 D7). Verify a wave's
  command/skill prose carries valid `gates-ref` + `outputs-ref` pointers,
  restates no bare catalog gate_id inline (the duplication drift surface cure-I
  strips), the referenced wave resolves in BOTH SSOTs (`gate_stack` AND
  `output_contract`), and every registry gate_id resolves to the catalog. Emits a
  §17 GateVerdict (ADR-GV-001 -- the five existing verdicts, no sixth, no engine):
  PASS on valid pointers + zero restatement, FAIL naming the offender on a missing
  pointer / inline restatement / incomplete registry / orphan gate_id, and
  INDETERMINATE (degrade-LOUD, Invariant 2) when the registry it must read is
  unreadable -- never a silent green. Target-machine agnostic: stdlib `re` + a
  narrow line-oriented YAML scan, NO git, NO `grep` binary, NO AST, NO `import yaml`.
module: des.cli.verify_wave_contract_coherence
entry_function: main
language_neutral_contract: true

log_events: []

failure_modes:
  - error_class: UsageError
    exit_code: 2
    remediation: "Pass --wave <id>, --prose <path>, and --waves-dir <dir>; the gate has nothing to check without them."
  - error_class: CoherenceFailed
    exit_code: 1
    remediation: "Repair the named offender: add the missing gates-ref/outputs-ref pointer, strip the inline catalog gate_id restatement, complete the registry's missing SSOT, or resolve the orphan gate_id against the catalog."
  - error_class: RegistryUnreadable
    exit_code: 4
    remediation: "The referenced wave's registry file is absent / undecodable -- the gate degrades LOUD to INDETERMINATE. Author or repair <waves-dir>/<wave>.yaml so the gate can resolve the pointer."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
