# Gate-contract: verify-wave-dispatch (f-nonbypassable-attestation slice-05, DDD-8/9)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=verify-wave-dispatch.
#
# Source of truth for the contract: src/des/cli/verify_wave_dispatch.py (the thin
# CLI driver `main` over the pure-domain `des.domain.wave_dispatch_guard_policy`).
# Composed onto dispatch.pre (atdd_pure.yaml) -- the guard FIRES on every
# Agent/Task dispatch the PreToolUse intercept sees (catalogato != cablato closed),
# NOT a prose-invoked CLI an orchestrator can silently skip. Fail-open at the
# wiring: only exit 1 blocks; ALLOW/malformed/timeout/module-absent -> allow.

gate_id: verify-wave-dispatch
responsibility: |
  Wave-dispatch guard: verify an Agent/Task dispatch enters its wave on-spine
  before it fires. A wave-OWNER agent dispatched WITHOUT a matching DES-WAVE
  marker is BLOCKED unless a form-valid skip witness or a fresh session pre-grant
  concedes it; reviewers / exempt agents ALLOW. Closes the wave-level silent-entry
  hole -- the exemption that let DISCUSS/DESIGN/DEVOPS/DISTILL be entered
  off-spine -- mirroring verify-readiness-pre-dispatch over the pure policy.
module: des.cli.verify_wave_dispatch
entry_function: main
language_neutral_contract: true

log_events:
  - WaveDispatchAllowed
  - WaveDispatchBlocked

failure_modes:
  - error_class: WaveOwnerDispatchedOffSpine
    exit_code: 1
    remediation: "Dispatch the wave-owner with a matching `<!-- DES-WAVE: <wave> -->` marker, OR record a human-authorized skip witness / session pre-grant; reviewers are exempt."
  - error_class: UsageError
    exit_code: 2
    remediation: "Pass --subagent-type <agent>; the guard has nothing to evaluate without the dispatched agent identity."

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
