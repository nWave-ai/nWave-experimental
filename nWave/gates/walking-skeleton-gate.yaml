# Gate-contract: walking-skeleton-gate (D4 Phase 1 slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` § 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=walking-skeleton-gate.

gate_id: walking-skeleton-gate
responsibility: |
  Verify a walking-skeleton AT exercises an installed-layout subprocess (RCA G1 closure).
module: des.cli.walking_skeleton_gate
entry_function: main
language_neutral_contract: true

cli_args:
  - name: --feature-dir
    required: true
    type: path
    help: "Feature dir containing walking-skeleton test."
  - name: --installed-tree
    required: true
    type: path
    help: "Installed layout to verify against."

log_events:
  - WalkingSkeletonGateRan

failure_modes:
  - error_class: MalformedInput
    exit_code: 2
    remediation: "Provide --feature-dir + --installed-tree"
  - error_class: WalkingSkeletonMissing
    exit_code: 1
    remediation: "Author @walking_skeleton AT"

idempotency: idempotent

host_visibility:
  - claude-code
  - codex
  - opencode
  - cli
