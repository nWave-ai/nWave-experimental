# Gate-contract: work-exhausted-tick (autonomous-consolidation-and-bugfix-loops
# feature, slice-02)
#
# Per `docs/analysis/d4-schema-spec-2026-05-26.md` # 3.1 GateContractFull.
# Schema: `nWave/gates/_schema.yaml#/$defs/GateContractFull`.
# Catalog entry: `nWave/gates/_catalog.yaml` gate_id=work-exhausted-tick.

gate_id: work-exhausted-tick
responsibility: |
  Evaluate one background loop tick's safe-work-tier exhaustion state against
  the ratified 20/30/45-minute wall-clock escalation ladder (D-2): FIRST
  WARNING by 20 minutes, SECOND WARNING by 30, STOP/ESCALATE by 45 -- anchored
  to minutes-since-first-detected-exhausted, never to a tick count, so the
  ceiling holds regardless of loop cadence. Appends each newly-crossed rung to
  the AT-completion ledger; a window already carrying STOP/ESCALATE is
  terminal (no quiet un-stop) until a fresh `has-unblocked-item` tick resolves
  it. State is replayed from the ledger's own recorded content only.
module: des.cli.work_exhausted_tick
entry_function: main
language_neutral_contract: true

log_events:
  - WorkExhaustedWindowOpened
  - WorkExhaustedFirstWarning
  - WorkExhaustedSecondWarning
  - WorkExhaustedStopEscalate
  - WorkExhaustedWindowResolved

failure_modes:
  - error_class: UsageError
    exit_code: 2
    remediation: "Provide --feature-id, --project-root, --queue-state and --now; see `des work-exhausted-tick --help`."

idempotency: side-effects-explicit

host_visibility:
  - cli
