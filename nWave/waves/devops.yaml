# DEVOPS wave-contract — canonical, flavor-independent registry entry.
#
# f-design-devops-review-gate slice-02 (the SSOT-reuse proof). Carries the DEVOPS
# review-verdict gate to parity with DESIGN + DISCUSS: the gate-out stack runs
# verify-devops-review so a DEVOPS return is mechanically gated by an
# artefact-current platform-architect-reviewer verdict (brief §6 / §7 surface 1).
# The SAME generic ReviewVerdictGate core serves this SECOND wave with ZERO new
# verdict logic -- only the wave name changes.
#
# Per ADR-FLOW-006 (D1 the registry, D2 the gate_stack shape, D6 the registry is
# the SOLE gate-stack source). One file per wave carries the two symmetric SSOTs
# the wave prose points at instead of restating:
#
#   gate_stack      (SSOT-A) — the gate-in / gate-out ordered stacks. The DEVOPS
#                   gate-out runs the review-verdict CONSUMER veto.
#   output_contract (SSOT-B) — what the DEVOPS wave must produce (the [REF]
#                   section list), migrated from
#                   schemas/feature-delta-tier1-sections.yaml DEVOPS
#                   required_sections.
#
# Row schema = the EXISTING GateInvocation (nWave/flavors/_schema.yaml
# $defs/GateInvocation), reused verbatim — NOT a new shape (mirrors
# nWave/waves/design.yaml + discuss.yaml).

wave: devops

gate_stack:
  gate-out:
    - gate_id: verify-devops-review
      on_failure: block

# output_contract (SSOT-B) — the DEVOPS [REF] section list, migrated VERBATIM
# from schemas/feature-delta-tier1-sections.yaml waves.DEVOPS.required_sections.
output_contract:
  ref_sections:
    - id: Environment Matrix
      grade: mandatory
    - id: CI/CD Pipeline Outline
      grade: mandatory
    - id: Monitoring Contracts
      grade: mandatory
    - id: Deployment Strategy
      grade: mandatory
    - id: Mutation Testing Strategy
      grade: mandatory
    - id: Observability Stack
      grade: mandatory
    - id: Branching Strategy
      grade: mandatory
    - id: Coexistence Matrix
      grade: mandatory
    - id: Pre-requisites
      grade: mandatory
  files:
    - path: "docs/feature/{feature_id}/feature-delta.md"
      grade: mandatory
      inline_in_feature_delta: true
