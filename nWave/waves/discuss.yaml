# DISCUSS wave-contract — canonical, flavor-independent registry entry.
#
# f-wave-contract-coherence slice-01 (walking skeleton), ADR-FLOW-006 (D1 the
# registry, D2 the gate_stack shape). One file per wave carries the two symmetric
# SSOTs the wave prose points at instead of restating:
#
#   gate_stack     (SSOT-A) — the gate-in / gate-out ordered stacks. Migrated
#                  VERBATIM from the flavor-private wave_gate_stacks.discuss block
#                  (nWave/flavors/atdd_pure.yaml). The flavor block is NOT deleted
#                  in this slice — the dispatcher now reads this registry as the
#                  DISCUSS source (default), and the dead flavor copy is retired
#                  in slice-06 (the MOVE-completion). Behaviour byte-identical.
#   output_contract (SSOT-B) — what the DISCUSS wave must produce (the [REF]
#                  section list + the feature-delta file). Authored now, consumed
#                  by the feature-delta validator in slice-04.
#
# Row schema = the EXISTING GateInvocation (nWave/flavors/_schema.yaml
# $defs/GateInvocation), reused verbatim — NOT a new shape.

wave: discuss

gate_stack:
  gate-in:
    - gate_id: validate-feature-delta
      on_failure: block
  gate-out:
    - gate_id: validate-feature-delta
      on_failure: block
    - gate_id: verify-discuss-review
      on_failure: block

# output_contract (SSOT-B) — authored now, consumed slice-04 (feature-delta
# validator reads ref_sections for the per-wave [REF] list). TEN ref_sections
# are migrated from schemas/feature-delta-tier1-sections.yaml DISCUSS
# required_sections; Slice Plan + Wave-Decision Reconciliation are the two
# non-tier1 additions (brief §3 source-honesty note). A mandatory section that
# carries a greenfield_degradation string satisfies a presence-check on a
# greenfield feature by carrying the literal (honestly empty), not by absence.
output_contract:
  ref_sections:
    - id: Wave-Decision Reconciliation
      grade: mandatory
      greenfield_degradation: "(none — greenfield, no prior-wave corpus)"
    - id: Persona ID
      grade: mandatory
    - id: JTBD One-Liner
      grade: mandatory
    - id: Locked Decisions
      grade: mandatory
    - id: User Stories with Elevator Pitches
      grade: mandatory
    - id: Acceptance Criteria
      grade: mandatory
    - id: Definition of Done
      grade: mandatory
    - id: Out-of-Scope
      grade: mandatory
    - id: WS Strategy
      grade: mandatory
    - id: Driving Ports
      grade: mandatory
    - id: Slice Plan
      grade: mandatory
    - id: Pre-requisites
      grade: mandatory
  files:
    - path: "docs/feature/{feature_id}/feature-delta.md"
      grade: mandatory
