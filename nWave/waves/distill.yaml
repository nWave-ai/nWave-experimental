# DISTILL wave-contract — canonical, flavor-independent registry entry.
#
# f-design-devops-review-gate slice-03 (the AT-completeness auto-fire wiring).
# Carries the EXISTING completeness CLI (`check-slice-at-completeness`, zero new
# gate logic — already registered in the des dispatcher at
# src/des/cli/__main__.py) onto the DISTILL gate-out stack so an acceptance-
# designer's DISTILL return is mechanically AT-completeness-checked FROM the
# gate-stack, NOT from the /nw-distill orchestration prose step (brief §6 / DDD-5,
# closing KPI-3 / CT-8). The PRIMARY placement (the wave the check belongs to);
# the complementary DELIVER-entry BACKSTOP rides the atdd_pure dispatch.pre stack.
#
# Per ADR-FLOW-006 (D1 the registry, D2 the gate_stack shape, D6 the registry is
# the SOLE gate-stack source). This is the registry HOME, mirroring
# nWave/waves/design.yaml + devops.yaml — `wave_gate_stack_dispatch.resolve_stack`
# reads THIS file (NOT the flavor-private `distill` co-tenant block in
# atdd_pure.yaml, owned by f-coherence-and-attestation, which the spine does not
# resolve). The feature-delta text "wave_gate_stacks.distill.gate-out (flavor)"
# predates the slice-06 registry MOVE; the registry file is the resolved surface.
#
# Row schema = the EXISTING GateInvocation (nWave/flavors/_schema.yaml
# $defs/GateInvocation), reused verbatim — NOT a new shape (mirrors
# nWave/waves/design.yaml + devops.yaml + discuss.yaml).

wave: distill

# f-code-design-manifest-and-gate-g slice-04 (the coherence-gate WIRING slice,
# KPI-2 / CT-9 / AT-A1): the GENERAL design↔AT coherence gate
# (`gate-design-at-coherence`, renamed from gate-g by DDD-5; module des.cli.gate_g
# unchanged) is wired LIVE onto the DISTILL gate-out stack so it fires on EVERY
# DISTILL return -- closing the authored-but-unwired class for the gate that
# defends every other gate. This is the registry HOME (ADR-FLOW-006 D6 -- the SOLE
# gate-stack source `wave_gate_stack_dispatch.resolve_stack` resolves), NOT the
# dormant atdd_pure.yaml flavor co-tenant the spine never reads.
#
# DON'T-BREAK-SPINE (AT-3 / §22.0): gate-G fires on every DISTILL return, but a
# feature shipping NEITHER a code-design.manifest.yaml NOR a prose `[REF]
# Code-Design` block has nothing to diff -> the gate degrades to NOT_APPLICABLE
# (and UNVERIFIED on loose prose). `on_failure: warn` keeps a NA / UNVERIFIED
# non-blocking so the dogfood DISTILL of a manifest-absent feature is NEVER vetoed
# (a NA is no objection, never an authorizing GO).

# f-distill-wiring-to-registry slice-01 (DDD-1/DDD-2): self-attest (the
# verdict-validity layer, D9) and verify-test-runner (the TestRunnerPort CLI,
# ADR-042) are wired LIVE onto the DISTILL gate-out stack here -- the SOLE
# resolved surface (ADR-FLOW-006 D6) -- MOVE-completing them out of the dormant
# atdd_pure.yaml flavor co-tenant the spine never read (the false-credit source,
# now removed). Both carry on_failure: warn: the DISTILL return is a no-objection
# boundary (§22.0), not an authorizing GO -- a feature shipping no verdict record
# has nothing for self-attest to attest, and DISTILL AUTHORS tests but does not
# run them, so verify-test-runner is advisory at DISTILL-OUT. A warn surfaces the
# signal LOUD without vetoing a legitimately record-/runner-absent DISTILL return
# (the same don't-break-spine reasoning that put gate-design-at-coherence on warn).
# evolution-plan P3.1/P3.2 (spec-coverage gate wiring, ADVISORY): the
# ALREADY-BUILT `verify-spec-coverage` gate (src/des/cli/verify_spec_coverage.py,
# verdicts SpecCoverageVerified/Refused/Indeterminate) is referenced here so a
# DISTILL return is checked for requirement-checklist AT-coverage. `on_failure:
# warn` -- matches the sibling rows above: DISTILL gate-out is a no-objection
# boundary (§22.0), never an authorizing GO, and a feature shipping no
# requirement-checklist.md yet (P3.1 is greenfield, no shipped feature has
# produced one) has nothing for the gate to check -- an advisory skip, never a
# veto. NOTE (this slice's DISCOVERY): unlike the four rows above, this row is
# NOT dispatched through the shared `_discuss_gate_out_declarative` /
# `_REVIEW_GATE_OUT_WAVES` path (that closed set excludes "distill" -- the four
# rows above are DECLARED here but have no live invoker yet, see
# subagent_stop_service.py's module-level DISCOVERY comment). `verify-spec-
# coverage` gets its OWN narrow, always-exit-0 dispatch
# (`SubagentStopService._distill_gate_out_spec_coverage`) so it fires live on
# every DISTILL return without activating the still-unwired sibling rows.
gate_stack:
  gate-out:
    - gate_id: check-slice-at-completeness
      on_failure: block
    - gate_id: gate-design-at-coherence
      on_failure: warn
    - gate_id: self-attest
      on_failure: warn
    - gate_id: verify-test-runner
      on_failure: warn
    - gate_id: verify-spec-coverage
      on_failure: warn

# output_contract (SSOT-B) — what the DISTILL wave must produce (the [REF] section
# list the feature-delta validator enforces via --require-registry-sections distill).
# f-algebra-projections-enforced slice-03: at HEAD distill.yaml carried NO
# output_contract, so read_wave_output_contract("distill") yielded an EMPTY
# contract and every DISTILL [REF] section was treated as undeclared (silent
# pass-everything hole). EIGHT ref_sections are declared, mirroring discuss.yaml's
# shape: the SEVEN tier1 DISTILL required_sections (verbatim from
# schemas/feature-delta-tier1-sections.yaml waves.DISTILL.required_sections) plus
# Wave-Decision Reconciliation as the mandatory non-tier1 head entry (brief §3
# source-honesty note). A mandatory section carrying a greenfield_degradation
# string satisfies a presence-check on a greenfield feature by carrying the
# literal (honestly empty), not by absence.
output_contract:
  ref_sections:
    - id: Wave-Decision Reconciliation
      grade: mandatory
      greenfield_degradation: "(none — greenfield, no prior-wave corpus)"
    - id: Scenario List with Tags
      grade: mandatory
    - id: WS Strategy
      grade: mandatory
    - id: Adapter Coverage Table
      grade: mandatory
    - id: Scaffolds
      grade: mandatory
    - id: Test Placement
      grade: mandatory
    - id: Driving Adapter Coverage
      grade: mandatory
    - id: Pre-requisites
      grade: mandatory
    - id: Test Reuse & Consolidation Analysis
      grade: mandatory
