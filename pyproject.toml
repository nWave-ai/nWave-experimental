[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Regular packages (have __init__.py at root of each):
#   `nwave_ai` ships as nwave_ai/ — public CLI module, import target of
#   the `nwave-ai` console script.
#   `src/des` ships as des/ — DES runtime, src-layout flattening.
#
# `scripts/install` and `scripts/shared` are NOT in `packages` because
# `scripts/` lacks a top-level `__init__.py` and hatchling silently
# skips entries whose package root cannot be resolved. They are added
# via the force-include map below so they ship at exact path
# `scripts/install/` and `scripts/shared/` and remain importable as
# `scripts.install.*` and `scripts.shared.*` (PEP 420 namespace
# package via the implicit `scripts/` directory).
#
# Public PyPI wheel: patch_pyproject.py rewrites this entire section
# to a narrower force-include map (see release-prod.yml). Dev/RC use
# the wider map below; PyPI ships only nwave_ai + a curated subset.
packages = ["src/des", "nwave_ai"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/install" = "scripts/install"
"scripts/shared" = "scripts/shared"

[project]
name = "nwave"
version = "3.21.0+atddpure.01d27d9a3"
description = "Modern CLI installer for nwave with rich terminal UI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "Michele Brissoni", email = "michele.brissoni@brix.consulting" },
    { name = "Alessandro Digioia", email = "alessandro.digioia@brix.consulting" }
]
contributors = [
    { name = "Fabio (@lagom1985)" }
]
keywords = [
    "cli",
    "installer",
    "ai",
    "developer-tools",
    "automation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Typing :: Typed"
]

dependencies = [
    "rich>=13.7.0",
    "typer>=0.26.8",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.14.2",
    "httpx>=0.27.0",
    "platformdirs>=4.2.0",
    "pyyaml>=6.0",
    "packaging>=21.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "typing_extensions>=4.0",
    "jsonschema>=4.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "pytest-bdd>=7.0.0",
    "respx>=0.20.0",
    "jsonschema>=4.0.0"
]

[dependency-groups]
# Local dev toolchain (PEP 735). Installed by default on `uv sync`.
# Not published in package metadata (unlike the `test` extra above).
dev = [
    # Testing
    "pytest>=9.1.1",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "pytest-bdd>=7.0.0",
    "pytest-describe-it>=0.1.0",
    "pytest-html>=4.0.0",
    "pytest-pspec>=0.0.4",
    "pytest-mock>=3.12.0",
    "pytest-describe>=3.2.0",
    "pytest-watch>=4.2.0",
    "pytest-timeout>=2.3.1",
    "allure-pytest>=2.13.0",
    "respx>=0.20.0",
    "hypothesis>=6.155.7",
    # Mutation testing
    "cosmic-ray>=8.4.0",
    "mutmut>=3.6.0",
    # Linting & formatting
    "mypy>=1.8.0",
    "ruff==0.15.20",
    "bandit[toml]>=1.9.4",
    "detect-secrets>=1.4.0",
    # Git & release
    "pre-commit>=3.6.0",
    "commitizen>=4.16.4",
    "gitlint>=0.19.0",
    # Task runner (replaces Pipfile [scripts]; run via `uv run poe <task>`)
    "poethepoet>=0.47.0",
    # Utilities
    "fpdf2>=2.7.0",
    "click>=8.0.0",
    "colorama>=0.4.0",
    "tqdm>=4.68.3",
    # Token measurement (advisory, dev-only) — DDD-1
    "tiktoken>=0.7.0",
    # E2E container testing
    "testcontainers>=4.0.0",
    "docker>=7.0.0",
    # JSON Schema validation (used by tests/outcomes + tests/feature_delta)
    "jsonschema>=4.0.0",
    # Packaging (python -m build / scripts/build_dist.py)
    "build>=1.2.0",
    # pip — the WS-floor installable build leg shells `python -m pip wheel`
    # (src/des/cli/walking_skeleton_gate.py). uv venvs OMIT pip by default
    # (unlike the prior pipenv venv), so it MUST be declared or every
    # build-leg test (e.g. oss_feature_end_emit_cli) fails with
    # "No module named pip". Env-parity restore after the pipenv->uv merge.
    "pip>=24.0"
]

[project.urls]
Homepage = "https://github.com/nWave-ai/nWave"
Documentation = "https://github.com/nWave-ai/nWave#readme"
Repository = "https://github.com/nWave-ai/nWave"
Issues = "https://github.com/nWave-ai/nWave/issues"

[project.scripts]
nwave-ai = "nwave_ai.cli:main"
des = "des.cli.__main__:main"
verify-environmental-e2e = "des.cli.verify_environmental_e2e:main"

# F-LANGUAGE-ADAPTER-PLUGIN-INFRASTRUCTURE slice-02 substrate.
# Per ADR-031 Option C the canonical plugin-discovery substrate is the
# `nwave.lang.adapter` PyPI entry-points group. Slice-02 registers a single
# in-tree conformance fixture (a dual-base plugin: InstallationPlugin +
# LanguageAdapterPlugin) so the entry-points discovery has at least one
# witness; slice-05a (Python) and slice-07 (TypeScript) add real per-language
# plugins under the same group with the conformance check applying uniformly.
#
# M44 Option (a) registration path: the fixture lives under
# `scripts/install/plugins/` (NOT `src/des/ports/`) because it cross-imports
# both `des.ports.language_adapter_plugin` (pure ABC) AND
# `scripts.install.plugins.base.InstallationPlugin`. The pure ABC under
# `src/des/ports/` MUST NOT import from `scripts.*` (friction #38 + F-D-09).
[project.entry-points."nwave.lang.adapter"]
_conformance_fixture = "scripts.install.plugins._conformance_fixture_language_adapter:ConformanceFixtureLanguageAdapter"
nwave-lang-rust = "scripts.install.plugins.nwave_lang_rust:NwaveLangRust"

[tool.nwave]
# Override floor for nwave-ai public version (PyPI + GitHub).
# The pipeline auto-bumps from the public repo's current version.
# Only set this higher to force a version jump (e.g., 1.1.0 → 2.0.0).
# Leave unchanged for normal patch releases.
public_version = "1.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Anchor every collected module under its full rootdir-relative path so
# importlib mode assigns unique module names. Hyphenated test directories
# (e.g. plugin-architecture/, skill-restructuring/) cannot form valid dotted
# package paths; without this, pytest truncates such modules to their bare
# basename (test_walking_skeleton, acceptance) and same-named modules across
# the tree collide ("import file mismatch" / "No module named acceptance.conftest").
consider_namespace_packages = true
# Set strictness via ini booleans rather than addopts flags: pytest 9.0.x silently
# ignored --strict-markers/--strict-config passed through addopts (regression
# fixed in 9.1.0, pytest #14442). The ini booleans are immune to that regression
# class and enforce the same gate.
strict_markers = true
strict_config = true
# Global per-test hang-catcher (#19, pytest-timeout). Generous on purpose: a
# speed-limiter false-fails legitimate slow tests, a hang-catcher only
# interrupts a true infinite loop/deadlock. Slowest known test today is
# ~130s (BuildTier) so 600s leaves 4.6x margin. `thread` (not the default
# `signal`) because CI runs pytest-xdist `-n auto` (.github/workflows/ci.yml)
# and the signal-based timeout is unreliable in xdist worker processes.
timeout = 600
timeout_method = "thread"
addopts = [
    "-ra",
    "-q",
    "--import-mode=importlib",
    # Quarantined pre-FM-1 hooks.json schema tests (top-level array root) are
    # superseded by tests/e2e/test_codex_real_boot.py per DDD-7 (FM-4). They are
    # kept on disk for the audit trail but MUST NOT run by default — a bare
    # `pytest tests/` otherwise collects and fails them. This selector targets
    # ONLY the registered broken_schema_v0 mark; no other test is deselected.
    "-m",
    "not broken_schema_v0",
]
markers = [
    "acceptance: Acceptance tests (BDD scenarios, may be slow)",
    "canary: Canary skill injection detection tests (ADR-006)",
    "e2e_smoke: Critical-path e2e subset run in pre-push on master (privacy contract, behavioral smoke, packaging shape, cross-platform contract). Full e2e remains gated by CI on PR.",
    "e2e: End-to-end acceptance tests",
    "fast_gate: Fast source-level regression guards run pre-commit/pre-push",
    "integration: Integration tests (may use external resources)",
    "live_api: Tests that call paid external APIs (e.g. OpenAI); skipped unless relevant API key env var is set",
    "negative_at: Negative acceptance test -- asserts the WRONG outcome is NOT produced (GS-8). Detected by `des verify-negative-at` (explicit alternative to the _not_/_never_/_rejects_/_refuses_/_fails_ name convention).",
    "polyglot_smoke: Polyglot pilot smoke tests (per-pilot toolchain required: Node/npm for TS, dotnet for C#, cargo for Rust). Skipped automatically when toolchain absent.",
    "probe_test: Tests that exercise substrate probe wiring (opt-out from _silence_probe autouse)",
    "slice_01: Slice-01 traceability marker applied as a Python marker (pytest.mark.slice_01).",
    "slow: Tests that take longer to run",
    "unit: Unit tests (fast, isolated)",
    "walking_skeleton: Walking-skeleton acceptance tests applied as a Python marker (pytest.mark.walking_skeleton); distinct from the gherkin @walking_skeleton tag consumed by pytest_bdd_apply_tag.",
    "wiring_e2e: Walking-skeleton integration tests that wire spine CLIs together via real subprocess against a realistic tmp project (proves end-to-end composition, not isolated fixtures).",
]
# Suppress PytestUnknownMarkWarning floods from pytest-bdd dynamic
# tag-to-mark conversion. Each pytest-bdd scenario tag (e.g. @slice-01,
# @walking_skeleton, @contract-shape:*, @feature-*) is auto-converted into a
# pytest.mark.<tag> via getattr(pytest.mark, tag) at collection time
# (pytest_bdd/plugin.py:137); registering every transient feature/slice tag
# in the markers table above is impractical because new tags accrue per
# feature wave (slice-NN, contract-shape:*, feature-*) and would force a
# pyproject.toml edit per new feature.
#
# The suppression is scoped to PytestUnknownMarkWarning ONLY — other warning
# classes (DeprecationWarning, UserWarning, hypothesis warnings) continue to
# surface. The first-class registered marks above retain --strict-markers
# enforcement (pytest-bdd dynamic getattr is not caught by --strict-markers).
#
# Closes friction #14 F-PRE-PUSH-PYTEST-STDOUT-OVERFLOW (BlockingIOError on
# stdout pipe drain) and friction #28 F-PRECOMMIT-STREAM-BUFFER-FLAKINESS
# mechanically: 9 warning records per known-noisy collection (46 lines)
# collapse to ZERO warning records (≤ 6 lines), eliminating the pipe-buffer
# fill race condition empirically surfaced on slice-04 pre-push 2026-05-28.
#
# Feature: fix-cicd-warning-suppress slice-01 (Slice-Id: slice-01).
# AT-1 absent-warnings + AT-2 bounded-output-size GREEN per DISTILL
# at-scaffold-notes-slice-01.md.
filterwarnings = [
    "ignore::pytest.PytestUnknownMarkWarning",
]
norecursedirs = [
    ".venv",
    ".venv-mutation",
    "mutants",
    "node_modules",
    ".git",
    "__pycache__",
    "reports",
    "docs",
    ".nwave",
    ".claude",
    "target",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/des", "scripts/install"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "scripts/install/install_nwave_target_hooks.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:"
]
fail_under = 60
show_missing = true

[tool.mutmut]
# testarch-first ordering is a deliberate D12 dogfood-priority signal (the gate
# modules under src/des/testarch are mutated first); mutmut de-dupes the overlap
# with src/des, so do NOT "simplify" this back to src/des alone — that loses the
# priority signal. See ADR-TEST-002 D12.
paths_to_mutate = "src/des/testarch,src/des,scripts/install"
tests_dir = "tests/"
runner = "python -m pytest -x -q"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]
[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "PL",     # Pylint
    "RUF"     # Ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR2004", # magic value in comparison (too noisy)
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLC0415", # import not at top of file (intentional lazy loading)
    "ARG001",  # unused function argument (common in callbacks/fixtures)
    "ARG002",  # unused method argument (common in overrides)
    "ARG005",  # unused lambda argument
    "PTH123",  # open() vs Path.open() (stylistic)
    "B904",    # raise from err (stylistic in some cases)
    "SIM102",  # nested if (sometimes clearer)
    "SIM105",  # try-except-pass (sometimes intentional)
    "SIM117",  # multiple with statements (stylistic)
    "SIM115",  # open without context manager (sometimes necessary)
    "RUF012",  # mutable class attributes (too noisy)
    "RUF001",  # ambiguous unicode (false positives)
    "PTH118",  # os.path.join (stylistic)
    "PTH119",  # os.path.basename (stylistic)
    "PTH207",  # glob.glob vs Path.glob (stylistic)
    "PTH109",  # os.getcwd (stylistic)
    "PTH110",  # os.path.exists (stylistic)
    "PTH112",  # os.path.isdir (stylistic)
    "PTH113",  # os.path.isfile (stylistic)
    "PTH122",  # os.path.splitext (stylistic)
    "PLW1510", # subprocess.run without check (handled separately)
    "PLR0124", # name compared to itself (edge case in tests)
    "SIM112",  # use env.get instead of ternary (stylistic)
    "RUF043",  # unused async (can be intentional)
    "PLW0603", # global statement (singleton pattern)
    "PLW2901", # loop variable overwritten (common pattern)
]

[tool.ruff.lint.per-file-ignores]
# Tests can have more relaxed rules
"tests/**/*.py" = [
    "PLW1510",  # subprocess.run without check
    "B007",     # unused loop variable
    "B008",     # function call in default argument (fixtures)
    "RUF001",   # ambiguous unicode
    "RUF002",   # ambiguous unicode in docstrings — same class as RUF001, test prose
    "TC001",    # first-party type in TYPE_CHECKING — test composition classes used at runtime
    "TC002",    # third-party type in TYPE_CHECKING — same runtime-usage rationale
    "TC003",    # stdlib Path in TYPE_CHECKING — test files use Path at runtime via tmp_path
    "RUF005",   # list concatenation — acceptable in test code
    "F811",     # pytest-bdd false positive: fixture imported then injected as a step param
    "F403",     # `from steps import *` — pytest-bdd shared-step aggregation idiom
    "F405",     # name may be from star import — companion of F403 for shared steps
    "E402",     # import after sys.path-insert / scenarios() — pytest-bdd registration idiom
]
# Hook scripts may need inline imports
"scripts/hooks/**/*.py" = [
    "PLW1510",  # subprocess.run without check
]
# Legacy DES test files referencing pre-hexagonal classes (ScopeValidationResult, RealSubagentStopHook, SubagentStopHook)
# These tests are skipped pending redesign - see DES hexagonal architecture migration
"tests/des/unit/adapters/drivers/hooks/test_audit_logging_integration.py" = ["F821"]
"tests/des/unit/adapters/drivers/hooks/test_clean_execution_silence.py" = ["F821"]
"tests/des/unit/adapters/drivers/hooks/test_scope_validation_integration.py" = ["F821"]
"tests/des/unit/application/test_orchestrator_recovery_integration.py" = ["F821"]
"tests/des/acceptance/test_us003_post_execution_validation.py" = ["F821"]
"tests/des/acceptance/test_post_execution_validation.py" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["crafter_ai", "des", "scripts"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.commitizen]
# WARNING: the tool.commitizen.version is tracking the LAST STABLE version and is updated by the pipeline!
# DON'T TOUCH IT!
version = "3.21.0"
version_scheme = "pep440"
version_files = [
    "nWave/VERSION",
    "nWave/framework-catalog.yaml:version",
]
tag_format = "v$version"
name = "cz_conventional_commits"
commit_parser = "conventional"
changelog_file = "CHANGELOG.md"
major_version_zero = false
bump_message = "chore(release): v$new_version [skip ci]"
update_changelog_on_bump = true

[tool.poe.tasks]
# Dev task runner — replaces the former Pipfile [scripts] block.
# Run with: `uv run poe <task>` (or `poe <task>` inside an activated .venv).
# Testing (alphabetical)
mutation-test    = "mutmut run --paths-to-mutate=src/des,scripts/install"
test             = "python -m pytest tests/ --pspec --tb=short --color=yes"
test-fast        = "python -m pytest tests/ -n 4 --dist worksteal --tb=short --color=yes"
test-acceptance  = "python -m pytest tests/des/acceptance/ tests/installer/acceptance/ tests/plugins/plugin-architecture/acceptance/ tests/bugs/ --pspec --tb=short --color=yes"
test-allure      = "python -m pytest tests/ --pspec --tb=short --alluredir=reports/allure-results --color=yes"
test-bugs        = "python -m pytest tests/bugs/ --pspec --tb=short --color=yes"
test-coverage    = "python -m pytest tests/ -q --cov=src --cov=scripts --cov-report=term-missing --cov-report=html:reports/htmlcov"
test-des         = "python -m pytest tests/des/ --pspec --tb=short --color=yes"
test-des-unit    = "python -m pytest tests/des/unit/ --pspec --tb=short --color=yes"
test-e2e         = "python -m pytest tests/des/e2e/ tests/installer/e2e/ tests/plugins/plugin-architecture/e2e/ --pspec --tb=short --color=yes"
test-full        = "python -m pytest tests/ --pspec --tb=short --cov=src --cov=scripts --cov-report=term-missing --cov-report=html:reports/htmlcov --html=reports/test-report.html --self-contained-html --alluredir=reports/allure-results --color=yes"
test-html        = "python -m pytest tests/ --pspec --tb=short --html=reports/test-report.html --self-contained-html --color=yes"
test-installer   = "python -m pytest tests/installer/ --pspec --tb=short --color=yes"
test-integration = "python -m pytest tests/des/integration/ tests/plugins/plugin-architecture/integration/ --pspec --tb=short --color=yes"
test-not-slow    = "python -m pytest tests/ -m 'not slow' --pspec --tb=short --color=yes"
test-plugins     = "python -m pytest tests/plugins/ --pspec --tb=short --color=yes"
test-unit        = "python -m pytest tests/des/unit/ tests/installer/unit/ tests/plugins/plugin-architecture/unit/ tests/plugins/install/ --pspec --tb=short --color=yes"
# Linting & formatting (alphabetical)
format           = "ruff format src/ scripts/ tests/"
format-check     = "ruff format --check src/ scripts/ tests/"
lint             = "ruff check src/ scripts/ tests/"
typecheck        = "mypy src/des/"
# Validation (alphabetical)
validate         = "python scripts/local_ci.py"
validate-fast    = "python scripts/local_ci.py --fast"
validate-yaml    = "python scripts/validation/validate_yaml_files.py"
# Build, docs & hooks (alphabetical)
build            = "python scripts/build_dist.py"
docgen           = "python scripts/docgen.py"
install-hooks    = "pre-commit install --install-hooks --overwrite"  # all hook types via default_install_hook_types; --overwrite forces a clean install (no migration-mode chaining of a stale/foreign hook)
verify-hooks     = "python scripts/validation/verify_hooks.py"  # fails loudly unless every default_install_hook_types hook is installed, pre-commit-managed, and not bypassed by core.hooksPath
