# GOLDEN FIXTURE (clean -- every failure mode covered) -- M11 gate.
#
# This is NOT a real component manifest. It is the coverage-half precision corpus
# the slice-07 gate cross-checks: a component manifest whose every failure_modes
# entry has at least one matching named test in scope. Per Mandate 11 this is
# compliant -- every declared failure mode is enumerated by a named sad-path
# test. The M11 coverage cross-check MUST NOT flag it
# (``detect_failure_mode_coverage(...).flagged is False``).
#
# The composition supplies the covering named tests
# (COVERED_FAILURE_MODE_TEST_NAMES): test_install_fails_when_disk_full and
# test_install_fails_when_permission_denied -- one per declared mode.

component: install_writer
failure_modes:
  - id: disk_full
    description: "the target filesystem runs out of space mid-write"
  - id: permission_denied
    description: "the target path is not writable by the current user"
